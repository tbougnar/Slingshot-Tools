name: Slingshot — rebuild and re-upload one paid installer

# The Friday lane only ever builds the week's new app, and paid/ is gitignored,
# so a product whose installer is missing, stale or wrong has no way back
# through it. The verifier uploads the exact paid source as a private artifact,
# so that artifact is restored here and the installer is rebuilt from the real
# file, not from a free edition that a paid-only catalog no longer has.
#
#     gh workflow run rebuild-paid.yml -f slug=file-renamer -f source_run_id=45710673551
#
# It refuses a product that is missing from the catalogue, has no restored paid
# source, or is priced outside the floor and ceiling. It replaces the store
# build; it does not put anything on sale, which is itch_publish.py's job and
# still waits for the store to charge the advertised price.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "catalogue slug of the paid product, e.g. file-renamer"
        required: true
        type: string
      source_run_id:
        description: "verify run whose paid-build artifact holds the real paid source"
        required: true
        type: string

permissions:
  contents: read
  # the paid source is a private artifact from the verify run
  actions: read

concurrency:
  group: slingshot-rebuild-paid
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PRICE_FLOOR: '1.00'
      PRICE_CEILING: '10.00'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        # The Chocolatey feed answered 406/504 and stopped a real release, so
        # every Windows lane uses the same direct NSIS installer.
        run: |
          ./install_nsis.ps1
          python -m pip install --quiet pillow requests pyinstaller pywebview

      - name: Restore the paid source from the verifier
        uses: actions/download-artifact@v4
        with:
          name: paid-build
          path: paid/
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: tbougnar/Slingshot-Tools

      - name: Install butler, itch.io's uploader
        shell: bash
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          7z x butler.zip -obutler -y
          echo "$PWD/butler" >> $GITHUB_PATH

      - name: Rebuild the paid edition and replace the store build
        run: python rebuild_paid.py "${{ inputs.slug }}"
        env:
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_STORE_URL: ${{ vars.ITCH_STORE_URL }}
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
