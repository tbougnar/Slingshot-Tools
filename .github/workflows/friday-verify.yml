name: Slingshot — verify, install and publish (after the Friday build)

# Runs by itself the moment Friday's generation finishes, so verification is
# never a manual step. Only a successful generate is worth checking.

on:
  workflow_run:
    workflows: ["Slingshot — Friday, generate the week's tool"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slingshot-verify
  cancel-in-progress: false

jobs:
  verify:
    # only after a generate that actually produced a candidate
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      PRICE_FLOOR: '1.00'
      PRICE_CEILING: '10.00'
      PRICE_START: "3.00"
      SLINGSHOT_MONTHLY_HOURS: "30"
      SLINGSHOT_EMERGENCY_HOURS: "3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Install tools
        run: |
          python -m pip install --quiet pillow requests playwright
          python -m playwright install --with-deps chromium
        continue-on-error: true

      - name: Is there budget left this month
        run: python budget.py check --label friday-verify --need 0.6

      - name: Refresh the fixbook the AI reads
        run: python write_fixbook.py

      - name: Verify in a real browser, repair, and publish only if clean
        run: python verify_app.py

      - name: Confirm nothing paid is public
        run: python check_exposure.py

      - name: Confirm no paid source, money or credential is tracked
        run: python check_repo_hygiene.py

      - name: Nothing protected was touched
        run: python weekly_guard.py check

      # The installer job runs on a fresh Windows checkout, so everything this
      # job produced (catalog, free edition, paid source, published manifest)
      # has to be pushed to main before the next job can see it.
      - name: Commit verification results
        run: |
          git config user.name "slingshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "feat: verified new Slingshot Tool [skip ci]" || echo "nothing to commit"
          git fetch origin main
          git rebase origin/main || git -c rebase.autoStash=true pull --rebase origin main
          git fetch origin main && git pull --rebase origin main && git push || (git pull --rebase origin main && git push) || echo "push failed"

      # paid/ is gitignored on purpose, so the paid build can never be public.
      # Pass it to the Windows job as a private artifact instead of through git.
      - name: Upload the paid build for the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: paid-build
          path: paid/
          if-no-files-found: error

  # Only the Windows installer needs Windows, so it gets its own job.
  installer:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PRICE_FLOOR: '1.00'
      PRICE_CEILING: '10.00'
      PRICE_START: "3.00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Restore the paid build the verify job produced (it is gitignored and
      # never committed, so it must travel as an artifact between jobs).
      - name: Download the paid build
        uses: actions/download-artifact@v4
        with:
          name: paid-build
          path: paid/

      - name: Install build tools
        run: |
          choco install nsis -y --no-progress
          # The community feed returns 406 now and then. Try again before
          # declaring the paid edition unbuildable, because the installer is
          # the whole point of this job.
          if (-not (Test-Path "$env:ProgramFiles\NSIS\makensis.exe")) {
            Write-Output "::warning::NSIS was not installed; trying once more"
            Start-Sleep -Seconds 20
            choco install nsis -y --no-progress
          }
          # playwright and its browser are needed here, not only in the verify
          # job. itch_publish logs in through a browser when the stored session
          # cookie is refused, and without this it stopped with "playwright is
          # not installed, so a new session cannot be made" before it ever
          # tried. The session cookie is the only credential here that
          # expires, so this path is the one that has to keep working.
          python -m pip install --quiet pillow requests pyinstaller pywebview playwright
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright; print('playwright import ok')"
          # same PATH problem as the generate job: choco reports success, and
          # the next line says makensis is not recognised
          $makensis = "$env:ProgramFiles\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          if (-not (Test-Path $makensis)) {
            Write-Output "::error::NSIS installed but makensis.exe was not found"
            exit 1
          }
          Write-Output "makensis at $makensis"
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path $makensis)

      # butler is itch.io's own uploader. Without it the installer cannot be
      # pushed, so it is fetched here rather than trusted to be on the runner.
      - name: Install butler, itch.io's uploader
        shell: bash
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/windows-amd64/LATEST/archive/default
          7z x butler.zip -obutler -y
          echo "$PWD/butler" >> $GITHUB_PATH
      # itch.io is the store now, so this builds the installer and prints where
      # it is. Uploading it, setting the itch_url and flipping the paid tier are
      # all manual, because only a person can confirm the itch.io page is live.
      - name: Build the Windows installer
      # - name: Submit installer for signing (SignPath)
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: slingshot-tools
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: windows-installer
      #     github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      #     github-token: ${{ secrets.GITHUB_TOKEN }}

        run: python build_paid_only.py

      # The installer is finished but private, so it travels as an artifact
      # rather than through git, where paid/ is gitignored and must stay that
      # way. Nothing downloads it here: a person uploads it to itch.io.
      - name: Keep the built installer for the itch.io upload
        uses: actions/upload-artifact@v4
        with:
          name: slingshot-installer
          path: paid/**/*Setup.exe
          if-no-files-found: error
          retention-days: 30

      # itch.io is the store. This creates the project if it is missing, pushes
      # the installer with butler, checks the page really answers, and only then
      # flips the product to published on the site. The order matters: nothing
      # is advertised before itch.io is confirmed to be serving it.
      # The publish step is recorded, and its outcome is carried into the summary,
      # but it does not stop the release. The free edition is worth shipping
      # even when the store has not answered, and a failure here used to be
      # invisible: the job went green with nothing on sale. What was wrong was
      # the silence, not the failure, so it is now written where the next step
      # and the run summary both have to see it.
      - name: Put the tool on itch.io, then publish it on the site
        id: publish
        continue-on-error: true
        run: python itch_publish.py
        env:
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          ITCH_SESSION_COOKIE: ${{ secrets.ITCH_SESSION_COOKIE }}
          # the account credentials, which do not expire. They let the
          # publisher log in and mint its own session whenever the stored
          # cookie is refused, so nobody has to paste a new cookie.
          ITCH_LOGIN: ${{ secrets.ITCH_LOGIN }}
          ITCH_PASSWORD: ${{ secrets.ITCH_PASSWORD }}
          ITCH_CHANNEL: "windows"

      # The record step needs an id of its own. Without one, PUBLISHED was
      # written to an output belonging to this step and read by nothing, so
      # the whole calculation was dead and the job reported success either
      # way. The audit found this by parsing the workflow rather than by
      # watching a release go wrong.
      - name: Record whether anything is actually for sale
        id: paid
        shell: bash
        run: |
          if [ "${{ steps.publish.outcome }}" != "success" ]; then
            echo "::warning::the paid edition was not published; the free" \
                 "edition is shipping and the paid card stays hidden"
            echo "PUBLISHED=no" >> "$GITHUB_OUTPUT"
          else
            echo "PUBLISHED=yes" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### What actually shipped"
            echo ""
            if [ "${{ steps.publish.outcome }}" = "success" ]; then
              echo "- paid edition on itch.io: **published**"
            else
              echo "- paid edition on itch.io: **NOT PUBLISHED**"
            fi
            echo "- free edition: shipped"
          } >> "$GITHUB_STEP_SUMMARY"
      # the upload step must fail loudly if there is no installer at all,
      # otherwise "no file found" looks like a successful release
      - name: An installer exists, or the release says so
        run: python build_paid_only.py --check
        env:
          ITCH_USER: ${{ vars.ITCH_USER }}
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          ITCH_SESSION_COOKIE: ${{ secrets.ITCH_SESSION_COOKIE }}
          # the account credentials, which do not expire. They let the
          # publisher log in and mint its own session whenever the stored
          # cookie is refused, so nobody has to paste a new cookie.
          ITCH_LOGIN: ${{ secrets.ITCH_LOGIN }}
          ITCH_PASSWORD: ${{ secrets.ITCH_PASSWORD }}
          ITCH_CHANNEL: "windows"
      # Discord is best-effort: no credentials, or a Discord outage, must never
      # stop a release. discord_post.py posts through DISCORD_WEBHOOK_URL when
      # one is set and falls back to the bot token, so either credential works.
      # Ballots are NOT handled here: votes hold Discord user ids and a CI
      # runner is thrown away when the job ends, so the long-lived bot host owns
      # the poll lifecycle (see DISCORD_BOT_SETUP.md).
      - name: Write and post the Discord article
        run: python discord_article.py
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      - name: Announce the new tool in Discord
        run: python discord_announce.py
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}

      - name: Refresh the channels that go stale as tools ship
        continue-on-error: true
        run: python discord_intro.py

      - name: No channel is left empty
        continue-on-error: true
        run: python discord_intro.py --check

      - name: Can any product be retired
        continue-on-error: true
        run: python retire_product.py --list

      - name: How much of the month's budget is gone
        if: always()
        run: python budget.py status
      - name: Commit the store manifest
        run: |
          git config user.name "slingshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "build: windows installer [skip ci]" || echo "nothing to commit"
          git fetch origin main && git pull --rebase origin main && git push || (git pull --rebase origin main && git push) || echo "push failed"

      - name: Commit and publish the site
        run: |
          git config user.name "slingshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "feat: verified new Slingshot Tool [skip ci]" || echo "nothing to commit"
          git fetch origin main && git pull --rebase origin main && git push || (git pull --rebase origin main && git push) || echo "push failed"

      # This runs last on purpose. The free edition has shipped by now, which
      # is what we want: one dead destination must not cost the customer the
      # release that did work. But the job must not report success while a
      # destination it attempted silently failed, because a green run is how
      # "nothing is on sale and nobody noticed" happens. Set ALLOW_FREE_ONLY
      # to accept the partial release deliberately.
      - name: Say plainly whether the paid edition reached the store
        if: always()
        shell: bash
        env:
          PUBLISHED: ${{ steps.paid.outputs.PUBLISHED }}
          ALLOW_FREE_ONLY: ${{ vars.ALLOW_FREE_ONLY }}
        run: |
          if [ "$PUBLISHED" = "yes" ]; then
            echo "paid edition is on itch.io and advertised"
            exit 0
          fi
          if [ "$ALLOW_FREE_ONLY" = "true" ]; then
            echo "::warning::paid edition was NOT published; continuing because" \
                 "ALLOW_FREE_ONLY is set. The free edition shipped."
            exit 0
          fi
          echo "::error::the paid edition was NOT published to itch.io." \
               "The free edition shipped and the paid card stays hidden, but" \
               "this release is not complete. Check the itch.io step above for" \
               "the credentials or upload error, then set ALLOW_FREE_ONLY to" \
               "true if shipping free-only is intended."
          exit 1
