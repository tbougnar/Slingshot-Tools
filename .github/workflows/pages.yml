name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "links.py"
      - "sync_links.py"
      # the countdown on the homepage changes when these do, so a version bump
      # or a new plan has to be able to reach the site on its own
      - "update_state.py"
      - "update_plan.py"
      - "data/update_state.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # the invite helper writes DISCORD_INVITE_URL back to the repository so the
  # next run starts with a working link instead of minting another one
  actions: write

concurrency:
  group: slingshot-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # the footer links come from links.py, so the site, the Discord welcome
      # and the YouTube descriptions can never name different addresses
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Invites expire on their own. The bot is already in the server, so let
      # it replace a dead one before the check below looks at it. Without this
      # every expiry stopped the site deploy until a person pasted a new URL
      # into a repository variable.
      - name: Keep the Discord invite alive
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_ANNOUNCEMENTS_CHANNEL_ID: ${{ secrets.DISCORD_ANNOUNCEMENTS_CHANNEL_ID }}
          DISCORD_INVITE_URL: ${{ vars.DISCORD_INVITE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python discord_invite.py

      # CHECK_LIVE_FOOTER=0 because this compares links.py against the page
      # that is already live. Checked here it would refuse the deploy that
      # would satisfy it, so no link could ever be changed. It is run again
      # below, once the site is actually up.
      - name: Confirm the links still work
        env:
          CHECK_LIVE_FOOTER: "0"
        run: python check_links.py

      - name: Refresh the platform links
        run: python sync_links.py

      # The countdown data is generated here rather than committed, for the
      # same reason the links are: it has to be true at the moment the site is
      # published. Committing it would leave a stale date on the page for as
      # long as nobody touched the file, which is exactly the bug this
      # replaced. Nothing is committed, so site/ stays protected.
      - name: Refresh the release countdown
        run: python update_state.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Confirm the deployed footer matches
        run: python check_links.py
