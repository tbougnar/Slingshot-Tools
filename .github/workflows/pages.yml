name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "links.py"
      - "sync_links.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slingshot-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # the footer links come from links.py, so the site, the Discord welcome
      # and the YouTube descriptions can never name different addresses
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm the links still work
        run: python check_links.py

      - name: Refresh the platform links
        run: python sync_links.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
