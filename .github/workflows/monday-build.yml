name: Slingshot - generate an app (1st, 07:00)

on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slingshot-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      PRICE_FLOOR: '1.00'
      PRICE_CEILING: '10.00'
      PRICE_START: "3.00"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --quiet pillow requests pyinstaller pywebview playwright pyyaml
          python -m playwright install chromium

      - name: Behaviour self-test
        run: python selftest.py

      - name: Adversarial self-test
        run: python selftest_deep.py

      - name: Whole-code audit
        run: python selftest_audit.py

      - name: Generate an app and stage it for verification
        run: python stage_app.py

      - name: Decide the price
        run: python pricing.py

      - name: Save the candidate for the verifier
        run: |
          git add -A
          git -c user.name="slingshot-bot" -c user.email="bot@users.noreply.github.com" commit -q -m "candidate: staged for verification"
          git push || echo "push failed"

      # If generation fails, the debugger team wakes up and diagnoses it.
  selfheal:
    needs: generate
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SELFHEAL_MAX: '3'
      # gh cannot read the failing run without this, which is the whole input
      # the debugger has
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare the debugger
        run: python -m pip install --quiet requests

      - name: Fetch the failing log
        run: |
          mkdir -p selfheal
          gh run view ${{ github.run_id }} --log-failed > selfheal/failure.txt 2>&1 || true
          gh run view ${{ github.run_id }} --job ${{ github.job }} --log >> selfheal/failure.txt 2>&1 || true

      - name: Let the model diagnose and patch
        run: python selfheal.py 1

      - name: Push the patch
        if: success()
        run: git push || echo "nothing to push"
