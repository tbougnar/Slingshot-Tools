name: Slingshot - verify and publish (1st, 08:00, after generate)

# Deliberately an hour after the generator. The model allowance is per minute
# for the whole account, so verifying in the same minute as generating leaves
# the debugger team with nothing and no app can ever pass QA.

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:
  # Runs by itself the moment a build finishes, so verification is never a
  # manual step. Only a successful generate is worth checking.
  workflow_run:
    workflows: ["Slingshot - generate an app (1st, 07:00)"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: slingshot-verify
  cancel-in-progress: false

jobs:
  verify:
    # only after a generate that actually produced a candidate
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: 72d86a35ce85cf491146e9f10cc2caca
      CF_BUILDS_NAMESPACE: 3d55488f7d384ce3ad51c0ba34afeade
      PAY_WORKER: ${{ secrets.PAY_WORKER }}
      SITE_URL: ${{ vars.SITE_URL }}
      PRICE_FLOOR: '1.00'
      PRICE_CEILING: '10.00'
      PRICE_START: "3.00"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - name: Install tools
        run: |
          python -m pip install --quiet pillow requests playwright
          python -m playwright install --with-deps chromium
        continue-on-error: true

      - name: Refresh the fixbook the AI reads
        run: python write_fixbook.py

      - name: Verify in a real browser, repair, and publish only if clean
        run: python verify_app.py

      - name: Confirm nothing paid is public
        run: python check_exposure.py

      # The installer job runs on a fresh Windows checkout, so everything this
      # job produced (catalog, free edition, paid source, published manifest)
      # has to be pushed to main before the next job can see it.
      - name: Commit verification results
        run: |
          git config user.name "slingshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "feat: verified new Slingshot Tool [skip ci]" || echo "nothing to commit"
          git fetch origin main
          git rebase origin/main || git -c rebase.autoStash=true pull --rebase origin main
          git fetch origin main && git pull --rebase origin main && git push || (git pull --rebase origin main && git push) || echo "push failed"

      # paid/ is gitignored on purpose, so the paid build can never be public.
      # Pass it to the Windows job as a private artifact instead of through git.
      - name: Upload the paid build for the Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: paid-build
          path: paid/
          if-no-files-found: error

  # Only the Windows installer needs Windows, so it gets its own job.
  installer:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: 72d86a35ce85cf491146e9f10cc2caca
      CF_BUILDS_NAMESPACE: 3d55488f7d384ce3ad51c0ba34afeade
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PRICE_FLOOR: '1.00'
      PRICE_CEILING: '10.00'
      PRICE_START: "3.00"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Restore the paid build the verify job produced (it is gitignored and
      # never committed, so it must travel as an artifact between jobs).
      - name: Download the paid build
        uses: actions/download-artifact@v4
        with:
          name: paid-build
          path: paid/

      - name: Install build tools
        run: |
          choco install nsis -y --no-progress
          python -m pip install --quiet pillow requests pyinstaller pywebview
      - name: Build the Windows installer and publish it to the store
      # - name: Submit installer for signing (SignPath)
      #   uses: signpath/github-action-submit-signing-request@v1
      #   with:
      #     api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
      #     organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
      #     project-slug: slingshot-tools
      #     signing-policy-slug: release-signing
      #     artifact-configuration-slug: windows-installer
      #     github-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      #     github-token: ${{ secrets.GITHUB_TOKEN }}

        run: python build_paid_only.py
      # Discord is best-effort: a missing webhook or a Discord outage must never
      # stop a release. Ballots are NOT handled here: votes hold Discord user
      # ids and a CI runner is thrown away when the job ends, so the long-lived
      # bot host owns the poll lifecycle (see DISCORD_BOT_SETUP.md).
      - name: Write the Discord article for the new tool
        run: python discord_article.py
        continue-on-error: true
      - name: Announce the new tool in Discord
        run: python discord_announce.py
        continue-on-error: true
      - name: Commit the store manifest
        run: |
          git config user.name "slingshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "build: windows installer [skip ci]" || echo "nothing to commit"
          git fetch origin main && git pull --rebase origin main && git push || (git pull --rebase origin main && git push) || echo "push failed"

      - name: Commit and publish the site
        run: |
          git config user.name "slingshot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "feat: verified new Slingshot Tool [skip ci]" || echo "nothing to commit"
          git fetch origin main && git pull --rebase origin main && git push || (git pull --rebase origin main && git push) || echo "push failed"
