name: Slingshot — check the connections

# A single job that proves every credential the pipeline needs, without
# building anything. Run it by hand after changing a secret, so a bad value is
# found in seconds rather than at 07:00 on Friday.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slingshot-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ITCH_USER: ${{ vars.ITCH_USER }}
      ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
      ITCH_SESSION_COOKIE: ${{ secrets.ITCH_SESSION_COOKIE }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # The Shorts channel is optional at launch. Without this opt-out a
      # missing YouTube credential fails the whole connection check, and with
      # it the absence is stated rather than mistaken for a working upload.
      ALLOW_FREE_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # the hygiene check reads the whole log, because a secret
          # that was committed and then deleted is still readable there
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet requests pillow pyyaml

      - name: Find a working ElevenLabs endpoint
        if: env.ELEVENLABS_API_KEY != ''
        run: python shorts_probe.py

      - name: Are the credentials good
        run: python check_connections.py

      - name: Are the platform links alive
        run: python check_links.py

      - name: Is the repository sound
        run: |
          python check_exposure.py
          python check_repo_hygiene.py
          python weekly_guard.py check
          python selftest.py
          python selftest_audit.py