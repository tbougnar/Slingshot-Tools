<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DiffMate – Text Diff Tool</title><style>body{margin:0;font-family:sans-serif;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.4rem;cursor:pointer;margin:.2rem}button:hover{opacity:.9}input,textarea,select{width:100%;padding:.5rem;margin:.2rem 0;border:1px solid #ccc;border-radius:.4rem}textarea{height:120px;resize:vertical}section{background:#fff;padding:1rem;border-radius:.6rem;box-shadow:0 2px 5px rgba(0,0,0,.1);margin-bottom:1rem}html[data-theme='dark'] section{background:#1e1a1a}#themeToggle{position:absolute;top:1rem;right:1rem;background:#fff;color:#14100F}</style></head><body><header>DiffMate – Text Diff Tool</header><button id="themeToggle">Toggle Theme</button><main><section id="emptyState"><p>Enter two texts below to see line‑by‑line differences.</p></section><section id="inputSection" style="display:none;"><form id="diffForm"><label for="textA">Original Text</label><textarea id="textA" required></textarea><label for="textB">Modified Text</label><textarea id="textB" required></textarea><button type="submit" id="compareBtn">Compare</button></form></section><section id="resultSection" style="display:none;"><h2>Differences</h2><pre id="diffResult" style="white-space:pre-wrap"></pre><div id="fullControls" style="margin-top:1rem;"><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></div></section></main><footer>© 2026 DiffMate</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='diffmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||null}catch(e){return null}};const save=v=>localStorage.setItem(K,JSON.stringify(v));function applyTheme(){let theme=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=theme}applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{let cur=document.documentElement.dataset.theme;let nxt=cur==='light'?'dark':'light';document.documentElement.dataset.theme=nxt;localStorage.setItem('theme',nxt)});function init(){let data=load();if(data&&data.textA&&data.textB){document.getElementById('emptyState').style.display='none';document.getElementById('inputSection').style.display='block';document.getElementById('textA').value=data.textA;document.getElementById('textB').value=data.textB;compare();}else{document.getElementById('emptyState').style.display='block'} }function diffLines(a,b){let al=a.split('\n');let bl=b.split('\n');let max=Math.max(al.length,bl.length);let out='';for(let i=0;i<max;i++){let aa=al[i]||'';let bb=bl[i]||'';if(aa===bb){out+=` ${i+1}| ${aa}\n`; }else{out+=`-${i+1}| ${aa}\n+${i+1}| ${bb}\n`;}}return out}function compare(e){if(e) e.preventDefault();let a=document.getElementById('textA').value;let b=document.getElementById('textB').value;save({textA:a,textB:b});let diff=diffLines(a,b);document.getElementById('diffResult').textContent=diff;document.getElementById('emptyState').style.display='none';document.getElementById('inputSection').style.display='block';document.getElementById('resultSection').style.display='block';if(!LIM.export){document.getElementById('exportBtn').style.display='none'}if(!LIM.bulk){document.getElementById('importBtn').style.display='none'} }document.getElementById('diffForm').addEventListener('submit',compare);document.getElementById('exportBtn').addEventListener('click',()=>{let data=load();let blob=new Blob([JSON.stringify(data)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='diffmate-data.json';a.click();URL.revokeObjectURL(url)});document.getElementById('importBtn').addEventListener('click',()=>{document.getElementById('importFile').click()});document.getElementById('importFile').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=ev=>{try{let obj=JSON.parse(ev.target.result);save(obj);location.reload();}catch{alert('Invalid file')}};reader.readAsText(file)});init();</script></body></html>
