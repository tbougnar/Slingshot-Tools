<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MarkLite – Markdown Editor</title><style>body{font-family:sans-serif;margin:0;padding:0;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh;transition:background 0.3s,color 0.3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer;margin:0.2rem}button:disabled{opacity:.5;cursor:default}textarea{width:100%;height:150px;padding:.5rem;border:1px solid #ccc;border-radius:.3rem}#list{margin-top:1rem;display:grid;gap:1rem} .card{background:#fff;padding:1rem;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,0.1)}html[data-theme='dark'] .card{background:#1e1a1a} .empty{text-align:center;color:#777}</style></head><body><header>MarkLite – Markdown Editor</header><main><button id="themeToggle">Toggle Theme</button><section id="editor"><h2>New Note</h2><form id="noteForm"><label for="mdInput" class="sr-only">Markdown</label><textarea id="mdInput" placeholder="Enter markdown..." required></textarea><br><button type="submit" id="addBtn">Add Note</button></form></section><section id="listSection"><h2>Your Notes</h2><div id="list" class="empty">No notes yet. Write something and click “Add Note”.</div></section><section id="exportSection" style="margin-top:1rem;display:none"><button id="exportBtn">Export My Data</button><input type="file" id="importInput" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section></main><footer>© 2026 MarkLite</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:0,export:true,themes:"all",bulk:true,history:true};const K='marklite.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[] }catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let notes=load();function render(){const list=document.getElementById('list');list.innerHTML='';if(notes.length===0){list.textContent='No notes yet. Write something and click “Add Note”.';list.classList.add('empty');}else{list.classList.remove('empty');notes.forEach((n,i)=>{const card=document.createElement('div');card.className='card';const pre=document.createElement('pre');pre.textContent=n;card.appendChild(pre);list.appendChild(card);});}if(LIMITS.export){document.getElementById('exportSection').style.display='block';}else{document.getElementById('exportSection').style.display='none';}}function addNote(e){e.preventDefault();const txt=document.getElementById('mdInput').value.trim();if(!txt)return;if(LIMITS.maxItems && notes.length>=LIMITS.maxItems){alert('Item limit reached.');return;}notes.unshift(txt);save(notes);document.getElementById('mdInput').value='';render();}function exportData(){const data=JSON.stringify(notes,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='marklite-data.json';a.click();URL.revokeObjectURL(url);}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const arr=JSON.parse(reader.result);if(Array.isArray(arr)){notes=arr;save(notes);render();}}catch(err){alert('Invalid file');}};reader.readAsText(file);}function toggleTheme(){const cur=document.documentElement.dataset.theme;document.documentElement.dataset.theme=cur==='dark'?'light':'dark';localStorage.setItem('theme',document.documentElement.dataset.theme);}function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved;}else{document.documentElement.dataset.theme='light';}}document.getElementById('addBtn').addEventListener('click',addNote);document.getElementById('noteForm').addEventListener('submit',addNote);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importInput').click());document.getElementById('importInput').addEventListener('change',importData);document.getElementById('themeToggle').addEventListener('click',toggleTheme);initTheme();render();</script></body></html>
