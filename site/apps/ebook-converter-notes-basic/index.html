<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NoteNest - Reading Notes Organizer</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center;font-size:1.5rem}footer{margin-top:auto;background:#C1272D;color:#F6EFEC;padding:0.5rem;text-align:center;font-size:0.9rem}main{padding:1rem;display:flex;flex-direction:column;gap:1rem}#themeToggle{position:absolute;top:1rem;right:1rem;background:none;border:1px solid currentColor;color:inherit;padding:0.3rem 0.6rem;border-radius:4px;cursor:pointer}section{background:#fff;border-radius:8px;padding:1rem;box-shadow:0 2px 6px rgba(0,0,0,0.1)}h2{margin-top:0}input,textarea,select,button{font:inherit;margin:0.3rem 0;width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:4px}button{background:#C1272D;color:#F6EFEC;border:none;cursor:pointer}button:disabled{background:#aaa;cursor:not-allowed}#items{display:flex;flex-direction:column;gap:0.5rem}article{background:#F6EFEC;border:1px solid #C1272D;border-radius:6px;padding:0.5rem;position:relative}article button{position:absolute;top:0.3rem;right:0.3rem;background:#14100F;color:#F6EFEC;width:auto;padding:0.2rem 0.5rem;font-size:0.8rem}</style></head><body><button id="themeToggle" aria-label="Toggle theme">Toggle Theme</button><header>NoteNest</header><main><section id="addSection"><h2>Add Highlight</h2><form id="addForm"><label for="title">Title</label><input id="title" type="text" required><label for="content">Note</label><textarea id="content" rows="3" required></textarea><button type="submit">Add</button></form></section><section id="listSection"><h2>Your Highlights</h2><div id="emptyState">No notes yet. Add a highlight above.</div><div id="items"></div></section></section></main><footer>© 2026 NoteNest</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='noteNest.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch{return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let notes=load();function render(){const list=document.getElementById('items');list.innerHTML='';if(notes.length===0){document.getElementById('emptyState').style.display='block';}else{document.getElementById('emptyState').style.display='none';notes.forEach((n,i)=>{const art=document.createElement('article');art.innerHTML=`<strong>${n.title}</strong><p>${n.content}</p>`;const del=document.createElement('button');del.textContent='✕';del.addEventListener('click',()=>{removeNote(i)});art.appendChild(del);list.appendChild(art);});}document.querySelector('#addForm button').disabled=notes.length>=LIM.max;}
function addNote(e){e.preventDefault();if(notes.length>=LIM.max)return;const t=document.getElementById('title').value.trim();const c=document.getElementById('content').value.trim();if(!t||!c)return;notes.push({title:t,content:c});save(notes);render();e.target.reset();}
function removeNote(idx){notes.splice(idx,1);save(notes);render();}
function exportData(){if(!LIM.export)return;const data=JSON.stringify(notes,null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='notes.json';a.click();}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const arr=JSON.parse(reader.result);if(Array.isArray(arr)){notes=arr;save(notes);render();}}catch{} };reader.readAsText(file);}
function toggleTheme(){const cur=document.documentElement.dataset.theme||'light';const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);applyTheme();}
function applyTheme(){const t=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=t;if(t==='dark'){document.documentElement.style.setProperty('--bg','#14100F');document.documentElement.style.setProperty('--fg','#F6EFEC');document.documentElement.style.setProperty('--accent','#C1272D');document.body.style.background='#14100F';document.body.style.color='#F6EFEC';}else{document.documentElement.style.setProperty('--bg','#F6EFEC');document.documentElement.style.setProperty('--fg','#14100F');document.documentElement.style.setProperty('--accent','#C1272D');document.body.style.background='#F6EFEC';document.body.style.color='#14100F';}}
document.getElementById('addForm').addEventListener('submit',addNote);
if(LIM.export){const expBtn=document.createElement('button');expBtn.textContent='Export My Data';expBtn.addEventListener('click',exportData);document.getElementById('listSection').appendChild(expBtn);
const impInput=document.createElement('input');impInput.type='file';impInput.accept='application/json';impInput.style.display='none';impInput.addEventListener('change',importData);
const impBtn=document.createElement('button');impBtn.textContent='Import My Data';impBtn.addEventListener('click',()=>impInput.click());document.getElementById('listSection').appendChild(impBtn);document.body.appendChild(impInput);
}
document.getElementById('themeToggle').addEventListener('click',toggleTheme);
applyTheme();render();</script></body></html>
