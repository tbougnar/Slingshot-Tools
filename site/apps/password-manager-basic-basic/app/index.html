<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VaultMate – Offline Password Manager</title><style>body{margin:0;font-family:sans-serif;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh;transition:background 0.3s,color 0.3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.4rem;cursor:pointer;margin:0.2rem}button:disabled{opacity:.5;cursor:default}input,select{padding:.4rem;border:1px solid #ccc;border-radius:.4rem;width:100%;margin:.3rem 0}label{display:block;margin-top:.5rem}#list{display:grid;gap:1rem;margin-top:1rem} .card{background:#fff;padding:1rem;border-radius:.6rem;box-shadow:0 2px 5px rgba(0,0,0,0.1)}html[data-theme='dark'] .card{background:#1e1a1a} .empty{text-align:center;color:#777;font-style:italic} .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}</style></head><body><header>VaultMate</header><main><div class="top"><h2>My Vault</h2><button id="themeToggle">Toggle Theme</button></div><form id="addForm"><label>Site<input type="text" id="site" required></label><label>Username<input type="text" id="user" required></label><label>Password<input type="text" id="pass" required></label><button type="submit" id="addBtn">Add</button></form><div id="list" class="empty">No passwords saved – add one above.</div><div id="controls" style="margin-top:1rem;display:none"><button id="exportBtn">Export</button><button id="importBtn">Import</button><input type="file" id="importFile" accept="application/json" style="display:none"></div></main><footer>Securely store passwords offline.</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K='vaultmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let vault=load();function render(){const list=document.getElementById('list');list.innerHTML='';if(vault.length===0){list.textContent='No passwords saved – add one above.';list.className='empty';}else{list.className='';vault.forEach((item,i)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<strong>${item.site}</strong><br>Username: ${item.user}<br>Password: ${item.pass}<br><button data-idx="${i}" class="delBtn">Delete</button>`;list.appendChild(card);});}document.getElementById('controls').style.display=LIMITS.export||LIMITS.bulk?'block':'none';}
function addEntry(e){e.preventDefault();if(vault.length>=LIMITS.maxItems){alert('Maximum items reached.');return;}const site=document.getElementById('site').value.trim();const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value.trim();vault.push({site,user,pass});save(vault);render();e.target.reset();}
function deleteEntry(e){if(e.target.classList.contains('delBtn')){const idx=e.target.getAttribute('data-idx');vault.splice(idx,1);save(vault);render();}}
function exportData(){const data=JSON.stringify(vault,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vaultmate.json';a.click();URL.revokeObjectURL(url);}
function importData(){document.getElementById('importFile').click();}
function handleImport(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const arr=JSON.parse(reader.result);if(Array.isArray(arr)){vault=arr;save(vault);render();}}catch(err){alert('Invalid file');}};reader.readAsText(file);}
function toggleTheme(){const root=document.documentElement;const cur=root.dataset.theme||'light';root.dataset.theme=cur==='light'?'dark':'light';localStorage.setItem('theme',root.dataset.theme);}
function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved;}}
document.getElementById('addForm').addEventListener('submit',addEntry);
document.getElementById('list').addEventListener('click',deleteEntry);
if(LIMITS.export){document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',importData);document.getElementById('importFile').addEventListener('change',handleImport);}document.getElementById('themeToggle').addEventListener('click',toggleTheme);initTheme();render();</script></body></html>
