<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LexiCount – Word, character and reading time counter</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input,textarea,select{width:100%;padding:.5rem;border:1px solid #ccc;border-radius:.3rem}section.card{background:#fff;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:1rem}#items{display:flex;flex-direction:column;gap:.5rem}#items div{display:flex;gap:.5rem;align-items:center}#themeToggle{position:fixed;top:1rem;right:1rem;background:#14100F;color:#F6EFEC}@media (prefers-color-scheme:dark){html[data-theme="dark"]{background:#14100F;color:#F6EFEC}html[data-theme="dark"] header,html[data-theme="dark"] footer{background:#C1272D;color:#F6EFEC}}</style></head><body><header>LexiCount</header><button id="themeToggle">Toggle Theme</button><main><section class="card"><h2>Enter Text</h2><textarea id="textInput" rows="4" placeholder="Type or paste your text here..."></textarea><button id="analyzeBtn">Analyze</button></section><section class="card"><h2>Statistics</h2><div id="stats">Add some text to see statistics.</div></section><section class="card" id="listSection"><h2>Saved Items</h2><div id="emptyState">No items saved yet. Analyze text and click “Save” to store.</div><div id="items"></div><button id="saveBtn">Save Current</button></section><section class="card" id="exportSection"><h2>Data</h2><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section></main><footer>Word, character and reading time counter</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K="lexicount.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{items:[],history:[]}}catch(e){return{items:[],history:[]}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let state=load();function renderItems(){const container=document.getElementById("items");container.innerHTML="";state.items.forEach((it,i)=>{const div=document.createElement("div");div.innerHTML=`<span>${i+1}. ${it.title}</span><button data-idx="${i}" class="viewBtn">View</button><button data-idx="${i}" class="delBtn">Delete</button>`;container.appendChild(div);});document.getElementById("emptyState").style.display=state.items.length?"none":"block";}function updateStats(){const txt=document.getElementById("textInput").value;if(!txt.trim()){document.getElementById("stats").textContent="Add some text to see statistics.";return;}const words=txt.trim().split(/\s+/).filter(Boolean).length;const chars=txt.replace(/\s/g,"").length;const minutes=Math.ceil(words/200);document.getElementById("stats").innerHTML=`Words: <b>${words}</b><br>Characters: <b>${chars}</b><br>Reading time: <b>${minutes} min</b>`;}function addItem(){if(state.items.length>=LIM.max){alert("Item limit reached. Upgrade for unlimited items.");return;}const txt=document.getElementById("textInput").value;if(!txt.trim()){alert("Nothing to save.");return;}state.items.push({title:txt.slice(0,30)+"...",content:txt,date:new Date()});if(LIM.history)state.history.push({action:"save",date:new Date()});save(state);renderItems();}function deleteItem(e){const idx=e.target.dataset.idx;state.items.splice(idx,1);if(LIM.history)state.history.push({action:"delete",date:new Date()});save(state);renderItems();}function viewItem(e){const idx=e.target.dataset.idx;const it=state.items[idx];document.getElementById("textInput").value=it.content;updateStats();}function exportData(){if(!LIM.export){alert("Export not available in basic edition.");return;}const data=JSON.stringify(state,null,2);const blob=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lexicount-data.json";a.click();}function importData(e){if(!LIM.export){alert('Import not available in basic edition');return;}const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);state={...obj,items:(obj.items||[]).slice(0,LIM.max)};save(state);renderItems();updateStats();}catch{alert("Invalid file.");}};reader.readAsText(file);}function toggleTheme(){const cur=document.documentElement.dataset.theme||"light";const next=cur==="light"?"dark":"light";document.documentElement.dataset.theme=next;localStorage.setItem("lexicount.theme",next);}function initTheme(){const saved=localStorage.getItem("lexicount.theme");if(saved)document.documentElement.dataset.theme=saved;else if(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)document.documentElement.dataset.theme="dark";else document.documentElement.dataset.theme="light";}document.getElementById("analyzeBtn").addEventListener("click",e=>{e.preventDefault();updateStats();});document.getElementById("saveBtn").addEventListener("click",e=>{e.preventDefault();addItem();});document.getElementById("items").addEventListener("click",e=>{if(e.target.classList.contains("delBtn"))deleteItem(e);else if(e.target.classList.contains("viewBtn"))viewItem(e);});document.getElementById("exportBtn").addEventListener("click",e=>{e.preventDefault();exportData();});document.getElementById("importBtn").addEventListener("click",e=>{e.preventDefault();document.getElementById("importFile").click();});document.getElementById("importFile").addEventListener("change",importData);document.getElementById("themeToggle").addEventListener("click",toggleTheme);initTheme();renderItems();</script></body></html>
