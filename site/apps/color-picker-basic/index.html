<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HueMate – Color Picker</title><style>body{margin:0;font-family:sans-serif;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh;transition:background 0.3s,color 0.3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;max-width:800px;margin:auto}button,select,input{font:inherit;padding:.5rem;margin:.2rem;border:1px solid #ccc;border-radius:4px}button{background:#C1272D;color:#F6EFEC;cursor:pointer}button:hover{opacity:.9}card{display:block;background:#fff;color:#14100F;border-radius:8px;padding:1rem;margin:.5rem 0;box-shadow:0 2px 4px rgba(0,0,0,.1)}html[data-theme='dark'] card{background:#222;color:#F6EFEC}input[type='color']{width:100%;height:3rem;border:none}#themeToggle{position:absolute;top:1rem;right:1rem;background:#fff;color:#14100F}</style></head><body><header>HueMate – Color Picker</header><button id="themeToggle" aria-label="Toggle theme">Toggle Theme</button><main><section id="emptyState" class="card"><p>Pick a color to see its contrast and add it to your palette.</p></section><section id="palette" class="card" style="display:none"><h2>Your Palette</h2><ul id="list"></ul></section><section class="card"><label for="colorInput">Choose color:</label><input type="color" id="colorInput" value="#ff0000"><button id="addBtn">Add to palette</button></section><section id="controls" class="card" style="display:none"><button id="exportBtn">Export my data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import my data</button></section></main><footer>© 2026 HueMate</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='hueMate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{items:[]}}catch(e){return{items:[]}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));function applyTheme(){const saved=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=saved;}applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme;const nxt=cur==='light'?'dark':'light';document.documentElement.dataset.theme=nxt;localStorage.setItem('theme',nxt);});let state=load();function render(){const list=document.getElementById('list');list.innerHTML='';state.items.forEach((c,i)=>{const li=document.createElement('li');li.textContent=c;li.style.display='flex';li.style.alignItems='center';li.style.justifyContent='space-between';const del=document.createElement('button');del.textContent='✕';del.addEventListener('click',()=>{removeItem(i);});li.appendChild(del);list.appendChild(li);});document.getElementById('palette').style.display=state.items.length?"block":"none";document.getElementById('controls').style.display=state.items.length?"block":"none";document.getElementById('emptyState').style.display=state.items.length?"none":"block";}function addItem(){const val=document.getElementById('colorInput').value;if(state.items.length>=LIM.max){alert('Limit reached. Upgrade for unlimited items.');return;}state.items.push(val);save(state);render();}function removeItem(idx){state.items.splice(idx,1);save(state);render();}function exportData(){if(!LIM.export){alert('Export unavailable in basic edition.');return;}const data=JSON.stringify(state);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='hueMate-palette.json';a.click();URL.revokeObjectURL(url);}function importData(e){if(!LIM.export){alert('Import not available in basic edition');return;}const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(Array.isArray(obj.items)){state.items=obj.items.slice(0,LIM.max);save(state);render();}else{alert('Invalid file');}}catch{alert('Invalid JSON');}};reader.readAsText(file);}document.getElementById('addBtn').addEventListener('click',addItem);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>{document.getElementById('importFile').click();});document.getElementById('importFile').addEventListener('change',importData);render();</script></body></html>
