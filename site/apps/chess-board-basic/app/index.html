<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChessBoard Viewer</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}main{flex:1;padding:1rem;max-width:800px;margin:auto}button,select,input{font:inherit;padding:.5rem;margin:.2rem}button{background:#C1272D;color:#F6EFEC;border:none;border-radius:.3rem;cursor:pointer}button:focus{outline:2px solid #14100F}#board{border-collapse:collapse;margin-top:1rem}#board td{width:2.5rem;height:2.5rem;text-align:center;vertical-align:middle;font-size:1.5rem}#board .light{background:#F6EFEC}#board .dark{background:#C1272D;color:#F6EFEC}#themeToggle{position:fixed;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>ChessBoard Viewer</h1></header><button id="themeToggle">Toggle Theme</button><main><section id="emptyState"><p>Enter a FEN string below to view the board.</p></section><section id="app" style="display:none"><form id="fenForm"><label for="fenInput">FEN:</label><input id="fenInput" type="text" placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1" required><button type="submit">Load</button></form><div id="boardContainer"></div><div id="controls" style="margin-top:1rem"></div></section></main><footer>© 2026 ChessBoard Viewer</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='chessboard.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||null}catch(e){return null}};const save=v=>localStorage.setItem(K,JSON.stringify(v));function applyTheme(){let t=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=t;document.body.style.background=t==='dark'?'#14100F':'#F6EFEC';document.body.style.color=t==='dark'?'#F6EFEC':'#14100F'}applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme',t);applyTheme()});function renderBoard(fen){let parts=fen.split(' ')[0].split('/');let html='<table id="board">';for(let r=0;r<8;r++){html+='<tr>';let cols=parts[r].split('');let file=0;for(let c of cols){if(isNaN(c)){let piece=pieceUnicode(c);let color=((r+file)%2===0)?'light':'dark';html+=`<td class="${color}">${piece}</td>`;file++;}else{let empty=parseInt(c,10);for(let i=0;i<empty;i++){let color=((r+file)%2===0)?'light':'dark';html+=`<td class="${color}"></td>`;file++;}}}html+='</tr>'; }html+='</table>';document.getElementById('boardContainer').innerHTML=html}function pieceUnicode(p){const map={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};return map[p]||''}function init(){let data=load();if(data){document.getElementById('fenInput').value=data;renderBoard(data)}document.getElementById('fenForm').addEventListener('submit',e=>{e.preventDefault();let fen=document.getElementById('fenInput').value.trim();if(!fen){return}save(fen);renderBoard(fen);});if(LIM.export){let addBtn=document.createElement('button');addBtn.textContent='Export Data';addBtn.addEventListener('click',()=>{let d=load();if(d){let blob=new Blob([JSON.stringify({fen:d})],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='chessboard.json';a.click();URL.revokeObjectURL(url)}});document.getElementById('controls').appendChild(addBtn);let imp=document.createElement('input');imp.type='file';imp.accept='application/json';imp.addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let obj=JSON.parse(r.result);if(obj.fen){document.getElementById('fenInput').value=obj.fen;save(obj.fen);renderBoard(obj.fen)}}catch{};};r.readAsText(file)});document.getElementById('controls').appendChild(imp);}document.getElementById('emptyState').style.display='none';document.getElementById('app').style.display='block'}init();
try{var __n=document.querySelector("#controls button");if(__n&&!__n.dataset.slFixed){__n.dataset.slFixed='1';__n.addEventListener('click',function(ev){let btn=document.querySelector('#controls button');if(btn&&btn.textContent==='Export Data'){btn.addEventListener('click',()=>{let d=load();if(d){let blob=new Blob([JSON.stringify({fen:d})],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='chessboard.json';a.click();URL.revokeObjectURL(url);}});}});}}catch(__e){console.error(__e);}
</script></body></html>
