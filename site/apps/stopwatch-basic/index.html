<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ChronoLap – Lap Stopwatch</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;display:flex;flex-direction:column;min-height:100vh}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}main{flex:1;padding:1rem;max-width:600px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.5rem;cursor:pointer;margin:0.2rem}button:disabled{opacity:.5;cursor:default}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}section{background:#fff;border-radius:.5rem;padding:1rem;margin-top:1rem;box-shadow:0 2px 5px rgba(0,0,0,.1)}ul{list-style:none;padding:0;margin:0}li{padding:.5rem 0;border-bottom:1px solid #eee}li:last-child{border:none}input[type="text"]{width:100%;padding:.5rem;margin-top:.5rem;border:1px solid #ccc;border-radius:.3rem}</style></head><body><header><h1>ChronoLap</h1></header><button id="themeToggle" aria-label="Toggle theme">Toggle Theme</button><main><section id="app"><h2>Lap Stopwatch</h2><div id="timerDisplay">00:00.0</div><button id="startStopBtn">Start</button><button id="lapBtn" disabled>Lap</button><button id="resetBtn" disabled>Reset</button><ul id="lapsList"></ul><div id="emptyState">Press Start to begin timing.</div></section></section></main><footer>© 2026 ChronoLap</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K="chronolap.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{running:false,elapsed:0,laps:[],theme:"light"}}catch(e){return{running:false,elapsed:0,laps:[],theme:"light"}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let state=load();function format(ms){let s=Math.floor(ms/1000);let d=Math.floor((ms%1000)/100);let m=Math.floor(s/60);s=s%60;return `${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}.${d}`}function render(){document.getElementById("timerDisplay").textContent=format(state.elapsed);let list=document.getElementById("lapsList");list.innerHTML="";state.laps.forEach((l,i)=>{let li=document.createElement("li");li.textContent=`Lap ${i+1}: ${format(l)}`;list.appendChild(li)});document.getElementById("lapBtn").disabled=!state.running||state.laps.length>=LIMITS.maxItems;document.getElementById("resetBtn").disabled=!state.running&&state.elapsed===0;document.getElementById("emptyState").style.display=state.laps.length===0?"block":"none"}let interval=null;function tick(){state.elapsed+=100;render()}function start(){if(state.running)return;state.running=true;interval=setInterval(tick,100);render()}function stop(){if(!state.running)return;state.running=false;clearInterval(interval);render()}function reset(){stop();state.elapsed=0;state.laps=[];render()}function lap(){if(state.laps.length>=LIMITS.maxItems)return;state.laps.push(state.elapsed);render()}document.getElementById("startStopBtn").addEventListener("click",()=>{if(state.running){stop();document.getElementById("startStopBtn").textContent="Start"}else{start();document.getElementById("startStopBtn").textContent="Stop"}});document.getElementById("lapBtn").addEventListener("click",lap);document.getElementById("resetBtn").addEventListener("click",reset);function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("theme",t);if(t==="dark"){document.body.style.background="#14100F";document.body.style.color="#F6EFEC";document.querySelectorAll('button').forEach(b=>b.style.background="#C1272D")}else{document.body.style.background="#F6EFEC";document.body.style.color="#14100F";document.querySelectorAll('button').forEach(b=>b.style.background="#C1272D")}}document.getElementById("themeToggle").addEventListener("click",()=>{let cur=localStorage.getItem("theme")||"light";applyTheme(cur==="light"?"dark":"light")});applyTheme(localStorage.getItem("theme")||"light");if(LIMITS.export){let exp=document.createElement("button");exp.textContent="Export";exp.id="exportBtn";exp.addEventListener("click",()=>{let data={elapsed:state.elapsed,laps:state.laps};let blob=new Blob([JSON.stringify(data)],{type:"application/json"});let url=URL.createObjectURL(blob);let a=document.createElement("a");a.href=url;a.download="chronolap.json";a.click();URL.revokeObjectURL(url)});document.getElementById("app").appendChild(exp);let imp=document.createElement("button");imp.textContent="Import";imp.id="importBtn";imp.addEventListener("click",()=>{let input=document.createElement("input");input.type="file";input.accept="application/json";input.onchange=e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=ev=>{try{let obj=JSON.parse(ev.target.result);state.elapsed=obj.elapsed||0;state.laps=obj.laps||[];render()}catch{alert("Invalid file")}};reader.readAsText(file)};input.click()});document.getElementById("app").appendChild(imp)}window.addEventListener("beforeunload",()=>save(state));render();</script></html>
