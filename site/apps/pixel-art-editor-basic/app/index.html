<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PixelForge – Tiny pixel art editor</title><style>body{margin:0;font-family:sans-serif;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.5rem;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2)}button:hover{opacity:.9}#canvas{image-rendering:pixelated;background:#fff;border:1px solid #ccc;touch-action:none}#tools{display:flex;gap:.5rem;flex-wrap:wrap}#tools button{padding:.3rem .6rem;font-size:.9rem}#grid{display:grid;gap:1px;background:#999}#grid div{width:20px;height:20px;background:#fff;cursor:pointer}#grid div.active{background:#C1272D}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}section{background:#fff;padding:1rem;border-radius:.5rem;box-shadow:0 2px 6px rgba(0,0,0,.1)}@media(max-width:600px){#canvas{width:100%;height:auto}}footer{font-size:.8rem}</style></head><body><header>PixelForge</header><button id="themeToggle" aria-label="Toggle theme">Toggle theme</button><main><section id="emptyState"><p>Start by creating a new canvas.</p><button id="newCanvasBtn">New Canvas</button></section><section id="editor" style="display:none"><div id="tools"><button id="undoBtn" aria-label="Undo">Undo</button><button id="redoBtn" aria-label="Redo">Redo</button><button id="clearBtn" aria-label="Clear">Clear</button></div><canvas id="canvas" width="320" height="320" tabindex="0"></canvas><div id="history" style="margin-top:1rem"></div><div id="exportImport" style="margin-top:1rem;display:none"><button id="exportBtn">Export my data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import my data</button></div></section></main><footer>© 2026 PixelForge</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='pixelforge.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||null}catch(e){return null}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let state={pixels:[],undo:[],redo:[],size:16};function init(){const saved=load();if(saved){state=saved}applyTheme();document.getElementById('themeToggle').addEventListener('click',toggleTheme);document.getElementById('newCanvasBtn').addEventListener('click',newCanvas);document.getElementById('undoBtn').addEventListener('click',undo);document.getElementById('redoBtn').addEventListener('click',redo);document.getElementById('clearBtn').addEventListener('click',clearCanvas);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);if(LIM.export){document.getElementById('exportImport').style.display='block'}render();}function applyTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved}}function toggleTheme(){const cur=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=cur;localStorage.setItem('theme',cur)}function newCanvas(){state.size=16;state.pixels=Array(state.size*state.size).fill(0);state.undo=[];state.redo=[];save(state);render();document.getElementById('emptyState').style.display='none';document.getElementById('editor').style.display='block'}function render(){const canvas=document.getElementById('canvas');const ctx=canvas.getContext('2d');const sz=state.size;canvas.width=sz*20;canvas.height=sz*20;ctx.clearRect(0,0,canvas.width,canvas.height);for(let y=0;y<sz;y++){for(let x=0;x<sz;x++){const i=y*sz+x;if(state.pixels[i]){ctx.fillStyle='#C1272D'}else{ctx.fillStyle='#fff'}ctx.fillRect(x*20,y*20,20,20);ctx.strokeStyle='#ccc';ctx.strokeRect(x*20,y*20,20,20)}}}function togglePixel(e){const rect=e.target.getBoundingClientRect();const x=Math.floor((e.clientX-rect.left)/20);const y=Math.floor((e.clientY-rect.top)/20);const i=y*state.size+x;state.pixels[i]=state.pixels[i]?0:1;state.undo.push([...state.pixels]);if(state.undo.length>100)state.undo.shift();save(state);render()}function undo(){if(state.undo.length){state.redo.push([...state.pixels]);state.pixels=state.undo.pop();save(state);render()}}function redo(){if(state.redo.length){state.undo.push([...state.pixels]);state.pixels=state.redo.pop();save(state);render()}}function clearCanvas(){state.pixels=Array(state.size*state.size).fill(0);state.undo.push([...state.pixels]);save(state);render()}function exportData(){const data=JSON.stringify(state);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pixelforge.json';a.click();URL.revokeObjectURL(url)}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{state=JSON.parse(reader.result);save(state);render()}catch{alert('Invalid file')}};reader.readAsText(file)}document.getElementById('canvas').addEventListener('click',togglePixel);init();</script></body></html>
