<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>PassGuard – Password Strength Auditor</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.4rem;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;padding:.5rem;margin:.3rem 0;border:1px solid #ccc;border-radius:.3rem}label{margin-top:.5rem;display:block}section{background:#fff;border-radius:.6rem;box-shadow:0 2px 6px rgba(0,0,0,.1);padding:1rem;margin-bottom:1rem}#list{list-style:none;padding:0}#list li{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #eee}#list li:last-child{border:none}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}@media (prefers-color-scheme:dark){html[data-theme="dark"]{background:#14100F;color:#F6EFEC}html[data-theme="dark"] header,html[data-theme="dark"] footer{background:#C1272D}html[data-theme="dark"] button{background:#C1272D;color:#F6EFEC}}</style></head><body><header>PassGuard – Password Strength Auditor<button id="themeToggle">Toggle Theme</button></header><main><section id="intro"><p>Enter a password to see its strength score and suggestions.</p></section><section id="formSection"><form id="pwdForm"><label for="pwdInput">Password</label><input type="text" id="pwdInput" autocomplete="off" required><button type="submit" id="checkBtn">Check Strength</button></form></section><section id="resultSection" style="display:none;"><h2>Result</h2><p id="scoreText"></p><ul id="suggestions"></ul></section><section id="listSection"><h2>Saved Passwords</h2><ul id="list"></ul><button id="clearBtn">Clear All</button></section><section id="exportSection" style="display:none;"><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section></main><footer>© 2026 PassGuard</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true,themeAll:true,bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themeAll:false,bulk:false,history:false};const K='passguard.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));const applyTheme=()=>{let theme=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=theme;};applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{let cur=document.documentElement.dataset.theme;let next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);});function evaluate(p){let score=0;let suggestions=[];if(p.length>=8)score+=1;else suggestions.push('Use at least 8 characters');if(/[A-Z]/.test(p))score+=1;else suggestions.push('Add uppercase letters');if(/[a-z]/.test(p))score+=1;else suggestions.push('Add lowercase letters');if(/[0-9]/.test(p))score+=1;else suggestions.push('Add numbers');if(/[^A-Za-z0-9]/.test(p))score+=1;else suggestions.push('Add symbols');return{score,suggestions}};function renderList(){let arr=load();let ul=document.getElementById('list');ul.innerHTML='';arr.forEach((item,i)=>{let li=document.createElement('li');let span=document.createElement('span');span.textContent=item;let del=document.createElement('button');del.textContent='✕';del.addEventListener('click',()=>{removeItem(i)});li.appendChild(span);li.appendChild(del);ul.appendChild(li);});document.getElementById('clearBtn').disabled=arr.length===0;}function addItem(p){let arr=load();if(arr.length>=LIM.max){alert('Basic edition limit reached.');return;}arr.push(p);save(arr);renderList();}function removeItem(idx){let arr=load();arr.splice(idx,1);save(arr);renderList();}document.getElementById('pwdForm').addEventListener('submit',e=>{e.preventDefault();let pwd=document.getElementById('pwdInput').value;let res=evaluate(pwd);document.getElementById('scoreText').textContent='Score: '+res.score+'/5';let sug=document.getElementById('suggestions');sug.innerHTML='';res.suggestions.forEach(s=>{let li=document.createElement('li');li.textContent=s;sug.appendChild(li);});document.getElementById('resultSection').style.display='block';if(LIM.bulk){addItem(pwd);} });document.getElementById('clearBtn').addEventListener('click',()=>{if(confirm('Clear all saved passwords?')){save([]);renderList();}});if(LIM.export){document.getElementById('exportSection').style.display='block';document.getElementById('exportBtn').addEventListener('click',()=>{let data=load();let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='passguard-data.json';a.click();});document.getElementById('importBtn').addEventListener('click',()=>{document.getElementById('importFile').click();});document.getElementById('importFile').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=ev=>{try{let arr=JSON.parse(ev.target.result);if(Array.isArray(arr)){save(arr);renderList();}}catch(err){alert('Invalid file');}};reader.readAsText(file);});}renderList();</script></body></html>
