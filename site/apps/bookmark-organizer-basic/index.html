<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LinkLoom Bookmark Cleaner</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header{font-size:1.5rem}main{flex:1;padding:1rem;max-width:800px;margin:auto}button,select,input{font:inherit;padding:.5rem;margin:.2rem;border:1px solid #C1272D;border-radius:.3rem;background:#fff;color:#14100F;cursor:pointer}button:hover,select:hover,input:hover{background:#C1272D;color:#F6EFEC}card{display:block;background:#fff;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1);margin:.5rem 0;padding:1rem}input[type=text]{width:calc(100% - 1rem)}#list{list-style:none;padding:0}#list li{display:flex;justify-content:space-between;align-items:center}#list li button{background:#C1272D;color:#F6EFEC}#empty{color:#777;text-align:center;margin-top:2rem}</style></head><body><header>LinkLoom Bookmark Cleaner</header><main><section><button id="addBtn">Add Bookmark</button><button id="themeBtn">Toggle Theme</button><button id="exportBtn" style="display:none">Export</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn" style="display:none">Import</button></section><ul id="list"></ul><p id="empty">Add your first bookmark to start cleaning duplicates and dead links.</p></main><footer>©2026 LinkLoom</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K="linkloom.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch{return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let data=load();const list=document.getElementById('list');const empty=document.getElementById('empty');function render(){list.innerHTML='';if(data.length===0){empty.style.display='block'}else{empty.style.display='none'}data.forEach((b,i)=>{const li=document.createElement('li');li.textContent=b;const del=document.createElement('button');del.textContent='✕';del.addEventListener('click',()=>{data.splice(i,1);save(data);render();});li.appendChild(del);list.appendChild(li);});if(LIM.export){document.getElementById('exportBtn').style.display='inline-block'}else{document.getElementById('exportBtn').style.display='none'}if(LIM.export){document.getElementById('importBtn').style.display='inline-block'}else{document.getElementById('importBtn').style.display='none'}}function add(){if(data.length>=LIM.maxItems){alert('Limit reached');return}const url=prompt('Enter URL');if(!url){return}if(data.includes(url)){alert('Duplicate');return}fetch(url,{method:'HEAD'}).then(r=>{if(!r.ok){alert('Dead link');return}data.push(url);save(data);render();}).catch(()=>{alert('Dead link');});}function toggleTheme(){const cur=document.documentElement.dataset.theme;const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);}function exportData(){const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='linkloom.json';a.click();}function importData(e){const file=e.target.files[0];if(!file){return}const r=new FileReader();r.onload=()=>{try{const arr=JSON.parse(r.result);if(Array.isArray(arr)){data=arr;save(data);render();}}catch{};};r.readAsText(file);}document.getElementById('addBtn').addEventListener('click',add);document.getElementById('themeBtn').addEventListener('click',toggleTheme);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);const savedTheme=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=savedTheme;render();</script></body></html>
