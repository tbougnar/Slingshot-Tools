<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TimeShift – Unix Timestamp Converter</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header{font-size:1.5rem}main{flex:1;padding:1rem;max-width:800px;margin:auto}button,select,input{font:inherit;padding:.5rem;margin:.2rem;border:1px solid #ccc;border-radius:.4rem}button{background:#C1272D;color:#F6EFEC;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.card{background:#fff;border-radius:.6rem;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:1rem;margin:.5rem 0}#list{list-style:none;padding:0}.theme-toggle{position:fixed;top:1rem;right:1rem;background:#14100F;color:#F6EFEC}</style></head><body><header>TimeShift – Unix Timestamp Converter</header><button id="themeToggle" class="theme-toggle">Toggle Theme</button><main><section id="inputSection" class="card"><h2>Convert</h2><form id="convertForm"><label>Unix timestamp (seconds)<br><input type="number" id="tsInput" placeholder="e.g. 1700000000"></label><br><label>Human date<br><input type="datetime-local" id="dateInput"></label><br><button type="submit" id="convertBtn">Convert</button></form><div id="result"></div></section><section id="historySection" class="card"><h2>History</h2><ul id="list"></ul><div id="emptyState">Add a conversion to see history.</div></section><section id="dataSection" class="card"><h2>Data</h2><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section></main><footer>© 2026 TimeShift</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K="timeshift.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[] }catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));const applyTheme=()=>{const saved=localStorage.getItem("theme");document.documentElement.dataset.theme=saved||"light"};applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme;const nxt=cur==="light"?"dark":"light";document.documentElement.dataset.theme=nxt;localStorage.setItem('theme',nxt)});function render(){const list=document.getElementById('list');list.innerHTML='';const data=load();data.forEach((item,i)=>{const li=document.createElement('li');li.className='card';li.innerHTML=`<strong>${i+1}.</strong> ${item.type==='ts'?'Timestamp':'Date'} → ${item.result}<br><small>${item.original}</small>`;list.appendChild(li)});document.getElementById('emptyState').style.display=data.length?"none":"block";document.getElementById('exportBtn').disabled=!LIMITS.export}render();document.getElementById('convertForm').addEventListener('submit',e=>{e.preventDefault();const tsVal=document.getElementById('tsInput').value;const dateVal=document.getElementById('dateInput').value;let result='',original='';if(tsVal){const d=new Date(tsVal*1000);if(isNaN(d))return;result=d.toISOString().replace('T',' ').slice(0,19);original=tsVal}else if(dateVal){const d=new Date(dateVal);if(isNaN(d))return;result=Math.floor(d.getTime()/1000);original=dateVal}else return;const entry={type:tsVal?'ts':'date',original,result};const data=load();if(data.length>=LIMITS.maxItems) return;data.unshift(entry);save(data);render();});document.getElementById('exportBtn').addEventListener('click',()=>{if(!LIMITS.export) return;const data=load();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='timeshift-data.json';a.click();URL.revokeObjectURL(url);});document.getElementById('importBtn').addEventListener('click',()=>{if(!LIMITS.export){alert('Import not available in basic edition');return;}document.getElementById('importFile').click();});document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const arr=JSON.parse(ev.target.result);if(Array.isArray(arr)){save(arr.slice(0,LIMITS.maxItems));render();}}catch(err){};};reader.readAsText(file);});</script></body></html>
