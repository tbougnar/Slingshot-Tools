<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TypoSprint - Typing Speed Test</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input,select{padding:.4rem;border:1px solid #ccc;border-radius:.3rem}#wordBox{font-size:1.2rem;margin:1rem 0;min-height:2rem}#result{margin-top:1rem} .card{background:#fff;padding:1rem;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1);margin-bottom:1rem} .theme-toggle{position:fixed;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>TypoSprint</h1></header><button id="themeToggle" class="theme-toggle">Toggle Theme</button><main><div class="card" id="setupCard"><h2>Start Test</h2><label for="duration">Duration (seconds): </label><input type="number" id="duration" min="5" value="30"><br><button id="startBtn">Start</button></div><div class="card" id="testCard" style="display:none"><div id="wordBox"></div><input type="text" id="inputBox" autocomplete="off" placeholder="Type here..." disabled><button id="resetBtn">Reset</button></div><div class="card" id="resultCard" style="display:none"><h2>Result</h2><div id="result"></div><button id="exportBtn">Export Data</button><input type="file" id="importFile" style="display:none"><button id="importBtn">Import Data</button></div></main><footer>© 2026 TypoSprint</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K="typ sprint.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||null}catch{return null}};const save=v=>localStorage.setItem(K,JSON.stringify(v));const LIM=TIER==='full'?{max:Infinity,export:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export};let words=[],index=0,started=false,startTime=0,duration=30,typed="",timerId=null;function randWords(n){const pool="the quick brown fox jumps over lazy dog lorem ipsum dolor sit amet consectetur adipiscing elit".split(/\s+/);let arr=[];for(let i=0;i<n;i++)arr.push(pool[Math.floor(Math.random()*pool.length)]);return arr}function start(){duration=parseInt(document.getElementById('duration').value)||30;words=randWords(50);index=0;typed="";started=true;document.getElementById('wordBox').textContent=words.join(' ');document.getElementById('inputBox').value='';document.getElementById('inputBox').disabled=false;document.getElementById('inputBox').focus();startTime=Date.now();timerId=setTimeout(end,duration*1000);document.getElementById('setupCard').style.display='none';document.getElementById('testCard').style.display='block';}function end(){started=false;clearTimeout(timerId);document.getElementById('inputBox').disabled=true;const elapsed=(Date.now()-startTime)/60000;const wpm=Math.round((typed.split(/\s+/).filter(w=>w).length)/elapsed);const correct=typed.split(/\s+/).filter((w,i)=>w===words[i]).length;const accuracy=Math.round((correct/typed.split(/\s+/).filter(w=>w).length)*100)||0;document.getElementById('result').innerHTML=`<p>WPM: ${wpm}</p><p>Accuracy: ${accuracy}%</p>`;document.getElementById('testCard').style.display='none';document.getElementById('resultCard').style.display='block';if(LIMITS.export)save({words,typed,wpm,accuracy});}function onInput(e){typed=e.target.value;let correctSoFar=typed===words.slice(0,typed.split(/\s+/).length).join(' ');if(!correctSoFar){e.target.style.borderColor='red'}else{e.target.style.borderColor=''} }function reset(){if(started)end();document.getElementById('setupCard').style.display='block';document.getElementById('resultCard').style.display='none';}function exportData(){if(!LIM.export){alert('Export not available in basic edition');return;}const data=load();if(!data){alert('No data');return}const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='typ sprint data.json';a.click();}function importData(e){if(!LIM.export){alert('Import not available in basic edition');return;}const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);save(obj);alert('Data imported');}catch{alert('Invalid file');}};reader.readAsText(file);}function toggleTheme(){const cur=document.documentElement.dataset.theme||'light';const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);}function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved;}else{document.documentElement.dataset.theme='light';}}document.getElementById('startBtn').addEventListener('click',start);document.getElementById('resetBtn').addEventListener('click',reset);document.getElementById('inputBox').addEventListener('input',e=>onInput(e));document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);document.getElementById('themeToggle').addEventListener('click',toggleTheme);initTheme();</script></body></html>
