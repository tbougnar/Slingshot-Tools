<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BreatheFlow - Breathing Exercise Guide</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.5rem;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}select,input{padding:.5rem;border:1px solid #C1272D;border-radius:.5rem}section{background:#fff;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:1rem}#list{display:flex;flex-direction:column;gap:.5rem} .item{display:flex;align-items:center;justify-content:space-between;padding:.5rem;background:#F6EFEC;border-radius:.3rem} .timer{font-family:monospace;margin-left:.5rem} .controls button{margin-left:.3rem}#empty{color:#777;font-style:italic}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}</style></head><body><header>BreatheFlow</header><button id="themeToggle">Toggle Theme</button><main><section><h2>New Session</h2><form id="sessionForm"><label for="pattern">Pattern</label><select id="pattern"><option value="box">Box Breathing (4-4-4-4)</option><option value="4-7-8">4-7-8 Breathing</option></select><label for="cycles">Cycles</label><input type="number" id="cycles" min="1" value="1"><button type="submit" id="startBtn">Start</button></form></section><section><h2>Sessions</h2><div id="list"></div><p id="empty">Add a breathing session to begin.</p></section><section id="exportSection" style="display:none"><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section></main><footer>© 2026 BreatheFlow</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='breatheflow.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{sessions:[]}}catch(e){return{sessions:[]}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let state=load();function render(){document.getElementById('list').innerHTML='';if(state.sessions.length===0){document.getElementById('empty').style.display='block'}else{document.getElementById('empty').style.display='none'}state.sessions.forEach((s,i)=>{const div=document.createElement('div');div.className='item';div.innerHTML=`<span>${s.name} (${s.cycles} cycles)</span><span class="timer" id="timer${i}"></span>`;const ctrl=document.createElement('div');ctrl.className='controls';const del=document.createElement('button');del.textContent='Delete';del.addEventListener('click',()=>{deleteSession(i)});ctrl.appendChild(del);div.appendChild(ctrl);document.getElementById('list').appendChild(div)});if(LIM.export){document.getElementById('exportSection').style.display='block'}else{document.getElementById('exportSection').style.display='none'}}function addSession(e){e.preventDefault();if(state.sessions.length>=LIM.max){alert('Basic edition limit reached.');return}const pattern=document.getElementById('pattern').value;const cycles=parseInt(document.getElementById('cycles').value)||1;state.sessions.push({name:pattern,cycles,pattern});save(state);render()}function deleteSession(idx){state.sessions.splice(idx,1);save(state);render()}function startTimer(){if(state.sessions.length===0)return;let idx=0;function run(){if(idx>=state.sessions.length){return}const s=state.sessions[idx];let sec=0;let total=0;switch(s.pattern){case'box':total= (s.cycles*4*4);break;case'4-7-8':total= s.cycles*(4+7+8);break;default:total=s.cycles*4}function tick(){if(sec>=total){idx++;run();return}document.getElementById('timer'+idx).textContent=sec+"s";sec++;setTimeout(tick,1000)}tick()}run()}function exportData(){const data=JSON.stringify(state);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='breatheflow.json';a.click();URL.revokeObjectURL(url)}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{state=JSON.parse(reader.result);save(state);render()}catch{alert('Invalid file')}};reader.readAsText(file)}function toggleTheme(){const cur=document.documentElement.dataset.theme;const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next)}function initTheme(){const saved=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=saved}document.getElementById('sessionForm').addEventListener('submit',addSession);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);document.getElementById('themeToggle').addEventListener('click',toggleTheme);initTheme();render();</script></body></html>
