<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JiffyJSON – JSON Viewer & Formatter</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header h1{margin:0;font-size:1.5rem}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem}textarea{width:100%;height:8rem;padding:.5rem;border:1px solid #ccc;border-radius:.5rem;font-family:monospace;resize:vertical}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.5rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}#output{white-space:pre-wrap;background:#fff;padding:.5rem;border:1px solid #ccc;border-radius:.5rem;overflow:auto;max-height:12rem}#empty{color:#777;font-style:italic}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>JiffyJSON</h1></header><button id="themeToggle">Toggle Theme</button><main><section><label for="input">JSON Input</label><textarea id="input" placeholder="Paste JSON here..."></textarea></section><section><button id="formatBtn">Format & Highlight</button></section><section><div id="output"><span id="empty">Enter JSON and click "Format & Highlight" to see formatted output.</span></div></section><section id="exportSection" style="display:none"><button id="exportBtn">Export Data</button><input type="file" id="importInput" accept="application/json" style="display:none"><button id="importBtn">Import Data</button></section></main><footer>© 2026 JiffyJSON</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const EFFECTIVE_LIMITS=TIER==="full"?{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true}:BASIC_LIMITS;const K="jiffyjson.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||null}catch{return null}};const save=v=>localStorage.setItem(K,JSON.stringify(v));const applyTheme=()=>{const saved=localStorage.getItem("theme");const theme=saved||"light";document.documentElement.dataset.theme=theme;document.body.dataset.theme=theme;};applyTheme();document.getElementById("themeToggle").addEventListener("click",()=>{const newTheme=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=newTheme;localStorage.setItem("theme",newTheme);});function format(){const txt=document.getElementById("input").value.trim();if(!txt){showEmpty();return}let obj;try{obj=JSON.parse(txt)}catch(e){showError("Invalid JSON: "+e.message);return}const formatted=JSON.stringify(obj,null,2);display(formatted)}function display(str){const out=document.getElementById("output");out.textContent=str;document.getElementById("empty").style.display="none"}function showEmpty(){document.getElementById("output").textContent="";document.getElementById("empty").style.display="inline"}function showError(msg){const out=document.getElementById("output");out.textContent=msg;document.getElementById("empty").style.display="none"}document.getElementById("formatBtn").addEventListener("click",format);if(EFFECTIVE_LIMITS.export){document.getElementById("exportSection").style.display="block";document.getElementById("exportBtn").addEventListener("click",()=>{const data=load()||{history:[]};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="jiffyjson-data.json";a.click()});document.getElementById("importBtn").addEventListener("click",()=>{document.getElementById("importInput").click()});document.getElementById("importInput").addEventListener("change",e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const obj=JSON.parse(ev.target.result);save(obj);showEmpty();}catch{showError("Invalid import file")} };reader.readAsText(file)});}</script></html>
