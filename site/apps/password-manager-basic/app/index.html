<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VaultMate - Offline Password Manager</title><style>body{margin:0;font-family:sans-serif;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh;transition:background 0.3s,color 0.3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input,select{padding:.4rem;border:1px solid #ccc;border-radius:.3rem;width:100%;margin-bottom:.5rem}label{display:block;margin-bottom:.2rem} .card{background:#fff;padding:1rem;margin-bottom:1rem;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,0.1)}html[data-theme='dark'] .card{background:#222} .empty{text-align:center;color:#777;margin-top:2rem} .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem} .toggle{background:none;color:inherit;padding:0;font-size:1rem}</style></head><body><header>VaultMate</header><main><div class="topbar"><h2>My Vault</h2><button id="themeToggle" class="toggle">Toggle Theme</button></div><div id="emptyState" class="empty">Add your first password entry using the form below.</div><div id="list"></div><form id="addForm"><label for="site">Site</label><input id="site" required><label for="user">Username</label><input id="user" required><label for="pass">Password</label><input id="pass" required><button type="submit" id="addBtn">Add Entry</button></form><div id="exportImport" style="margin-top:1rem;display:none;"><button id="exportBtn">Export Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import Data</button></div></main><footer>Securely store passwords offline.</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:0,export:true,themes:"all",bulk:true,history:true};const STORAGE_KEY='vaultmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch(e){return[]}};const save=v=>localStorage.setItem(STORAGE_KEY,JSON.stringify(v));let vault=load();function render(){const list=document.getElementById('list');list.innerHTML='';if(vault.length===0){document.getElementById('emptyState').style.display='block'}else{document.getElementById('emptyState').style.display='none'}vault.forEach((item,i)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<strong>${item.site}</strong><br>User: ${item.user}<br>Pass: ${item.pass}<br><button data-idx="${i}" class="delBtn">Delete</button>`;list.appendChild(card)});updateAddState();if(LIMITS.export){document.getElementById('exportImport').style.display='block'}else{document.getElementById('exportImport').style.display='none'}}function updateAddState(){const addBtn=document.getElementById('addBtn');if(LIMITS.maxItems&&vault.length>=LIMITS.maxItems){addBtn.disabled=true}else{addBtn.disabled=false}}document.getElementById('addForm').addEventListener('submit',e=>{e.preventDefault();if(LIMITS.maxItems&&vault.length>=LIMITS.maxItems)return;const site=document.getElementById('site').value.trim();const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value.trim();vault.push({site,user,pass});save(vault);e.target.reset();render()});document.getElementById('list').addEventListener('click',e=>{if(e.target.classList.contains('delBtn')){const idx=e.target.dataset.idx;vault.splice(idx,1);save(vault);render()}});document.getElementById('themeToggle').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme;const next=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next)});function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved}else{document.documentElement.dataset.theme='light'}}initTheme();if(LIMITS.export){document.getElementById('exportBtn').addEventListener('click',()=>{const data=JSON.stringify(vault,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vaultmate.json';a.click();URL.revokeObjectURL(url)});document.getElementById('importBtn').addEventListener('click',()=>{document.getElementById('importFile').click()});document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const arr=JSON.parse(ev.target.result);if(Array.isArray(arr)){vault=arr;save(vault);render()}}catch(err){} };reader.readAsText(file)});}</script></html>
