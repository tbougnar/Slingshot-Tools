<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VaultMate - Offline Password Manager</title><style>body{font-family:sans-serif;margin:0;padding:0;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh;transition:background 0.3s,color 0.3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.5rem;cursor:pointer;margin:0.2rem}button:hover{opacity:.9}input,select{padding:.4rem;border:1px solid #C1272D;border-radius:.3rem;width:100%;margin:.3rem 0}label{display:block;margin-top:.5rem}#list{display:grid;gap:1rem;margin-top:1rem} .card{background:#fff;padding:1rem;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,0.1)}html[data-theme='dark'] .card{background:#222} .empty{text-align:center;color:#777;margin-top:2rem} .toolbar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.5rem} .toolbar button{flex:1} @media(max-width:600px){.toolbar{flex-direction:column}} </style></head><body><header>VaultMate</header><main><div class="toolbar"><button id="addBtn">Add Entry</button><button id="themeToggle">Toggle Theme</button><button id="exportBtn">Export</button><button id="importBtn">Import</button></div><div id="list"></div><div id="empty" class="empty">No passwords saved. Click “Add Entry” to start.</div></main><footer>Securely store your passwords offline.</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themeAll:true,bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themeAll:false,bulk:false,history:false};const K='vaultmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let data=load();function render(){const list=document.getElementById('list');list.innerHTML='';if(data.length===0){document.getElementById('empty').style.display='block';}else{document.getElementById('empty').style.display='none';data.forEach((item,i)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<strong>${escape(item.site)}</strong><br>Username: ${escape(item.username)}<br>Password: ${'*'.repeat(item.password.length)}<br><button id='copy${i}'>Copy</button> <button id='del${i}'>Delete</button>`;list.appendChild(card);document.getElementById(`copy${i}`).addEventListener('click',()=>copy(item.password));document.getElementById(`del${i}`).addEventListener('click',()=>remove(i));});}}function escape(s){const div=document.createElement('div');div.textContent=s;return div.innerHTML}function addEntry(e){e.preventDefault();if(data.length>=LIM.max){alert('Item limit reached. Upgrade for unlimited entries.');return;}const site=document.getElementById('site').value.trim();const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value;if(!site||!user||!pass){alert('All fields required');return;}data.push({site,user,password:pass});save(data);render();form.reset();}function remove(idx){data.splice(idx,1);save(data);render();}function copy(txt){navigator.clipboard.writeText(txt).catch(()=>alert('Copy failed'));}function toggleTheme(){const cur=document.documentElement.dataset.theme||'light';const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);}function exportData(){if(!LIM.export){alert('Export unavailable in basic edition');return;}const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='vaultmate.json';a.click();}function importData(){const input=document.createElement('input');input.type='file';input.accept='application/json';input.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const arr=JSON.parse(ev.target.result);if(Array.isArray(arr)){data=arr;save(data);render();}else{alert('Invalid file');}}catch{alert('Failed to parse');}};reader.readAsText(file);};input.click();}document.getElementById('addBtn').addEventListener('click',()=>{if(document.getElementById('form'))return;const form=document.createElement('form');form.id='form';form.innerHTML=`<label>Site<input id='site' required></label><label>Username<input id='user' required></label><label>Password<input id='pass' type='password' required></label><button type='submit'>Save</button>`;form.addEventListener('submit',addEntry);document.querySelector('main').insertBefore(form,document.getElementById('list'));form.querySelector('button').addEventListener('click',e=>{e.preventDefault();form.remove();});});document.getElementById('themeToggle').addEventListener('click',toggleTheme);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',importData);const savedTheme=localStorage.getItem('theme');if(savedTheme){document.documentElement.dataset.theme=savedTheme;}render();</script></body></html>
