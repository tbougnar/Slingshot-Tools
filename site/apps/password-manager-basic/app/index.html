<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VaultMate – Offline Password Manager</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}main{flex:1;padding:1rem;max-width:800px;margin:auto}h1{margin:0;font-size:1.8rem}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.4rem;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input,select,textarea{width:100%;padding:.5rem;margin:.3rem 0;border:1px solid #ccc;border-radius:.3rem}section{background:#fff;border-radius:.6rem;box-shadow:0 2px 6px rgba(0,0,0,.1);padding:1rem;margin-bottom:1rem}#list{list-style:none;padding:0}#list li{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #eee}#list li:last-child{border:none}.theme-toggle{position:fixed;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>VaultMate</h1></header><button class="theme-toggle" id="themeToggle">Toggle Theme</button><main><section><h2>New Entry</h2><form id="entryForm"><label for="site">Site</label><input id="site" required><label for="user">Username</label><input id="user" required><label for="pass">Password</label><input id="pass" type="password" required><button type="submit" id="addBtn">Add</button></form></section><section><h2>Vault</h2><ul id="list"></ul><p id="emptyState">Your vault is empty. Add a site above to get started.</p></section><section id="fullControls" style="display:none"><button id="exportBtn">Export Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import Data</button></section></main><footer>© 2026 VaultMate</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K="vaultmate.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let vault=load();function render(){const list=document.getElementById('list');list.innerHTML='';vault.forEach((it,i)=>{const li=document.createElement('li');li.textContent=`${it.site} (${it.user})`;const del=document.createElement('button');del.textContent='Delete';del.addEventListener('click',()=>{deleteItem(i)});li.appendChild(del);list.appendChild(li);});document.getElementById('emptyState').style.display=vault.length?"none":"block";document.getElementById('addBtn').disabled=vault.length>=LIMITS.maxItems;if(LIMITS.export){document.getElementById('fullControls').style.display='block'}else{document.getElementById('fullControls').style.display='none'}}function addItem(e){e.preventDefault();if(vault.length>=LIMITS.maxItems)return;const site=document.getElementById('site').value.trim();const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value.trim();vault.push({site,user,pass});save(vault);document.getElementById('entryForm').reset();render()}function deleteItem(idx){vault.splice(idx,1);save(vault);render()}function exportData(){const data=JSON.stringify(vault,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vaultmate.json';a.click();URL.revokeObjectURL(url);}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const arr=JSON.parse(reader.result);if(Array.isArray(arr)){vault=arr;save(vault);render();}}catch(err){} };reader.readAsText(file);}function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved;}else{document.documentElement.dataset.theme='light';}}function toggleTheme(){const cur=document.documentElement.dataset.theme;const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);}document.getElementById('entryForm').addEventListener('submit',addItem);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);document.getElementById('themeToggle').addEventListener('click',toggleTheme);initTheme();render();</script></body></html>
