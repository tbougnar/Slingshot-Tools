<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaultMate – Offline Password Manager</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header h1{margin:0}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}input,select{padding:.4rem;border:1px solid #ccc;border-radius:.3rem;width:100%}label{display:block;margin-top:.8rem}section{background:#fff;border-radius:.5rem;padding:1rem;margin-top:1rem;box-shadow:0 2px 5px rgba(0,0,0,.1)}.card{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #eee}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>VaultMate</h1><button id="themeToggle">Toggle Theme</button></header><main><section id="emptyState"><p>Your vault is empty. Add a site to get started.</p></section><section id="listSection" style="display:none"><h2>Saved passwords</h2><div id="list"></div></section><section><h2>Add / Update Entry</h2><form id="entryForm"><label>Site<input type="text" id="site" required></label><label>Username<input type="text" id="user" required></label><label>Password<input type="text" id="pass" required></label><button type="submit" id="saveBtn">Save</button></form></section><section id="exportSection" style="display:none"><h2>Data</h2><button id="exportBtn">Export JSON</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import JSON</button></section></main><footer>VaultMate – secure offline password manager</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const EFFECTIVE=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const STORAGE_KEY="vaultmate.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch(e){return []}};const save=v=>localStorage.setItem(STORAGE_KEY,JSON.stringify(v));function render(){const data=load();document.getElementById('list').innerHTML='';if(data.length===0){document.getElementById('emptyState').style.display='block';document.getElementById('listSection').style.display='none'}else{document.getElementById('emptyState').style.display='none';document.getElementById('listSection').style.display='block';data.forEach((item,i)=>{const div=document.createElement('div');div.className='card';div.innerHTML=`<span><strong>${item.site}</strong> – ${item.user}</span><span><button id="edit${i}">Edit</button> <button id="del${i}">Del</button></span>`;document.getElementById('list').appendChild(div);document.getElementById(`edit${i}`).addEventListener('click',()=>editItem(i));document.getElementById(`del${i}`).addEventListener('click',()=>deleteItem(i));});}if(EFFECTIVE.export){document.getElementById('exportSection').style.display='block'}else{document.getElementById('exportSection').style.display='none'} }function addItem(e){e.preventDefault();const site=document.getElementById('site').value.trim();const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value.trim();if(!site||!user||!pass)return;let data=load();if(data.length>=EFFECTIVE.maxItems){alert('Item limit reached');return}data.push({site,user,pass});save(data);document.getElementById('entryForm').reset();render();}function editItem(idx){const data=load();const item=data[idx];document.getElementById('site').value=item.site;document.getElementById('user').value=item.user;document.getElementById('pass').value=item.pass;document.getElementById('saveBtn').textContent='Update';document.getElementById('entryForm').onsubmit=function(e){e.preventDefault();item.site=document.getElementById('site').value.trim();item.user=document.getElementById('user').value.trim();item.pass=document.getElementById('pass').value.trim();save(data);document.getElementById('entryForm').reset();document.getElementById('saveBtn').textContent='Save';document.getElementById('entryForm').onsubmit=addItem;render();};}function deleteItem(idx){let data=load();data.splice(idx,1);save(data);render();}function exportData(){const data=load();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vaultmate.json';a.click();URL.revokeObjectURL(url);}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=function(){try{const arr=JSON.parse(reader.result);if(Array.isArray(arr)){save(arr);render();}else{alert('Invalid file');}}catch{alert('Invalid JSON');};reader.readAsText(file);}function toggleTheme(){const cur=document.documentElement.dataset.theme||'light';const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);}function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved;}else{document.documentElement.dataset.theme='light';}}document.getElementById('entryForm').addEventListener('submit',addItem);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);document.getElementById('themeToggle').addEventListener('click',toggleTheme);initTheme();render();</script></body></html>
