<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VaultMate - Offline Password Manager</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}input,select{padding:.4rem;border:1px solid #ccc;border-radius:.3rem;width:100%;box-sizing:border-box}label{display:block;margin-top:.8rem}section{background:#fff;border-radius:.5rem;padding:1rem;margin-top:1rem;box-shadow:0 2px 5px rgba(0,0,0,.1)}.card{background:#fff;padding:1rem;border-radius:.5rem;margin-top:.5rem;box-shadow:0 1px 3px rgba(0,0,0,.1)}.empty{color:#777;text-align:center;margin-top:2rem}#themeToggle{position:fixed;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>VaultMate</h1></header><button id="themeToggle">Toggle Theme</button><main><section id="addSection"><h2>Add New Entry</h2><form id="entryForm"><label for="site">Site</label><input id="site" required><label for="username">Username</label><input id="username" required><label for="password">Password</label><input id="password" type="password" required><button type="submit">Save</button></form></section><section id="listSection"><h2>Saved Passwords</h2><div id="listContainer"></div></section></main><footer>VaultMate – secure offline password manager</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='vaultmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return [];}};const save=v=>localStorage.setItem(K,JSON.stringify(v));const themeKey='vaultmate.theme';const applyTheme=()=>{const saved=localStorage.getItem(themeKey)||'light';document.documentElement.dataset.theme=saved;};applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{const newT=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=newT;localStorage.setItem(themeKey,newT);});function renderList(){const container=document.getElementById('listContainer');container.innerHTML='';const data=load();if(data.length===0){container.innerHTML='<p class="empty">No passwords saved. Add one above.</p>';return;}data.forEach((item,i)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<strong>${item.site}</strong><br>Username: ${item.username}<br>Password: ${item.password}<br><button id="del${i}">Delete</button>`;container.appendChild(card);document.getElementById(`del${i}`).addEventListener('click',()=>{deleteItem(i);});});if(LIMITS.export||LIM.export){const exp=document.createElement('button');exp.textContent='Export Data';exp.addEventListener('click',exportData);container.appendChild(exp);}if(LIMITS.bulk||LIM.bulk){const imp=document.createElement('button');imp.textContent='Import Data';imp.addEventListener('click',()=>{document.getElementById('importFile').click();});container.appendChild(imp);const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='application/json';fileInput.id='importFile';fileInput.style.display='none';fileInput.addEventListener('change',importData);container.appendChild(fileInput);} }function addItem(e){e.preventDefault();const site=document.getElementById('site').value.trim();const user=document.getElementById('username').value.trim();const pass=document.getElementById('password').value.trim();const data=load();if(data.length>=LIM.max){alert('Item limit reached. Upgrade for unlimited entries.');return;}data.push({site,user,username:user,password:pass});save(data);document.getElementById('entryForm').reset();renderList();}function deleteItem(idx){const data=load();data.splice(idx,1);save(data);renderList();}function exportData(){const data=load();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vaultmate_export.json';a.click();URL.revokeObjectURL(url);}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const imported=JSON.parse(reader.result);if(!Array.isArray(imported))throw new Error();save(imported);renderList();}catch{alert('Invalid file');}};reader.readAsText(file);}document.getElementById('entryForm').addEventListener('submit',addItem);renderList();</script></body></html>
