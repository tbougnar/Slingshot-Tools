<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VaultMate - Offline Password Manager</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header h1{margin:0;font-size:1.5rem}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}input,select{padding:.4rem;border:1px solid #ccc;border-radius:.3rem;width:100%;box-sizing:border-box}label{display:block;margin-top:.8rem}#list{display:grid;gap:1rem;margin-top:1rem}card{display:block;background:#fff;padding:1rem;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1)}.theme-toggle{position:fixed;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>VaultMate</h1></header><button id="themeToggle" class="theme-toggle">Toggle Theme</button><main><section id="emptyState"><p>Add your first password entry using the form below.</p></section><section id="formSection"><form id="entryForm"><label for="site">Site</label><input id="site" required><label for="user">Username</label><input id="user" required><label for="pass">Password</label><input id="pass" type="password" required><button type="submit">Add Entry</button></form></section><section id="list"></section><section id="exportSection" style="margin-top:1rem;"><button id="exportBtn">Export Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import Data</button></section></main><footer>VaultMate – secure offline password manager</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const STORAGE_KEY='vaultmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch(e){return []}};const save=v=>localStorage.setItem(STORAGE_KEY,JSON.stringify(v));let entries=load();function render(){const list=document.getElementById('list');list.innerHTML='';if(entries.length===0){document.getElementById('emptyState').style.display='block'}else{document.getElementById('emptyState').style.display='none'}entries.forEach((e,i)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<strong>${e.site}</strong><br>Username: ${e.user}<br>Password: ${e.pass}<br><button data-idx="${i}">Delete</button>`;list.appendChild(card);});document.querySelectorAll('.card button').forEach(btn=>{btn.addEventListener('click',function(){const idx=this.dataset.idx;entries.splice(idx,1);save(entries);render();});});}
function addEntry(e){e.preventDefault();if(entries.length>=LIM.maxItems){alert('Item limit reached');return}const site=document.getElementById('site').value.trim();const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value.trim();entries.push({site,user,pass});save(entries);document.getElementById('entryForm').reset();render();}
function exportData(){if(!LIM.export){alert('Export not available in this edition');return}const data=JSON.stringify(entries,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vaultmate.json';a.click();URL.revokeObjectURL(url);}
function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const arr=JSON.parse(reader.result);if(Array.isArray(arr)){entries=arr;save(entries);render();}}catch{alert('Invalid file');}};reader.readAsText(file);}
function toggleTheme(){const cur=document.documentElement.dataset.theme||'light';const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);applyTheme();}
function applyTheme(){const theme=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=theme;if(theme==='dark'){document.documentElement.style.setProperty('--bg','#14100F');document.documentElement.style.setProperty('--fg','#F6EFEC');document.documentElement.style.setProperty('--accent','#C1272D');document.body.style.background='#14100F';document.body.style.color='#F6EFEC';}else{document.documentElement.style.setProperty('--bg','#F6EFEC');document.documentElement.style.setProperty('--fg','#14100F');document.documentElement.style.setProperty('--accent','#C1272D');document.body.style.background='#F6EFEC';document.body.style.color='#14100F';}}
document.getElementById('entryForm').addEventListener('submit',addEntry);
document.getElementById('exportBtn').addEventListener('click',exportData);
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',importData);
document.getElementById('themeToggle').addEventListener('click',toggleTheme);
applyTheme();render();</script></body></html>
