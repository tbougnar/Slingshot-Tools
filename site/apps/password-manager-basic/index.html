<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VaultMate - Offline Password Manager</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}input,select{padding:.4rem;border:1px solid #ccc;border-radius:.3rem;width:100%;box-sizing:border-box}label{margin-top:.5rem;display:block}section{background:#fff;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:1rem;margin-bottom:1rem}#list{list-style:none;padding:0;margin:0}#list li{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #eee}#list li:last-child{border:none}.theme-toggle{position:fixed;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>VaultMate</h1></header><button class="theme-toggle" id="themeBtn">Toggle Theme</button><main><section id="emptyState"><p>Start by adding a new password entry.</p></section><section id="formSection"><form id="entryForm"><label for="site">Site</label><input id="site" required><label for="user">Username</label><input id="user" required><label for="pass">Password</label><input id="pass" type="password" required><button type="submit">Add</button></form></section><section><ul id="list"></ul></section><section id="exportSection" style="display:none;"><button id="exportBtn">Export Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import Data</button></section></main><footer>© VaultMate</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export};const K='vaultmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let data=load();function render(){document.getElementById('list').innerHTML='';if(data.length===0){document.getElementById('emptyState').style.display='block'}else{document.getElementById('emptyState').style.display='none'}data.forEach((it,i)=>{const li=document.createElement('li');li.textContent=it.site+' / '+it.user;const del=document.createElement('button');del.textContent='Delete';del.addEventListener('click',()=>{data.splice(i,1);save(data);render();});li.appendChild(del);document.getElementById('list').appendChild(li);});if(LIM.export){document.getElementById('exportSection').style.display='block'}else{document.getElementById('exportSection').style.display='none'} }document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();if(data.length>=LIM.max){alert('Item limit reached');return}const site=document.getElementById('site').value.trim();const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value.trim();if(!site||!user||!pass)return;data.push({site,user,pass});save(data);e.target.reset();render();});document.getElementById('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vaultmate.json';a.click();URL.revokeObjectURL(url);});document.getElementById('importBtn').addEventListener('click',()=>{document.getElementById('importFile').click();});document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const arr=JSON.parse(ev.target.result);if(Array.isArray(arr)){data=arr;save(data);render();}}catch{};};reader.readAsText(file);});function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);if(t==='dark'){document.documentElement.style.setProperty('--bg','#14100F');document.documentElement.style.setProperty('--fg','#F6EFEC');document.documentElement.style.setProperty('--accent','#C1272D');}else{document.documentElement.style.setProperty('--bg','#F6EFEC');document.documentElement.style.setProperty('--fg','#14100F');document.documentElement.style.setProperty('--accent','#C1272D');}}document.getElementById('themeBtn').addEventListener('click',()=>{const cur=localStorage.getItem('theme')||'light';applyTheme(cur==='light'?'dark':'light');});const savedTheme=localStorage.getItem('theme')||'light';applyTheme(savedTheme);render();</script></body></html>
