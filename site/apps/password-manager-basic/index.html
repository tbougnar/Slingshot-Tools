<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VaultMate – Offline Password Manager</title><style>body{font-family:sans-serif;margin:0;padding:0;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header h1{margin:0;font-size:1.5rem}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer;margin:0 .2rem}button:focus{outline:2px solid #F6EFEC}input,select{padding:.4rem;border:1px solid #C1272D;border-radius:.3rem;width:100%;box-sizing:border-box;margin-bottom:.5rem}label{display:block;margin-bottom:.2rem} .card{background:#fff;padding:1rem;margin-bottom:1rem;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1)}html[data-theme='dark'] .card{background:#1e1a1a} .empty{text-align:center;color:#777;margin-top:2rem} .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}</style></head><body><header><h1>VaultMate</h1></header><main><div class="toolbar"><button id="themeToggle">Toggle Theme</button><span id="upgradeMsg" style="font-size:.9rem;color:#555"></span></div><section id="emptyState" class="empty">Add your first password entry using the form below.</section><section id="list"></section><section><form id="entryForm"><h2>Add / Edit Entry</h2><label for="site">Site</label><input type="text" id="site" required><label for="user">Username</label><input type="text" id="user" required><label for="pass">Password</label><input type="text" id="pass" required><button type="submit" id="saveBtn">Save</button><button type="button" id="cancelEdit" style="display:none">Cancel</button></form></section><section id="exportSection" style="margin-top:1rem;display:none"><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section></main><footer>© 2026 VaultMate</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K='vaultmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let entries=load();let editIndex=null;function render(){const list=document.getElementById('list');list.innerHTML='';if(entries.length===0){document.getElementById('emptyState').style.display='block';}else{document.getElementById('emptyState').style.display='none';entries.forEach((e,i)=>{const card=document.createElement('div');card.className='card';card.innerHTML=`<strong>${e.site}</strong><br>User: ${e.user}<br>Pass: ${e.pass}<br><button data-i="${i}" class="editBtn">Edit</button> <button data-i="${i}" class="delBtn">Delete</button>`;list.appendChild(card);});}
if(LIMITS.export){document.getElementById('exportSection').style.display='block';}else{document.getElementById('exportSection').style.display='none';}
if(TIER==='basic'){document.getElementById('upgradeMsg').textContent='Upgrade for unlimited entries, export, themes and history.';}else{document.getElementById('upgradeMsg').textContent='';}
}
function addEntry(e){e.preventDefault();const site=document.getElementById('site').value.trim();const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value.trim();if(!site||!user||!pass)return;if(editIndex!==null){entries[editIndex]={site,user,pass};editIndex=null;document.getElementById('cancelEdit').style.display='none';}else{if(entries.length>=LIMITS.maxItems){alert('Item limit reached.');return;}entries.push({site,user,pass});}
save(entries);document.getElementById('entryForm').reset();render();}
function editEntry(i){editIndex=i;const e=entries[i];document.getElementById('site').value=e.site;document.getElementById('user').value=e.user;document.getElementById('pass').value=e.pass;document.getElementById('cancelEdit').style.display='inline-block';}
function deleteEntry(i){if(confirm('Delete this entry?')){entries.splice(i,1);save(entries);render();}}
function cancelEdit(){editIndex=null;document.getElementById('entryForm').reset();document.getElementById('cancelEdit').style.display='none';}
function toggleTheme(){const cur=document.documentElement.dataset.theme;document.documentElement.dataset.theme=cur==='light'?'dark':'light';localStorage.setItem('theme',document.documentElement.dataset.theme);}
function exportData(){const data=JSON.stringify(entries,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vaultmate.json';a.click();URL.revokeObjectURL(url);}
function importData(){const file=document.getElementById('importFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const arr=JSON.parse(e.target.result);if(Array.isArray(arr)){entries=arr;save(entries);render();}else{alert('Invalid file');}}catch{alert('Invalid JSON');}};reader.readAsText(file);}
document.getElementById('entryForm').addEventListener('submit',addEntry);
document.getElementById('cancelEdit').addEventListener('click',cancelEdit);
document.getElementById('themeToggle').addEventListener('click',toggleTheme);
if(LIMITS.export){document.getElementById('exportBtn').addEventListener('click',exportData);
document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change',importData);}
document.getElementById('list').addEventListener('click',e=>{if(e.target.classList.contains('editBtn')){editEntry(parseInt(e.target.dataset.i));}else if(e.target.classList.contains('delBtn')){deleteEntry(parseInt(e.target.dataset.i));}});
const savedTheme=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=savedTheme;render();</script></body></html>
