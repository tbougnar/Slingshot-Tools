<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>VaultMate - Offline Password Manager</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center;font-size:1.5rem}footer{margin-top:auto;background:#C1272D;color:#F6EFEC;padding:0.5rem;text-align:center;font-size:0.9rem}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem}#themeToggle{position:absolute;top:1rem;right:1rem;background:none;border:none;color:inherit;cursor:pointer}section{background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1);padding:1rem}h2{margin-top:0}input,select,button{font:inherit;margin:0.2rem 0;width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:4px}button{background:#C1272D;color:#F6EFEC;border:none;cursor:pointer}button:disabled{background:#aaa;cursor:not-allowed}#list{list-style:none;padding:0;margin:0}#list li{display:flex;justify-content:space-between;align-items:center;padding:0.5rem;border-bottom:1px solid #eee}#list li:last-child{border-bottom:none}.hidden{display:none}</style></head><body><button id="themeToggle" aria-label="Toggle theme">🌙</button><header>VaultMate</header><main><section id="emptyState"><p>Start by adding a site, username and password below.</p></section><section><h2>Add Entry</h2><form id="entryForm"><label for="site">Site</label><input id="site" type="text" required><label for="user">Username</label><input id="user" type="text" required><label for="pass">Password</label><input id="pass" type="text" required><button type="submit">Save</button></form></section><section><h2>Saved Passwords</h2><ul id="list"></ul></section><section id="exportSection" class="hidden"><h2>Data Transfer</h2><button id="exportBtn">Export My Data</button><input id="importFile" type="file" accept="application/json" class="hidden"><button id="importBtn">Import My Data</button></section></main><footer>© 2026 VaultMate</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='vaultmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch{return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));const applyTheme=()=>{const saved=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=saved;};applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme;const nxt=cur==='light'?'dark':'light';document.documentElement.dataset.theme=nxt;localStorage.setItem('theme',nxt);});function render(){const list=document.getElementById('list');list.innerHTML='';const data=load();if(data.length===0){document.getElementById('emptyState').classList.remove('hidden');}else{document.getElementById('emptyState').classList.add('hidden');}data.forEach((item,i)=>{const li=document.createElement('li');li.innerHTML=`<span>${item.site} (${item.user})</span><button data-idx="${i}">Delete</button>`;list.appendChild(li);});if(LIM.export){document.getElementById('exportSection').classList.remove('hidden');}else{document.getElementById('exportSection').classList.add('hidden');}}render();document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();const site=document.getElementById('site').value.trim();const user=document.getElementById('user').value.trim();const pass=document.getElementById('pass').value.trim();if(!site||!user||!pass)return;const data=load();if(data.length>=LIM.max){alert('Maximum items reached. Upgrade for unlimited entries.');return;}data.push({site,user,pass});save(data);e.target.reset();render();});document.getElementById('list').addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;const idx=e.target.dataset.idx;const data=load();data.splice(idx,1);save(data);render();});document.getElementById('exportBtn').addEventListener('click',()=>{const data=load();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vaultmate-data.json';a.click();URL.revokeObjectURL(url);});document.getElementById('importBtn').addEventListener('click',()=>{document.getElementById('importFile').click();});document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const imported=JSON.parse(ev.target.result);if(!Array.isArray(imported))throw new Error();save(imported);render();}catch{alert('Invalid file');}};reader.readAsText(file);});</script></body></html>
