<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StreamCalc – Data Transfer Calculator</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer;margin:.2rem}button:hover{opacity:.9}input,select{padding:.4rem;border:1px solid #ccc;border-radius:.3rem;margin:.2rem;width:100%;box-sizing:border-box}label{display:block;margin-top:.5rem}section{background:#fff;padding:1rem;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1);margin-bottom:1rem}html[data-theme='dark'] section{background:#1e1a1a}#themeToggle{position:absolute;top:1rem;right:1rem;background:#fff;color:#14100F}</style></head><body><header>StreamCalc <button id="themeToggle">Toggle Theme</button></header><main><section id="inputSection"><h2>Calculate Transfer Time</h2><form id="calcForm"><label>Data size (GB)<input type="number" id="size" min="0" step="0.01" required></label><label>Speed (Mbps)<input type="number" id="speed" min="0" step="0.01" required></label><button type="submit" id="calcBtn">Calculate</button></form><p id="result"></p></section><section id="listSection"><h2>Recent Calculations</h2><ul id="list"></ul><p id="emptyState">Add a calculation to see history here.</p></section><section id="exportSection" style="display:none;"><h2>Data Management</h2><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section></main><footer>© 2026 StreamCalc</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM={max:TIER==='full'?Infinity:BASIC_LIMITS.maxItems,export:TIER==='full'?true:BASIC_LIMITS.export,bulk:TIER==='full'?true:BASIC_LIMITS.bulk,history:TIER==='full'?true:BASIC_LIMITS.history};const STORAGE_KEY='streamcalc.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch{return[]}};const save=v=>localStorage.setItem(STORAGE_KEY,JSON.stringify(v));function renderList(){const list=document.getElementById('list');list.innerHTML='';const data=load();if(data.length===0){document.getElementById('emptyState').style.display='block'}else{document.getElementById('emptyState').style.display='none'}data.slice(-LIM.max).forEach((item,i)=>{const li=document.createElement('li');li.textContent=`${item.size} GB @ ${item.speed} Mbps → ${item.time} s`;list.appendChild(li)});if(LIM.history===false)document.getElementById('listSection').style.display='none'};document.getElementById('calcForm').addEventListener('submit',e=>{e.preventDefault();const size=parseFloat(document.getElementById('size').value);const speed=parseFloat(document.getElementById('speed').value);if(isNaN(size)||isNaN(speed)||speed===0){document.getElementById('result').textContent='Enter valid numbers.';return}const time=((size*8*1024)/speed).toFixed(2);document.getElementById('result').textContent=`Transfer time: ${time} seconds`;const data=load();data.push({size, speed, time});save(data);renderList()});document.getElementById('themeToggle').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme;const next=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next)});function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved}else{document.documentElement.dataset.theme='light'}}initTheme();if(LIM.export){document.getElementById('exportSection').style.display='block'}document.getElementById('exportBtn').addEventListener('click',()=>{const data=load();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='streamcalc-data.json';a.click()});document.getElementById('importBtn').addEventListener('click',()=>{document.getElementById('importFile').click()});document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const arr=JSON.parse(ev.target.result);if(Array.isArray(arr)){save(arr);renderList()}else{alert('Invalid file')}}catch{alert('Failed to parse file')}};reader.readAsText(file)});renderList();</script></body></html>
