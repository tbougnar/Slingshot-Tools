<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SpecShift – Glasses Prescription Converter</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header h1{margin:0}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}input,select{padding:.4rem;border:1px solid #ccc;border-radius:.3rem;width:100%}label{display:block;margin-top:.8rem}section{background:#fff;border-radius:.5rem;padding:1rem;margin-top:1rem;box-shadow:0 2px 5px rgba(0,0,0,.1)}.card{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid #eee}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>SpecShift</h1><button id="themeToggle">Toggle Theme</button></header><main><section><h2>Convert Prescription</h2><form id="convForm"><label>Sphere<input type="number" step="0.25" id="sphere" required></label><label>Cylinder<input type="number" step="0.25" id="cyl" required></label><label>Axis<input type="number" min="0" max="180" id="axis" required></label><button type="submit">Add</button></form></section><section id="listSection"><h2>Your Prescriptions</h2><div id="emptyState">Add a prescription above to get started.</div><div id="list"></div></section><section id="exportSection" style="display:none"><h2>Data</h2><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section></main><footer>© 2026 SpecShift</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K="specshift.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch{return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));const themeKey="specshift.theme";const applyTheme=t=>{document.documentElement.dataset.theme=t;localStorage.setItem(themeKey,t)};document.addEventListener('DOMContentLoaded',()=>{const storedTheme=localStorage.getItem(themeKey)||'light';applyTheme(storedTheme);document.getElementById('themeToggle').addEventListener('click',()=>{applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light')});const form=document.getElementById('convForm');form.addEventListener('submit',e=>{e.preventDefault();addItem();});document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);render();if(LIMITS.export){document.getElementById('exportSection').style.display='block'};});function addItem(){const s=parseFloat(document.getElementById('sphere').value);const c=parseFloat(document.getElementById('cyl').value);const a=parseInt(document.getElementById('axis').value,10);if(isNaN(s)||isNaN(c)||isNaN(a))return;let items=load();if(items.length>=LIMITS.maxItems){alert('Maximum items reached');return}items.push({sphere:s,cyl:c,axis:a});save(items);document.getElementById('convForm').reset();render();}function deleteItem(i){let items=load();items.splice(i,1);save(items);render();}function render(){const list=document.getElementById('list');const empty=document.getElementById('emptyState');let items=load();list.innerHTML='';if(items.length===0){empty.style.display='block'}else{empty.style.display='none';items.forEach((it,idx)=>{const div=document.createElement('div');div.className='card';div.innerHTML=`<span>⦿ ${it.sphere} ${it.cyl} ×${it.axis}°</span>`;const del=document.createElement('button');del.textContent='Delete';del.addEventListener('click',()=>deleteItem(idx));div.appendChild(del);list.appendChild(div);});}}function exportData(){const data=JSON.stringify(load(),null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='specshift-data.json';a.click();URL.revokeObjectURL(url);}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const arr=JSON.parse(ev.target.result);if(!Array.isArray(arr))throw'Invalid';save(arr);render();}catch{alert('Failed to import');}};reader.readAsText(file);}</script></body></html>
