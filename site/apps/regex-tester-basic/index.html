<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RegexMate - Regex tester</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;max-width:800px;margin:auto}section{background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1);padding:1rem;margin-bottom:1rem}label{display:block;margin-top:.5rem}input,textarea,select,button{width:100%;padding:.5rem;margin-top:.3rem;border:1px solid #ccc;border-radius:4px}button{background:#C1272D;color:#F6EFEC;border:none;cursor:pointer}button:hover{background:#a01f2a}#themeToggle{width:auto;display:inline-block;margin-top:0}pre{background:#eee;padding:.5rem;border-radius:4px;overflow:auto}</style></head><body><header>RegexMate</header><main><section id="intro"><p>Enter a regex and test text to see live matches and explanations.</p></section><section id="editor"><label for="regexInput">Regex pattern</label><input type="text" id="regexInput" placeholder="e.g. ^\\d{3}$" aria-label="Regex pattern"><label for="textInput">Test text (one per line)</label><textarea id="textInput" rows="5" placeholder="Enter text lines here" aria-label="Test text"></textarea><button id="runBtn">Run Test</button></section><section id="results" style="display:none;"><h2>Results</h2><div id="matchList"></div></section><section id="emptyState" style="display:none;"><p>No saved tests. Create a new test above.</p></section><section id="exportImport" style="display:none;"><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section></main><footer><button id="themeToggle">Toggle Light/Dark</button></footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity}:{max:BASIC_LIMITS.maxItems};const K='regexmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||null}catch(e){return null}};const save=v=>localStorage.setItem(K,JSON.stringify(v));function applyTheme(){let theme=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=theme;document.body.style.background=theme==='dark'?'#14100F':'#F6EFEC';document.body.style.color=theme==='dark'?'#F6EFEC':'#14100F'}applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{let newTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=newTheme;localStorage.setItem('theme',newTheme);applyTheme();});function render(){let data=load()||[];if(data.length===0){document.getElementById('emptyState').style.display='block'}else{document.getElementById('emptyState').style.display='none'}if(PAID){document.getElementById('exportImport').style.display='block'}else{document.getElementById('exportImport').style.display='none'} }render();function runTest(e){e.preventDefault();let pattern=document.getElementById('regexInput').value;let text=document.getElementById('textInput').value.split('\n');let regex;try{regex=new RegExp(pattern,'g')}catch(err){alert('Invalid regex');return}let matches=[];text.forEach(line=>{let m=line.match(regex);if(m){matches.push({line,lineMatches:m})}});let container=document.getElementById('matchList');container.innerHTML='';if(matches.length===0){container.textContent='No matches'}else{matches.forEach(item=>{let div=document.createElement('div');div.textContent=`Line: ${item.line} → ${item.lineMatches.join(', ')}`;container.appendChild(div)})}document.getElementById('results').style.display='block';let stored=load()||[];if(stored.length<LIM.max){stored.push({pattern,text:document.getElementById('textInput').value});save(stored)}else if(!PAID){alert('Basic limit reached. Upgrade for more tests.');}}document.getElementById('runBtn').addEventListener('click',runTest);function exportData(){let data=load()||[];let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='regexmate-data.json';a.click();URL.revokeObjectURL(url);}document.getElementById('exportBtn').addEventListener('click',exportData);function importData(){let file=document.getElementById('importFile').files[0];if(!file)return;let reader=new FileReader();reader.onload=function(e){try{let arr=JSON.parse(e.target.result);save(arr);render();alert('Data imported');}catch{alert('Invalid file')}};reader.readAsText(file);}document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);</script></body></html>
