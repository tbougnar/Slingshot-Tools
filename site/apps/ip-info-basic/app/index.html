<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Subnetter – Offline IP and subnet helper</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}main{flex:1;padding:1rem;max-width:800px;margin:auto}button,select,input{font:inherit;padding:.5rem;margin:.2rem;border:1px solid #C1272D;border-radius:.3rem;background:#fff;color:#14100F;cursor:pointer}button:hover{background:#C1272D;color:#F6EFEC}.card{background:#fff;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:1rem;margin:.5rem 0}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F;color:#F6EFEC}</style></head><body><header><h1>Subnetter</h1><button id="themeToggle">Toggle Theme</button></header><main><section class="card" id="inputSection"><h2>IP / CIDR</h2><form id="calcForm"><label for="ipInput">IP address</label><input type="text" id="ipInput" placeholder="192.168.1.0" required><label for="cidrInput">CIDR</label><input type="number" id="cidrInput" min="0" max="32" placeholder="24" required><button type="submit" id="calcBtn">Calculate</button></form></section><section class="card" id="resultSection" style="display:none"><h2>Result</h2><pre id="result"></pre><button id="clearBtn">Clear</button></section><section class="card" id="historySection" style="display:none"><h2>History</h2><ul id="historyList"></ul></section><section class="card" id="exportSection" style="display:none"><h2>Data</h2><button id="exportBtn">Export JSON</button><input type="file" id="importFile" accept="application/json"><button id="importBtn">Import JSON</button></section><section class="card" id="emptyState"><p>Add an IP address and CIDR, then press Calculate.</p></section></main><footer>© 2026 Subnetter</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has("paid");const LIM=PAID?{max:Infinity,export:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,history:BASIC_LIMITS.history};const K="subnetter.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch{return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));const applyTheme=()=>{let t=localStorage.getItem("theme")||"light";document.documentElement.dataset.theme=t;document.body.style.background=t==="dark"?"#14100F":"#F6EFEC";document.body.style.color=t==="dark"?"#F6EFEC":"#14100F"};applyTheme();document.getElementById("themeToggle").addEventListener("click",()=>{let n=document.documentElement.dataset.theme==="dark"?"light":"dark";localStorage.setItem("theme",n);applyTheme()});function renderHistory(){let h=load();if(h.length&&LIM.history){document.getElementById("historySection").style.display="block";let ul=document.getElementById("historyList");ul.innerHTML="";h.slice(-LIM.max).forEach((it,i)=>{let li=document.createElement("li");li.textContent=it;ul.appendChild(li);});}else{document.getElementById("historySection").style.display="none"}}function addHistory(txt){let h=load();h.push(txt);save(h);renderHistory()}function calc(e){e.preventDefault();let ip=document.getElementById("ipInput").value.trim();let cidr=parseInt(document.getElementById("cidrInput").value);if(!ip||isNaN(cidr)||cidr<0||cidr>32){alert("Enter valid IP and CIDR");return}let parts=ip.split('.').map(Number);if(parts.length!==4||parts.some(p=>p<0||p>255)){alert("Invalid IP");return}let mask=(0xFFFFFFFF<< (32-cidr))>>>0;let ipNum=parts.reduce((a,b)=>a*256+b,0);let net=ipNum & mask;let broadcast=net|(~mask>>>0);function numToIp(n){return[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.')}let res=`IP: ${ip}\nCIDR: /${cidr}\nNetmask: ${numToIp(mask)}\nNetwork: ${numToIp(net)}\nBroadcast: ${numToIp(broadcast)}\nUsable hosts: ${cidr<31?Math.pow(2,32-cidr)-2:0}`;document.getElementById("result").textContent=res;document.getElementById("resultSection").style.display="block";document.getElementById("emptyState").style.display="none";addHistory(res)}document.getElementById("calcForm").addEventListener("submit",calc);document.getElementById("clearBtn").addEventListener("click",()=>{document.getElementById("resultSection").style.display="none";document.getElementById("emptyState").style.display="block"});if(LIM.export){document.getElementById("exportSection").style.display="block";document.getElementById("exportBtn").addEventListener("click",()=>{let data=load();let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="subnetter-data.json";a.click()});document.getElementById("importBtn").addEventListener("click",()=>{let file=document.getElementById("importFile").files[0];if(!file)return;let r=new FileReader();r.onload=e=>{try{let arr=JSON.parse(e.target.result);if(Array.isArray(arr)){save(arr);renderHistory();}}catch{alert("Invalid file")}};r.readAsText(file)})}renderHistory();</script></body></html>
