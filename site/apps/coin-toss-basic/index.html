<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FlipDice – Coin & Dice</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem}main{flex:1;padding:1rem;max-width:600px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.5rem;box-shadow:0 2px 4px rgba(0,0,0,.2);cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}select,input{padding:.4rem;border:1px solid #ccc;border-radius:.4rem}section{margin-bottom:1.5rem;background:#fff;padding:1rem;border-radius:.5rem;box-shadow:0 2px 6px rgba(0,0,0,.1)}html[data-theme='dark'] section{background:#1e1a1a}#history{max-height:150px;overflow:auto;font-size:.9rem}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}</style></head><body><header>FlipDice – Coin & Dice</header><button id="themeToggle">Toggle Theme</button><main><section id="controls"><h2>Make a Choice</h2><button id="coinBtn">Flip Coin</button><select id="diceSelect"><option value="6">d6</option><option value="12">d12</option><option value="20">d20</option></select><button id="diceBtn">Roll Dice</button></section><section id="result"><h2>Result</h2><p id="output">Press a button to start.</p></section><section id="historySection" style="display:none;"><h2>History</h2><div id="history"></div></section><section id="dataSection" style="display:none;"><h2>Data</h2><button id="exportBtn">Export Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import Data</button></section></main><footer>Free basic edition: quick flips for a few items. Paid edition: unlimited flips, export, history and themes.</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM= TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K='flipdice.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{history:[]}}catch(e){return{history:[]}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));function applyTheme(){const saved=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=saved;}applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme;const nxt=cur==='light'?'dark':'light';document.documentElement.dataset.theme=nxt;localStorage.setItem('theme',nxt);});function updateHistory(item){if(!LIM.history)return;const data=load();data.history.push(item);if(data.history.length>LIM.maxItems)data.history.shift();save(data);renderHistory();}function renderHistory(){if(!LIM.history){document.getElementById('historySection').style.display='none';return;}const data=load();const cont=document.getElementById('history');cont.innerHTML='';data.history.slice().reverse().forEach(e=>{const p=document.createElement('p');p.textContent=e;cont.appendChild(p);});document.getElementById('historySection').style.display='block';}function showResult(txt){document.getElementById('output').textContent=txt;updateHistory(txt);}document.getElementById('coinBtn').addEventListener('click',()=>{const res=Math.random()<.5?'Heads':'Tails';showResult('Coin: '+res);});document.getElementById('diceBtn').addEventListener('click',()=>{const sides=parseInt(document.getElementById('diceSelect').value,10);const roll=Math.floor(Math.random()*sides)+1;showResult('d'+sides+': '+roll);});if(LIM.export){document.getElementById('dataSection').style.display='block';document.getElementById('exportBtn').addEventListener('click',()=>{const data=load();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='flipdice-data.json';a.click();URL.revokeObjectURL(url);});document.getElementById('importBtn').addEventListener('click',()=>{document.getElementById('importFile').click();});document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const obj=JSON.parse(ev.target.result);save(obj);renderHistory();}catch{alert('Invalid file');}};reader.readAsText(file);});}renderHistory();</script></body></html>
