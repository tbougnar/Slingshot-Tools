<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ChronoDiff – Calendar Diff</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.4rem;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input,select{padding:.4rem;border:1px solid #C1272D;border-radius:.4rem;width:100%}label{margin-bottom:.2rem;display:block}section{background:#fff;border-radius:.6rem;padding:1rem;box-shadow:0 2px 5px rgba(0,0,0,.1)}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem} .card{background:#fff;padding:1rem;border-radius:.6rem;box-shadow:0 2px 5px rgba(0,0,0,.1)}.empty{text-align:center;color:#555}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}</style></head><body><header>ChronoDiff<button id="themeToggle">Toggle Theme</button></header><main><section id="inputSection"><h2>Compare Date Ranges</h2><form id="diffForm"><label for="start1">Start 1</label><input type="date" id="start1" required><label for="end1">End 1</label><input type="date" id="end1" required><label for="start2">Start 2</label><input type="date" id="start2" required><label for="end2">End 2</label><input type="date" id="end2" required><button type="submit" id="calcBtn">Calculate Diff</button></form></section><section id="resultSection" class="empty">Add two date ranges above to see the difference.</section><section id="historySection" class="empty"></section><section id="exportSection" class="empty"></section></main><footer>© 2026 ChronoDiff</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='chronodiff.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{items:[],history:[]} }catch(e){return {items:[],history:[]}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let state=load();function applyTheme(){let theme=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=theme;document.body.style.background=theme==='dark'?'#14100F':'#F6EFEC';document.body.style.color=theme==='dark'?'#F6EFEC':'#14100F';}applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{let newTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=newTheme;localStorage.setItem('theme',newTheme);applyTheme();});function diffDays(a,b){return Math.round((b-a)/(1000*60*60*24));}function formatRange(s1,e1,s2,e2){return `Range1: ${s1} → ${e1}<br>Range2: ${s2} → ${e2}`;}function renderResult(diff){const sec=document.getElementById('resultSection');sec.innerHTML=`<div class="card"><h3>Difference</h3><p>${diff} day(s)</p></div>`;if(LIM.history){state.history.push({date:new Date().toISOString(),diff});if(state.history.length>50)state.history.shift();save(state);renderHistory();}}function renderHistory(){if(!LIM.history)return;const sec=document.getElementById('historySection');if(state.history.length===0){sec.className='empty';sec.textContent='No history yet.';return;}let html='<h3>History</h3>';state.history.slice().reverse().forEach(h=>{html+=`<div class="card"><small>${new Date(h.date).toLocaleString()}</small><p>${h.diff} day(s)</p></div>`;});sec.innerHTML=html;sec.className='';}function renderExport(){if(!LIM.export)return;const sec=document.getElementById('exportSection');sec.innerHTML=`<button id="exportBtn">Export Data</button> <input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import Data</button>`;document.getElementById('exportBtn').addEventListener('click',()=>{const data=JSON.stringify(state);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='chronodiff.json';a.click();URL.revokeObjectURL(url);});document.getElementById('importBtn').addEventListener('click',()=>{document.getElementById('importFile').click();});document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{state=JSON.parse(ev.target.result);save(state);renderHistory();renderResult('');}catch{alert('Invalid file');}};reader.readAsText(file);});}document.getElementById('diffForm').addEventListener('submit',e=>{e.preventDefault();const s1=document.getElementById('start1').value;const e1=document.getElementById('end1').value;const s2=document.getElementById('start2').value;const e2=document.getElementById('end2').value;if(!s1||!e1||!s2||!e2){alert('All dates required');return;}const d1=new Date(s1),de1=new Date(e1),d2=new Date(s2),de2=new Date(e2);if(de1<d1||de2<d2){alert('End date must be after start date');return;}const diff=diffDays(d1,de1)+diffDays(d2,de2);renderResult(diff);});renderHistory();renderExport();</script></body></html>
