<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Permuta – String Permutation Tool</title><style>body{margin:0;font-family:sans-serif;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.4rem;cursor:pointer;margin:.2rem}button:hover{opacity:.9}input,textarea,select{width:100%;padding:.5rem;margin:.2rem 0;border:1px solid #C1272D;border-radius:.4rem}section{background:#fff;padding:1rem;border-radius:.6rem;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:1rem}html[data-theme='dark'] section{background:#222}#themeToggle{position:absolute;top:1rem;right:1rem;background:#fff;color:#14100F}</style></head><body><header>Permuta – String Permutation Tool<button id="themeToggle">Toggle Theme</button></header><main><section id="inputSection"><h2>Enter characters</h2><input id="chars" type="text" placeholder="e.g. abc" aria-label="Characters"><button id="generateBtn">Generate</button></section><section id="resultSection" style="display:none"><h2>Results (<span id="count"></span>)</h2><textarea id="output" rows="10" readonly></textarea><div id="fullControls" style="margin-top:.5rem"></div></section><section id="emptyState"><p>Start by entering characters and click Generate to see all permutations.</p></section></main><footer>© 2026 Permuta</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true,bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='permuta.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{items:[]}}catch(e){return{items:[]}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));function toggleTheme(){const cur=document.documentElement.dataset.theme;const next=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);}document.getElementById('themeToggle').addEventListener('click',toggleTheme);document.addEventListener('DOMContentLoaded',()=>{const savedTheme=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=savedTheme;});function permute(str){if(str.length<=1)return[str];let res=[];for(let i=0;i<str.length;i++){let ch=str[i];let rest=str.slice(0,i)+str.slice(i+1);for(let p of permute(rest))res.push(ch+p); }return res;}function generate(){const chars=document.getElementById('chars').value.trim();if(!chars){alert('Enter characters');return;}let all=permute(chars);if(LIM.max!==Infinity){all=all.slice(0,LIM.max);}document.getElementById('output').value=all.join('\n');document.getElementById('count').textContent=all.length;document.getElementById('resultSection').style.display='block';document.getElementById('emptyState').style.display='none';if(LIM.export){setupExportImport();}else{document.getElementById('fullControls').innerHTML='';}}function setupExportImport(){const div=document.getElementById('fullControls');div.innerHTML='';const exp=document.createElement('button');exp.textContent='Export';exp.id='exportBtn';exp.addEventListener('click',exportData);div.appendChild(exp);const imp=document.createElement('button');imp.textContent='Import';imp.id='importBtn';imp.addEventListener('click',()=>document.getElementById('importFile').click());div.appendChild(imp);const file=document.createElement('input');file.type='file';file.accept='application/json';file.id='importFile';file.style.display='none';file.addEventListener('change',importData);div.appendChild(file);}function exportData(){const data=load();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='permuta-data.json';a.click();}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);save(obj);alert('Data imported');location.reload();}catch{alert('Invalid file');}};reader.readAsText(file);}document.getElementById('generateBtn').addEventListener('click',generate);</script></body></html>
