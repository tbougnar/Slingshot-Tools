<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B64Buddy – Base64 & URL Tool</title><style>body{font-family:sans-serif;margin:0;padding:0;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header h1{margin:0;font-size:1.5rem}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer;margin:0 .2rem}button:disabled{opacity:.5;cursor:default}textarea{width:100%;height:8rem;margin:.5rem 0;padding:.5rem;border:1px solid #C1272D;border-radius:.3rem;background:#fff;color:#14100F}select,input[type=text]{padding:.3rem;border:1px solid #C1272D;border-radius:.3rem;background:#fff;color:#14100F}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}section{background:#fff;padding:1rem;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1);margin-bottom:1rem}h2{margin-top:0}#list{list-style:none;padding:0}#list li{padding:.5rem;border-bottom:1px solid #eee}#empty{color:#777;text-align:center;margin-top:2rem}</style></head><body><header><h1>B64Buddy</h1><button id="themeToggle">Toggle Theme</button></header><main><section><h2>Input</h2><textarea id="input" placeholder="Enter text or Base64"></textarea><div><button id="enc">Encode Base64</button><button id="dec">Decode Base64</button><button id="urlEnc">URL Encode</button><button id="urlDec">URL Decode</button></div></section><section><h2>Saved Items</h2><ul id="list"></ul><p id="empty">Enter text and use the buttons to create saved items.</p></section></main><footer>© 2026 B64Buddy</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K="b64buddy.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{items:[],theme:"light"}}catch{return{items:[],theme:"light"}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let state=load();document.documentElement.dataset.theme=state.theme;function applyTheme(){document.documentElement.dataset.theme=state.theme;localStorage.setItem("b64buddy.theme",state.theme)}document.getElementById('themeToggle').addEventListener('click',()=>{state.theme=state.theme==='light'?'dark':'light';applyTheme()});function renderList(){const ul=document.getElementById('list');ul.innerHTML='';state.items.forEach((it,i)=>{const li=document.createElement('li');li.textContent=it;ul.appendChild(li)});document.getElementById('empty').style.display=state.items.length?"none":"block"}function addItem(txt){if(state.items.length>=LIMITS.maxItems)return;state.items.unshift(txt);if(state.items.length>LIMITS.maxItems)state.items.pop();save(state);renderList()}document.getElementById('enc').addEventListener('click',()=>{const txt=document.getElementById('input').value;addItem(btoa(txt))});document.getElementById('dec').addEventListener('click',()=>{const txt=document.getElementById('input').value;try{addItem(atob(txt))}catch(e){alert('Invalid Base64')}});document.getElementById('urlEnc').addEventListener('click',()=>{const txt=document.getElementById('input').value;addItem(encodeURIComponent(txt))});document.getElementById('urlDec').addEventListener('click',()=>{const txt=document.getElementById('input').value;try{addItem(decodeURIComponent(txt))}catch(e){alert('Invalid URL encoding')}});if(LIMITS.export){const exp=document.createElement('button');exp.textContent='Export';exp.id='export';document.querySelector('section:last-of-type').appendChild(exp);exp.addEventListener('click',()=>{const data=JSON.stringify(state.items);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='b64buddy.json';a.click()});const imp=document.createElement('button');imp.textContent='Import';imp.id='import';document.querySelector('section:last-of-type').appendChild(imp);imp.addEventListener('click',()=>{const inp=document.createElement('input');inp.type='file';inp.accept='application/json';inp.onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=ev=>{try{state.items=JSON.parse(ev.target.result);save(state);renderList()}catch{alert('Invalid file')}};r.readAsText(file)};inp.click()});}renderList();</script></body></html>
