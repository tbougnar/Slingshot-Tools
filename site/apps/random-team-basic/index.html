<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>TeamShuffler</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.5rem;cursor:pointer;margin:.2rem}button:focus{outline:2px solid #14100F}input,select{padding:.4rem;border:1px solid #C1272D;border-radius:.4rem;width:100%;margin:.2rem 0}section{background:#fff;border-radius:.8rem;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:1rem;margin:.5rem 0}#list{list-style:none;padding:0}#list li{padding:.5rem 0;border-bottom:1px solid #eee}#empty{color:#777;text-align:center;margin-top:2rem}#themeToggle{position:fixed;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>TeamShuffler</h1></header><button id="themeToggle">Toggle Theme</button><main><section><h2>Create Teams</h2><form id="addForm"><label for="name">Participant name</label><input id="name" type="text" required><button type="submit">Add</button></form></section><section><h2>Teams</h2><ul id="list"></ul><p id="empty">Add participants to start building teams.</p></section><section id="exportSection" style="display:none"><h2>Data</h2><button id="exportBtn">Export JSON</button><input id="importFile" type="file" accept="application/json"><button id="importBtn">Import JSON</button></section></main><footer>© 2026 TeamShuffler</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export};const K='teamshuffler.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{items:[]}}catch(e){return {items:[]}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let state=load();function render(){const ul=document.getElementById('list');ul.innerHTML='';state.items.forEach((it,i)=>{const li=document.createElement('li');li.textContent=it;const rm=document.createElement('button');rm.textContent='Remove';rm.addEventListener('click',()=>{removeItem(i)});li.appendChild(rm);ul.appendChild(li);});document.getElementById('empty').style.display=state.items.length?"none":"block";document.getElementById('exportSection').style.display=TIER==='full'&&LIMITS.export?"block":"none";}function addItem(e){e.preventDefault();const name=document.getElementById('name').value.trim();if(!name)return;if(state.items.length>=LIM.max){alert('Limit reached');return;}state.items.push(name);save(state);document.getElementById('name').value='';render();}function removeItem(idx){state.items.splice(idx,1);save(state);render();}function exportData(){const data=JSON.stringify(state,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='teamshuffler.json';a.click();URL.revokeObjectURL(url);}function importData(){const file=document.getElementById('importFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{state=JSON.parse(e.target.result);save(state);render();}catch{alert('Invalid file');}};reader.readAsText(file);}function toggleTheme(){const cur=document.documentElement.dataset.theme||'light';const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);}function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved;}else{document.documentElement.dataset.theme='light';}}document.getElementById('addForm').addEventListener('submit',addItem);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',importData);document.getElementById('themeToggle').addEventListener('click',toggleTheme);initTheme();render();</script></body></html>
