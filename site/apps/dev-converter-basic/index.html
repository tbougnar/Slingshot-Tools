<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ByteForge – Developer Unit Converter</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header h1{margin:0;font-size:1.5rem}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem}section{background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1);padding:1rem}label{display:block;margin-bottom:.5rem;font-weight:bold}input,select,button{width:100%;padding:.5rem;margin-bottom:.5rem;border:1px solid #ccc;border-radius:4px}button{background:#C1272D;color:#F6EFEC;border:none;cursor:pointer}button:disabled{background:#aaa;cursor:not-allowed}#themeToggle{width:auto;display:inline-block;margin-top:.5rem}pre{background:#eee;padding:.5rem;border-radius:4px;overflow:auto}</style></head><body><header><h1>ByteForge</h1></header><main><section id="converter"><h2>Convert</h2><form id="convertForm"><label for="value">Value</label><input type="number" id="value" required><label for="fromUnit">From</label><select id="fromUnit"><option value="bytes">Bytes</option><option value="bits">Bits</option><option value="kb">Kilobytes</option><option value="mb">Megabytes</option></select><label for="toUnit">To</label><select id="toUnit"><option value="bytes">Bytes</option><option value="bits">Bits</option><option value="kb">Kilobytes</option><option value="mb">Megabytes</option></select><button type="submit" id="convertBtn">Convert</button></form><p id="result"></p></section><section id="historySection" style="display:none;"><h2>History</h2><ul id="historyList"></ul><button id="clearHistoryBtn">Clear History</button></section><section id="dataSection" style="display:none;"><h2>Data</h2><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section><section id="emptyState"><p>Enter a value and select units to start converting.</p></section></main><footer><button id="themeToggle">Toggle Light/Dark</button></footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,history:BASIC_LIMITS.history};const K='byteforge.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{items:[],theme:'light'};}catch(e){return {items:[],theme:'light'};}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let state=load();document.documentElement.dataset.theme=state.theme||'light';function applyTheme(){if(document.documentElement.dataset.theme==='dark'){document.documentElement.style.setProperty('--bg','#14100F');document.documentElement.style.setProperty('--fg','#F6EFEC');document.documentElement.style.setProperty('--accent','#C1272D');}else{document.documentElement.style.setProperty('--bg','#F6EFEC');document.documentElement.style.setProperty('--fg','#14100F');document.documentElement.style.setProperty('--accent','#C1272D');}}applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';state.theme=document.documentElement.dataset.theme;save(state);applyTheme();});function convert(){const val=parseFloat(document.getElementById('value').value);if(isNaN(val)){return;}const from=document.getElementById('fromUnit').value;const to=document.getElementById('toUnit').value;const bytes=toBytes(val,from);const result=fromBytes(bytes,to);document.getElementById('result').textContent=`${val} ${from} = ${result} ${to}`;addHistory({val,from,to,result});}function toBytes(v,u){switch(u){case'bytes':return v;case'bits':return v/8;case'kb':return v*1024;case'mb':return v*1024*1024;default:return v;}}function fromBytes(v,u){switch(u){case'bytes':return v;case'bits':return v*8;case'kb':return v/1024;case'mb':return v/(1024*1024);default:return v;}}function addHistory(entry){if(!LIM.history){return;}if(state.items.length>=LIM.max){state.items.shift();}state.items.push(entry);save(state);renderHistory();}function renderHistory(){document.getElementById('dataSection').style.display=LIM.export?'block':'none';if(!LIM.history){document.getElementById('historySection').style.display='none';return;}if(state.items.length===0){document.getElementById('historySection').style.display='none';return;}const ul=document.getElementById('historyList');ul.innerHTML='';state.items.slice().reverse().forEach(e=>{const li=document.createElement('li');li.textContent=`${e.val} ${e.from} → ${e.result} ${e.to}`;ul.appendChild(li);});document.getElementById('historySection').style.display='block';}function clearHistory(){state.items=[];save(state);renderHistory();}function exportData(){if(!LIM.export){alert('Export not available in basic edition');return;}const data=JSON.stringify(state.items,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='byteforge-data.json';a.click();URL.revokeObjectURL(url);}function importData(e){if(!LIM.export){alert('Import not available in basic edition');return;}const file=e.target.files[0];if(!file){return;}const reader=new FileReader();reader.onload=()=>{try{const arr=JSON.parse(reader.result);if(Array.isArray(arr)){state.items=arr.slice(0,LIM.max);save(state);renderHistory();}else{alert('Invalid data');}}catch{alert('Failed to parse file');}};reader.readAsText(file);}document.getElementById('convertForm').addEventListener('submit',e=>{e.preventDefault();convert();});document.getElementById('clearHistoryBtn').addEventListener('click',clearHistory);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);renderHistory();if(state.items.length===0){document.getElementById('emptyState').style.display='block';}else{document.getElementById('emptyState').style.display='none';}</script></body></html>
