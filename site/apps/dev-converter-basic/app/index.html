<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ByteForge – Developer Unit Converter</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}main{flex:1;padding:1rem;max-width:800px;margin:auto}h1{margin:0;font-size:1.8rem}section{background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1);padding:1rem;margin-top:1rem}label{display:block;margin-top:.5rem}input,select,button{margin-top:.3rem;padding:.5rem;border:1px solid #ccc;border-radius:4px;width:100%}button{background:#C1272D;color:#F6EFEC;border:none;cursor:pointer}button:disabled{background:#aaa;cursor:not-allowed}#items{margin-top:1rem} .item{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem} .item input{flex:1} .item button{flex:0 0 auto;width:auto}#empty{color:#777;text-align:center;margin-top:2rem}#themeToggle{position:fixed;top:1rem;right:1rem;background:#14100F;color:#F6EFEC;padding:.3rem .6rem;border-radius:4px;cursor:pointer}</style></head><body><header><h1>ByteForge</h1><p>Developer unit converter for bytes, bits and encodings</p></header><div id="themeToggle">Toggle Theme</div><main><section><form id="addForm"><label for="value">Value</label><input id="value" type="number" min="0" required><label for="unit">Unit</label><select id="unit"><option value="B">Bytes (B)</option><option value="KB">Kilobytes (KB)</option><option value="MB">Megabytes (MB)</option><option value="GB">Gigabytes (GB)</option><option value="b">Bits (b)</option></select><button type="submit" id="addBtn">Add</button></form><div id="empty">Enter a value and press Add to start converting.</div><div id="items"></div></section><section id="exportSection" style="display:none"><button id="exportBtn">Export My Data</button><input id="importFile" type="file" accept="application/json"><button id="importBtn">Import My Data</button></section></main><footer>© 2026 ByteForge</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K="byteforge.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let data=load();function render(){const container=document.getElementById('items');container.innerHTML='';if(data.length===0){document.getElementById('empty').style.display='block';}else{document.getElementById('empty').style.display='none';data.forEach((it,i)=>{const div=document.createElement('div');div.className='item';div.innerHTML=`<input type="text" value="${it.input}" readonly><input type="text" value="${it.result}" readonly><button data-idx="${i}">✕</button>`;container.appendChild(div);});}document.getElementById('exportSection').style.display=LIMITS.export?"block":"none";}function addItem(e){e.preventDefault();const val=document.getElementById('value').value;const unit=document.getElementById('unit').value;if(val===''||isNaN(val))return;if(data.length>=LIMITS.maxItems){alert('Item limit reached');return;}const bytes=toBytes(parseFloat(val),unit);const result=`${bytes} B`;data.push({input:`${val} ${unit}`,result});save(data);render();document.getElementById('addForm').reset();}function deleteItem(e){if(e.target.tagName!=='BUTTON')return;const idx=e.target.dataset.idx;data.splice(idx,1);save(data);render();}function toBytes(num,unit){switch(unit){case'KB':return num*1024;case'MB':return num*1024*1024;case'GB':return num*1024*1024*1024;case'b':return num/8;default:return num;}}function exportData(){const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='byteforge.json';a.click();URL.revokeObjectURL(url);}function importData(){const file=document.getElementById('importFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const arr=JSON.parse(e.target.result);if(Array.isArray(arr)){data=arr;save(data);render();}}catch(err){alert('Invalid file');}};reader.readAsText(file);}function toggleTheme(){const cur=document.documentElement.dataset.theme||'light';const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);}function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved;}else{document.documentElement.dataset.theme='light';}}document.getElementById('addForm').addEventListener('submit',addItem);document.getElementById('items').addEventListener('click',deleteItem);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',importData);document.getElementById('themeToggle').addEventListener('click',toggleTheme);initTheme();render();</script></body></html>
