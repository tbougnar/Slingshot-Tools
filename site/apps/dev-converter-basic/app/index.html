<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ByteForge – Developer Unit Converter</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}main{flex:1;padding:1rem;max-width:800px;margin:auto}h1{margin:0;font-size:1.8rem}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.4rem;cursor:pointer}button:focus{outline:2px solid #14100F}input,select{padding:.4rem;border:1px solid #C1272D;border-radius:.4rem;width:100%}label{display:block;margin-top:.8rem}section{background:#fff;border-radius:.6rem;padding:1rem;margin-top:1rem;box-shadow:0 2px 5px rgba(0,0,0,.1)}#empty{text-align:center;color:#555}#themeToggle{position:fixed;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>ByteForge</h1></header><button id="themeToggle">Toggle Theme</button><main><section id="converter"><h2>Unit Converter</h2><form id="convForm"><label for="value">Value</label><input id="value" type="number" step="any" required><label for="fromUnit">From</label><select id="fromUnit"><option value="bytes">Bytes</option><option value="bits">Bits</option><option value="kb">Kilobytes</option><option value="mb">Megabytes</option></select><label for="toUnit">To</label><select id="toUnit"><option value="bytes">Bytes</option><option value="bits">Bits</option><option value="kb">Kilobytes</option><option value="mb">Megabytes</option></select><button type="submit" id="convertBtn">Convert</button></form><p id="result"></p></section><section id="historySection"><h2>History</h2><ul id="historyList"></ul></section><section id="dataSection"><h2>Data</h2><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section><p id="empty">Add your first conversion to get started.</p></main><footer>© 2026 ByteForge</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const activeLimits=TIER==="basic"?BASIC_LIMITS:LIMITS;const STORAGE_KEY="byteforge.v1";const load=()=>{try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{history:[]} }catch(e){return{history:[]}}};const save=data=>localStorage.setItem(STORAGE_KEY,JSON.stringify(data));function initTheme(){const saved=localStorage.getItem("theme");if(saved){document.documentElement.dataset.theme=saved}else{document.documentElement.dataset.theme="light"}}initTheme();document.getElementById('themeToggle').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme;const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next)});function convert(v,from,to){const map={bytes:1,bits:1/8,kb:1024,mb:1048576};return v*map[from]/map[to]}function renderResult(txt){document.getElementById('result').textContent=txt}function addHistory(item){const data=load();if(activeLimits.maxItems&&data.history.length>=activeLimits.maxItems){data.history.shift()}data.history.push(item);save(data);renderHistory()}function renderHistory(){const list=document.getElementById('historyList');list.innerHTML='';const data=load();if(data.history.length===0){document.getElementById('empty').style.display='block'}else{document.getElementById('empty').style.display='none'}data.history.slice().reverse().forEach(i=>{const li=document.createElement('li');li.textContent=`${i.value} ${i.from} → ${i.result} ${i.to}`;list.appendChild(li)})}function handleConvert(e){e.preventDefault();const val=parseFloat(document.getElementById('value').value);const from=document.getElementById('fromUnit').value;const to=document.getElementById('toUnit').value;if(isNaN(val)){renderResult('Enter a valid number');return}const res=convert(val,from,to);renderResult(res+' '+to);addHistory({value:val,from,to,result:res})}document.getElementById('convForm').addEventListener('submit',handleConvert);function handleExport(){if(!activeLimits.export){alert('Export not available in basic edition');return}const data=load();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='byteforge-data.json';a.click();URL.revokeObjectURL(url)}document.getElementById('exportBtn').addEventListener('click',handleExport);function handleImport(){document.getElementById('importFile').click()}document.getElementById('importBtn').addEventListener('click',handleImport);document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const obj=JSON.parse(ev.target.result);save(obj);renderHistory()}catch{alert('Invalid file')} };reader.readAsText(file)});renderHistory();</script></body></html>
