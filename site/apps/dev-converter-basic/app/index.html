<!DOCTYPE html><html lang=\\"en\\" data-theme=\\"light\\"><head><meta charset=\\"UTF-8\\"><meta name=\\"viewport\\" content=\\"width=device-width,initial-scale=1\\"><title>ByteForge – Developer Unit Converter</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem}section{background:#fff;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:1rem}label{display:block;margin-bottom:.5rem}input,select,button{width:100%;padding:.5rem;margin-bottom:.5rem;border:1px solid #ccc;border-radius:.3rem}button{background:#C1272D;color:#F6EFEC;border:none;cursor:pointer}button:disabled{background:#aaa;cursor:not-allowed}#themeToggle{width:auto;display:inline-block;margin-top:.5rem}pre{background:#eee;padding:.5rem;overflow:auto}</style></head><body><header>ByteForge – Developer Unit Converter</header><main><section id=\\"converter\\"><h2>Convert</h2><form id=\\"convertForm\\"><label for=\\"inputValue\\">Value</label><input type=\\"number\\" id=\\"inputValue\\" required><label for=\\"inputUnit\\">From</label><select id=\\"inputUnit\\"><option value=\\"B\\">Bytes (B)</option><option value=\\"KB\\">Kilobytes (KB)</option><option value=\\"MB\\">Megabytes (MB)</option><option value=\\"GB\\">Gigabytes (GB)</option><option value=\\"b\\">Bits (b)</option></select><label for=\\"outputUnit\\">To</label><select id=\\"outputUnit\\"><option value=\\"B\\">Bytes (B)</option><option value=\\"KB\\">Kilobytes (KB)</option><option value=\\"MB\\">Megabytes (MB)</option><option value=\\"GB\\">Gigabytes (GB)</option><option value=\\"b\\">Bits (b)</option></select><button type=\\"submit\\" id=\\"convertBtn\\">Convert</button></form><p id=\\"result\\"></p></section><section id=\\"historySection\\"><h2>History</h2><pre id=\\"historyLog\\"></pre></section><section id=\\"dataSection\\"><h2>Data</h2><button id=\\"exportBtn\\">Export My Data</button><input type=\\"file\\" id=\\"importInput\\" accept=\\"application/json\\"><button id=\\"importBtn\\">Import My Data</button></section></main><footer><button id=\\"themeToggle\\">Toggle Theme</button></footer><script>const TIER=\\"full\\";const BASIC_LIMITS={maxItems:3,export:false,themes:\\"one\\",bulk:false,history:false};const LIMITS=TIER===\\"basic\\"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:\\"all\\",bulk:true,history:true};const K=\\"byteforge.v1\\";const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{items:[],theme:\\"light\\"}}catch{ return {items:[],theme:\\"light\\"}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let state=load();document.documentElement.dataset.theme=state.theme;function applyTheme(){document.documentElement.dataset.theme=state.theme;localStorage.setItem(\\"theme\\",state.theme)}document.getElementById(\\"themeToggle\\").addEventListener(\\"click\\",()=>{state.theme=state.theme===\\"light\\"?\\"dark\\":\\"light\\";applyTheme()});function toBytes(val,unit){switch(unit){case\\"B\\":return val;case\\"KB\\":return val*1024;case\\"MB\\":return val*1024*1024;case\\"GB\\":return val*1024*1024*1024;case\\"b\\":return val/8}}function fromBytes(val,unit){switch(unit){case\\"B\\":return val;case\\"KB\\":return val/1024;case\\"MB\\":return val/1048576;case\\"GB\\":return val/1073741824;case\\"b\\":return val*8}}function renderResult(txt){document.getElementById(\\"result\\").textContent=txt}function renderHistory(){if(!LIMITS.history){document.getElementById(\\"historySection\\").style.display=\\"none\\";return}const log=document.getElementById(\\"historyLog\\");log.textContent=state.items.map(i=>\\`\${i.input}\\`+\\` → \\${i.output}\\`).join(\\"\
\\")}function addHistory(entry){if(!LIMITS.history)return;state.items.push(entry);if(state.items.length>LIMITS.maxItems)state.items.shift();save(state);renderHistory()}document.getElementById(\\"convertForm\\").addEventListener(\\"submit\\",e=>{e.preventDefault();const val=parseFloat(document.getElementById(\\"inputValue\\").value);const from=document.getElementById(\\"inputUnit\\").value;const to=document.getElementById(\\"outputUnit\\\`).value;if(isNaN(val)){renderResult(\\"Enter a number\\");return}const bytes=toBytes(val,from);const result=fromBytes(bytes,to);renderResult(\\`\\${val} \\${from} = \\${result} \\${to}\\`);addHistory({input:\\`${val} ${from}\\`,output:\\`${result} ${to}\\`});});document.getElementById(\\"exportBtn\\").addEventListener(\\"click\\",()=>{if(!LIMITS.export){alert(\\"Export not available in basic edition\\");return}const data=JSON.stringify(state.items,null,2);const blob=new Blob([data],{type:\\"application/json\\"});const url=URL.createObjectURL(blob);const a=document.createElement(\\"a\\");a.href=url;a.download=\\"byteforge-data.json\\";a.click();URL.revokeObjectURL(url);});document.getElementById(\\"importBtn\\").addEventListener(\\"click\\",()=>{document.getElementById(\\"importInput\\").click();});document.getElementById(\\"importInput\\").addEventListener(\\"change\\",e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const arr=JSON.parse(ev.target.result);if(Array.isArray(arr)){state.items=arr;save(state);renderHistory();}else{alert(\\"Invalid data\\")} }catch{alert(\\"Failed to parse JSON\\")} };reader.readAsText(file);});renderHistory();</script></body></html>
