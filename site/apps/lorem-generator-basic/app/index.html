<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Lorumix – Placeholder Text Generator</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem}#controls{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}button,select,input{padding:.5rem;border:none;border-radius:.4rem;background:#C1272D;color:#F6EFEC;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}#list{display:grid;gap:.5rem} .card{background:#fff;padding:.8rem;border-radius:.6rem;box-shadow:0 2px 4px rgba(0,0,0,.1)} .card textarea{width:100%;border:none;background:transparent;color:inherit;resize:none}#empty{color:#777;font-style:italic}#themeToggle{margin-left:auto;background:#14100F}</style></head><body><header>Lorumix – Placeholder Text Generator</header><main><div id="controls"><label for="count">Paragraphs:</label><input type="number" id="count" min="1" value="1" style="width:4rem"><button id="genBtn">Generate</button><button id="clearBtn">Clear All</button><button id="exportBtn">Export</button><button id="importBtn">Import</button><button id="themeToggle">Toggle Theme</button></div><div id="list"></div><div id="empty">Enter a number and click Generate to create placeholder text.</div></main><footer>© 2026 Lorumix</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true,themeAll:true,bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themeAll:false,bulk:false,history:false};const K='lorumix.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));function applyTheme(){let t=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=t;document.body.style.background=t==='dark'?'#14100F':'#F6EFEC';document.body.style.color=t==='dark'?'#F6EFEC':'#14100F';}applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{let t=document.documentElement.dataset.theme==='dark'?'light':'dark';localStorage.setItem('theme',t);applyTheme();});function render(){const list=document.getElementById('list');list.innerHTML='';const items=load();if(items.length===0){document.getElementById('empty').style.display='block';}else{document.getElementById('empty').style.display='none';items.forEach((txt,i)=>{const div=document.createElement('div');div.className='card';const ta=document.createElement('textarea');ta.rows=3;ta.readOnly=true;ta.textContent=txt;div.appendChild(ta);list.appendChild(div);});} }render();document.getElementById('genBtn').addEventListener('click',()=>{const count=document.getElementById('count').valueAsNumber||1;let items=load();if(items.length+count> LIM.max){alert('Limit reached. Upgrade for more.');return;}for(let i=0;i<count;i++){items.push(lorem());}save(items);render();});document.getElementById('clearBtn').addEventListener('click',()=>{localStorage.removeItem(K);render();});document.getElementById('exportBtn').addEventListener('click',()=>{if(!LIM.export){alert('Export unavailable in basic edition.');return;}const data=JSON.stringify(load(),null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lorumix-data.json';a.click();});document.getElementById('importBtn').addEventListener('click',()=>{if(!LIM.bulk){alert('Import unavailable in basic edition.');return;}const input=document.createElement('input');input.type='file';input.accept='application/json';input.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const arr=JSON.parse(ev.target.result);if(Array.isArray(arr)){save(arr);render();}}catch{alert('Invalid file');}};reader.readAsText(file);};input.click();});function lorem(){const words="lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua".split(' ');let len=5+Math.floor(Math.random()*15);let txt='';for(let i=0;i<len;i++){txt+=words[Math.floor(Math.random()*words.length)]+' ';}return txt.trim();}</script></body></html>
