<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FitCalc – Fitness Calculator</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center;font-size:1.5rem}footer{margin-top:auto;background:#C1272D;color:#F6EFEC;padding:0.5rem;text-align:center;font-size:0.9rem}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem;max-width:600px;margin:auto} .card{background:#fff;border-radius:0.5rem;box-shadow:0 2px 6px rgba(0,0,0,0.1);padding:1rem} .card h2{margin-top:0} .input-group{display:flex;gap:0.5rem;align-items:center;margin-bottom:0.5rem} .input-group label{flex:1} .input-group input{flex:2;padding:0.4rem;border:1px solid #ccc;border-radius:0.3rem} button{background:#C1272D;color:#F6EFEC;border:none;padding:0.5rem 1rem;border-radius:0.3rem;cursor:pointer} button:disabled{opacity:0.5;cursor:not-allowed} .toggle{position:fixed;top:1rem;right:1rem;background:#14100F} .empty{text-align:center;color:#777;font-style:italic}</style></head><body><header>FitCalc – Fitness Calculator</header><button id="themeToggle" class="toggle">Toggle Theme</button><main><div id="emptyState" class="card empty">Add your first entry: weight and height, then click Calculate.</div><div id="list" class="card" style="display:none"><h2>Entries</h2><ul id="entries"></ul></div><div class="card"><h2>New Entry</h2><form id="entryForm"><div class="input-group"><label for="weight">Weight</label><input id="weight" type="number" step="any" required placeholder="kg or lbs"></div><div class="input-group"><label for="height">Height</label><input id="height" type="number" step="any" required placeholder="cm or in"></div><div class="input-group"><label for="system">Units</label><select id="system"><option value="metric">Metric (kg, cm)</option><option value="imperial">Imperial (lbs, in)</option></select></div><button type="submit">Calculate BMI</button></form></div><div id="exportImport" class="card" style="display:none"><button id="exportBtn">Export My Data</button><input id="importFile" type="file" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></div></main><footer>FitCalc © 2026</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true,themeAll:true,bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themeAll:false,bulk:false,history:false};const K='fitcalc.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[] }catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));const applyTheme=()=>{let theme=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=theme;document.body.style.background=theme==='dark'?'#14100F':'#F6EFEC';document.body.style.color=theme==='dark'?'#F6EFEC':'#14100F'};applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{let newTheme=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=newTheme;localStorage.setItem('theme',newTheme);applyTheme();});let entries=load();const render=()=>{const list=document.getElementById('list');const ul=document.getElementById('entries');ul.innerHTML='';if(entries.length===0){list.style.display='none';document.getElementById('emptyState').style.display='block';}else{list.style.display='block';document.getElementById('emptyState').style.display='none';entries.forEach((e,i)=>{const li=document.createElement('li');li.textContent=`#${i+1}: ${e.weight}${e.system==='metric'?'kg':'lbs'} / ${e.height}${e.system==='metric'?'cm':'in'} – BMI: ${e.bmi.toFixed(2)}`;ul.appendChild(li);});}if(LIM.export){document.getElementById('exportImport').style.display='block';}else{document.getElementById('exportImport').style.display='none';}};render();document.getElementById('entryForm').addEventListener('submit',e=>{e.preventDefault();if(entries.length>=LIM.max){alert('Maximum items reached. Upgrade for unlimited entries.');return;}const w=parseFloat(document.getElementById('weight').value);const h=parseFloat(document.getElementById('height').value);const sys=document.getElementById('system').value;let bmi;if(sys==='metric'){bmi=w/((h/100)**2);}else{bmi=(w/(h*h))*703;}entries.push({weight:w,height:h,system:sys,bmi});save(entries);render();e.target.reset();});document.getElementById('exportBtn').addEventListener('click',()=>{if(!LIM.export){alert('Export not available in basic edition.');return;}const data=JSON.stringify(entries,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fitcalc-data.json';a.click();URL.revokeObjectURL(url);});document.getElementById('importBtn').addEventListener('click',()=>{document.getElementById('importFile').click();});document.getElementById('importFile').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const imported=JSON.parse(ev.target.result);if(Array.isArray(imported)){entries=imported;save(entries);render();}else{alert('Invalid data file.');}}catch{alert('Failed to parse file.');}};reader.readAsText(file);});</script></body></html>
