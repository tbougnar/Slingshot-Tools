<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FitCalc – Fitness Calculator</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center;font-size:1.5rem}footer{margin-top:auto;background:#C1272D;color:#F6EFEC;padding:0.5rem;text-align:center;font-size:0.9rem}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem;max-width:600px;margin:auto} .card{background:#fff;border-radius:0.5rem;box-shadow:0 2px 5px rgba(0,0,0,0.1);padding:1rem} .card h2{margin-top:0} input,select,button{width:100%;padding:0.5rem;margin-top:0.5rem;border:1px solid #ccc;border-radius:0.3rem} button{background:#C1272D;color:#F6EFEC;border:none;cursor:pointer} button:disabled{background:#aaa;cursor:not-allowed} .toggle{position:absolute;top:1rem;right:1rem;background:#14100F;color:#F6EFEC;padding:0.3rem 0.6rem;border-radius:0.3rem;cursor:pointer}</style></head><body><header>FitCalc <span class="toggle" id="themeToggle">Dark</span></header><main><div class="card" id="inputCard"><h2>Calculate BMI</h2><form id="bmiForm"><label for="weight">Weight</label><input type="number" id="weight" required placeholder="kg or lbs"><label for="height">Height</label><input type="number" id="height" required placeholder="cm or in"><label for="unit">Units</label><select id="unit"><option value="metric">Metric (kg, cm)</option><option value="imperial">Imperial (lbs, in)</option></select><button type="submit" id="calcBtn">Calculate</button></form></div><div class="card" id="resultCard" style="display:none;"><h2>Your BMI</h2><p id="bmiResult"></p><button id="resetBtn">New Calculation</button></div><div class="card" id="historyCard" style="display:none;"><h2>History</h2><ul id="historyList"></ul><button id="clearHistoryBtn">Clear History</button></div><div class="card" id="exportCard" style="display:none;"><h2>Export / Import</h2><button id="exportBtn">Export Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import Data</button></div></main><footer>FitCalc – free basic edition solves a few BMI checks.</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,history:BASIC_LIMITS.history};const K='fitcalc.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{entries:[]} }catch(e){return{entries:[]}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));const applyTheme=()=>{const saved=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=saved;document.getElementById('themeToggle').textContent=saved==='dark'?'Light':'Dark'};document.addEventListener('DOMContentLoaded',()=>{applyTheme();document.getElementById('themeToggle').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme;const nxt=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nxt;localStorage.setItem('theme',nxt);document.getElementById('themeToggle').textContent=nxt==='dark'?'Light':'Dark'});const form=document.getElementById('bmiForm');form.addEventListener('submit',e=>{e.preventDefault();calc();});document.getElementById('resetBtn').addEventListener('click',reset);document.getElementById('clearHistoryBtn').addEventListener('click',clearHistory);if(LIM.export){document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);}renderHistory();});function calc(){const w=parseFloat(document.getElementById('weight').value);const h=parseFloat(document.getElementById('height').value);const unit=document.getElementById('unit').value;if(isNaN(w)||isNaN(h)||w<=0||h<=0){alert('Enter valid numbers');return}let bmi;if(unit==='metric'){bmi=w/((h/100)**2)}else{bmi=703*w/(h**2)}bmi=bmi.toFixed(1);document.getElementById('bmiResult').textContent=bmi;document.getElementById('inputCard').style.display='none';document.getElementById('resultCard').style.display='block';addEntry({weight:w,height:h,unit,bmi});}function reset(){document.getElementById('bmiForm').reset();document.getElementById('resultCard').style.display='none';document.getElementById('inputCard').style.display='block';}function addEntry(e){const data=load();if(data.entries.length>=LIM.max){alert('Basic edition limit reached');return}data.entries.push(e);save(data);if(LIM.history)renderHistory();}function renderHistory(){if(!LIM.history)return;const list=document.getElementById('historyList');list.innerHTML='';const data=load();data.entries.slice().reverse().forEach((e,i)=>{const li=document.createElement('li');li.textContent=`${e.bmi} ( ${e.unit==='metric'?'kg':'lbs'} / ${e.unit==='metric'?'cm':'in'} )`;list.appendChild(li);});document.getElementById('historyCard').style.display=data.entries.length? 'block':'none';}function clearHistory(){if(!confirm('Clear all history?'))return;save({entries:[]});renderHistory();}function exportData(){const data=load();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='fitcalc-data.json';a.click();URL.revokeObjectURL(url);}function importData(e){const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const obj=JSON.parse(ev.target.result);if(Array.isArray(obj.entries)){save({entries:obj.entries});renderHistory();}else{alert('Invalid file');}}catch{alert('Invalid JSON');};reader.readAsText(file);}</html>
