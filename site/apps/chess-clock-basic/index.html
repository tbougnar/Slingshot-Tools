<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ChronoMate Chess Clock</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center;font-size:1.5rem}footer{margin-top:auto;background:#C1272D;color:#F6EFEC;padding:0.5rem;text-align:center;font-size:0.9rem}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem}button{background:#C1272D;color:#F6EFEC;border:none;padding:0.5rem 1rem;border-radius:0.4rem;cursor:pointer}button:disabled{opacity:0.5;cursor:not-allowed}input,select{padding:0.4rem;border:1px solid #C1272D;border-radius:0.4rem}section{background:#fff;border-radius:0.6rem;box-shadow:0 2px 6px rgba(0,0,0,0.1);padding:1rem}h2{margin-top:0}#history{max-height:150px;overflow:auto;font-size:0.9rem;background:#f9f9f9;padding:0.5rem;border-radius:0.4rem}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}</style></head><body><header>ChronoMate Chess Clock</header><button id="themeToggle">Toggle Theme</button><main><section id="setup"><h2>Setup Players</h2><label for="p1">Player 1 Name</label><input id="p1" type="text" placeholder="White" required><label for="p2">Player 2 Name</label><input id="p2" type="text" placeholder="Black" required><label for="time">Initial Minutes</label><input id="time" type="number" min="1" value="5" required><button id="startBtn">Start Clock</button></section><section id="clock" style="display:none;"><h2 id="turn"></h2><div><span id="p1time"></span> – <span id="p2time"></span></div><button id="switchBtn">Switch Turn</button><button id="resetBtn">Reset</button></section><section id="historySection" style="display:none;"><h2>Move History</h2><div id="history"></div></section><section id="exportImport" style="display:none;"><h2>Data</h2><button id="exportBtn">Export My Data</button><input id="importFile" type="file" accept="application/json"><button id="importBtn">Import My Data</button></section><section id="emptyState"><h2>Welcome!</h2><p>Enter player names and time, then press Start Clock to begin.</p></section></main><footer>© 2026 ChronoMate</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='chronomate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||null}catch{return null}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let state={players:['',''],time:300,active:0,remaining:[0,0],history:[]};function init(){const saved=load();if(saved){state=saved}applyTheme();document.getElementById('themeToggle').addEventListener('click',toggleTheme);document.getElementById('startBtn').addEventListener('click',start);document.getElementById('switchBtn').addEventListener('click',switchTurn);document.getElementById('resetBtn').addEventListener('click',reset);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',importData);render();}function applyTheme(){const saved=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=saved;document.body.setAttribute('data-theme',saved);}function toggleTheme(){const cur=document.documentElement.dataset.theme;const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);}function start(e){e.preventDefault();const p1=document.getElementById('p1').value.trim()||'White';const p2=document.getElementById('p2').value.trim()||'Black';const mins=parseInt(document.getElementById('time').value,10)||5;state.players=[p1,p2];state.time=mins*60;state.remaining=[state.time,state.time];state.active=0;state.history=[];save(state);render();}function switchTurn(){state.history.push({player:state.players[state.active],time:state.time-state.remaining[state.active]});state.active=1-state.active;save(state);render();}function reset(){if(confirm('Reset the clock?')){state={players:['',''],time:300,active:0,remaining:[0,0],history:[]};save(state);render();}}function exportData(){if(!LIM.export){alert('Export not available in basic edition');return}const data=JSON.stringify(state,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='chronomate.json';a.click();URL.revokeObjectURL(url);}function importData(){const file=document.getElementById('importFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{state=JSON.parse(e.target.result);save(state);render();}catch{alert('Invalid file');}};reader.readAsText(file);}function format(t){const m=Math.floor(t/60);const s=t%60;return m+':'+(s<10?'0':'')+s;}function render(){document.getElementById('setup').style.display=state.players[0]?"none":"block";document.getElementById('clock').style.display=state.players[0]?"block":"none";document.getElementById('historySection').style.display=(LIM.history&&state.history.length)?"block":"none";document.getElementById('exportImport').style.display=LIM.export?"block":"none";document.getElementById('emptyState').style.display=state.players[0]?"none":"block";if(state.players[0]){document.getElementById('turn').textContent=state.players[state.active]+"'s turn";document.getElementById('p1time').textContent=state.players[0]+": "+format(state.remaining[0]);document.getElementById('p2time').textContent=state.players[1]+": "+format(state.remaining[1]);if(LIM.history){const hist=document.getElementById('history');hist.innerHTML='';state.history.forEach((h,i)=>{const div=document.createElement('div');div.textContent=i+1+'. '+h.player+" used "+format(h.time)+' sec';hist.appendChild(div);});}}}init();</script></body></html>
