<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UnitMate – Unit Converter</title><style>body{font-family:sans-serif;margin:0;padding:0;background:#F6EFEC;color:#14100F;display:flex;flex-direction:column;min-height:100vh;transition:background .3s,color .3s}html[data-theme='dark']{background:#14100F;color:#F6EFEC}header,footer{padding:1rem;background:#C1272D;color:#F6EFEC;text-align:center}header{font-size:1.5rem}main{flex:1;padding:1rem;max-width:600px;margin:auto}button,select,input{font:inherit;padding:.5rem;margin:.2rem;border:none;border-radius:.4rem;background:#C1272D;color:#F6EFEC;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input{background:#fff;color:#000}html[data-theme='dark'] input{background:#333;color:#fff}section{background:#fff;color:#000;padding:1rem;border-radius:.6rem;box-shadow:0 2px 6px rgba(0,0,0,.1);margin-bottom:1rem}html[data-theme='dark'] section{background:#222;color:#F6EFEC}#history{max-height:200px;overflow:auto}#history div{border-bottom:1px solid #ddd;padding:.3rem 0}html[data-theme='dark'] #history div{border-color:#444}</style></head><body><header>UnitMate – Unit Converter</header><main><section><label for="value">Value</label><input id="value" type="number" step="any" placeholder="Enter number"><label for="from">From</label><select id="from"><option value="m">Meters</option><option value="ft">Feet</option></select><label for="to">To</label><select id="to"><option value="ft">Feet</option><option value="m">Meters</option></select><button id="convert">Convert</button><p id="result"></p></section><section id="emptyState"><p>Add a conversion to see recent history.</p></section><section id="historySection" style="display:none;"><h3>Recent Conversions</h3><div id="history"></div></section><section id="exportSection" style="display:none;"><button id="exportBtn">Export Data</button><input id="importFile" type="file" accept="application/json" style="display:none"><button id="importBtn">Import Data</button></section><section><button id="themeToggle">Toggle Theme</button></section></main><footer>© 2026 UnitMate</footer><script>const TIER="basic";const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:Infinity,export:true,themes:"all",bulk:true,history:true};const K='unitmate.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[] }catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let data=load();function render(){const hist=document.getElementById('history');hist.innerHTML='';data.slice(-LIMITS.maxItems).reverse().forEach(d=>{const div=document.createElement('div');div.textContent=`${d.value} ${d.from} → ${d.result} ${d.to}`;hist.appendChild(div)});document.getElementById('historySection').style.display=data.length?"block":"none";document.getElementById('emptyState').style.display=data.length?"none":"block";document.getElementById('exportSection').style.display=LIMITS.export?"block":"none"}function convert(){const val=parseFloat(document.getElementById('value').value);if(isNaN(val))return;const from=document.getElementById('from').value;const to=document.getElementById('to').value;let result;if(from===to){result=val}else if(from==='m'&&to==='ft'){result=val*3.28084}else if(from==='ft'&&to==='m'){result=val/3.28084}else{result=val}document.getElementById('result').textContent=`Result: ${result.toFixed(4)} ${to}`;data.push({value:val,from,to,result:result.toFixed(4)});if(data.length>LIMITS.maxItems) data=data.slice(-LIMITS.maxItems);save(data);render()}function toggleTheme(){const cur=document.documentElement.dataset.theme;const next=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next)}function exportData(){const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='unitmate-data.json';a.click();URL.revokeObjectURL(url)}function importData(){const file=document.getElementById('importFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const arr=JSON.parse(e.target.result);if(Array.isArray(arr)){data=arr;save(data);render()}}catch{}};reader.readAsText(file)}document.getElementById('convert').addEventListener('click',convert);document.getElementById('themeToggle').addEventListener('click',toggleTheme);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);const savedTheme=localStorage.getItem('theme');if(savedTheme){document.documentElement.dataset.theme=savedTheme}</script></body></html>
