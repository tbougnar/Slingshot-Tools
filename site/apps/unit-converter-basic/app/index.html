<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Convertly – Unit Converter</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header h1{margin:0;font-size:1.5rem}main{flex:1;padding:1rem;max-width:800px;margin:auto}section{background:#fff;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.1);padding:1rem;margin-bottom:1rem}h2{margin-top:0}label{display:block;margin-top:.5rem}input,select,button{width:100%;padding:.5rem;margin-top:.25rem;border:1px solid #ccc;border-radius:4px}button{background:#C1272D;color:#F6EFEC;border:none;cursor:pointer}button:disabled{background:#aaa;cursor:not-allowed}#themeToggle{width:auto;padding:.3rem .6rem;margin-top:0;background:#14100F}pre{background:#eee;padding:.5rem;border-radius:4px;overflow:auto}</style></head><body><header><h1>Convertly</h1></header><main><section id="converter"><h2>Unit Converter</h2><form id="convForm"><label for="value">Value</label><input type="number" id="value" required><label for="fromUnit">From</label><select id="fromUnit"><option value="m">Meters</option><option value="km">Kilometers</option><option value="ft">Feet</option><option value="mi">Miles</option></select><label for="toUnit">To</label><select id="toUnit"><option value="m">Meters</option><option value="km">Kilometers</option><option value="ft">Feet</option><option value="mi">Miles</option></select><button type="submit" id="convertBtn">Convert</button></form><p id="result"></p></section><section id="historySection"><h2>Recent Conversions</h2><div id="historyList"><p class="empty">No conversions yet. Enter a value and press Convert.</p></div></section><section id="exportSection" style="display:none;"><h2>Data Management</h2><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json" style="display:none"><button id="importBtn">Import My Data</button></section><section><button id="themeToggle">Toggle Light/Dark</button></section></main><footer>© 2026 Convertly</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themeAll:true,bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themeAll:false,bulk:false,history:false};const K='convertly.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{history:[]}}catch(e){return{history:[]}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));function initTheme(){let t=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=t;}initTheme();document.getElementById('themeToggle').addEventListener('click',()=>{let t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);});function convert(){const val=parseFloat(document.getElementById('value').value);if(isNaN(val))return;const from=document.getElementById('fromUnit').value;const to=document.getElementById('toUnit').value;const factor={m:1,km:1000,ft:0.3048,mi:1609.34};let result=val*factor[from]/factor[to];result=Number(result.toFixed(6));document.getElementById('result').textContent=`${val} ${from} = ${result} ${to}`;addHistory({val,from,to,result});}document.getElementById('convForm').addEventListener('submit',e=>{e.preventDefault();convert();});function addHistory(entry){let data=load();if(!LIM.history && data.history.length>=LIM.max){return;}data.history.unshift(entry);if(LIM.max && data.history.length>LIM.max){data.history=data.history.slice(0,LIM.max);}save(data);renderHistory();}function renderHistory(){let data=load();let list=document.getElementById('historyList');list.innerHTML='';if(data.history.length===0){list.innerHTML='<p class="empty">No conversions yet. Enter a value and press Convert.</p>';return;}data.history.forEach((h,i)=>{let p=document.createElement('p');p.textContent=`${h.val} ${h.from} → ${h.result} ${h.to}`;list.appendChild(p);});}function exportData(){let data=load();let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='convertly-data.json';a.click();URL.revokeObjectURL(url);}function importData(e){let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(Array.isArray(obj.history)){save({history:obj.history});renderHistory();}}catch(err){} };reader.readAsText(file);}if(LIM.export){document.getElementById('exportSection').style.display='block';document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);}renderHistory();</script></body></html>
