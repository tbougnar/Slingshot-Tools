<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Qrious QR Generator</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header{font-size:1.5rem;font-weight:bold}main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem;max-width:800px;margin:auto}button,select,input{font:inherit;padding:.5rem 1rem;border:1px solid #C1272D;border-radius:.4rem;background:#fff;color:#14100F;cursor:pointer}button:hover,select:hover,input:hover{background:#C1272D;color:#F6EFEC}button:disabled{opacity:.5;cursor:not-allowed}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem} .card{background:#fff;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1);padding:1rem;display:flex;flex-direction:column;gap:.5rem} .card img{max-width:100%;border-radius:.3rem} .empty{text-align:center;color:#555;font-style:italic} .theme-toggle{position:fixed;top:1rem;right:1rem;background:#C1272D;color:#F6EFEC} @media (prefers-color-scheme:dark){html[data-theme="dark"]{background:#14100F;color:#F6EFEC}html[data-theme="dark"] button,html[data-theme="dark"] select,html[data-theme="dark"] input{background:#14100F;color:#F6EFEC;border-color:#C1272D}html[data-theme="dark"] button:hover,html[data-theme="dark"] select:hover,html[data-theme="dark"] input:hover{background:#C1272D}} </style></head><body><header>Qrious QR Generator</header><button class="theme-toggle" id="themeToggle">Toggle Theme</button><main><section id="inputSection"><form id="qrForm"><label for="textInput">Text or URL</label><input type="text" id="textInput" required placeholder="Enter text or URL"><label for="sizeSelect">Size</label><select id="sizeSelect"><option value="128">128px</option><option value="256">256px</option><option value="512">512px</option></select><button type="submit" id="generateBtn">Generate QR</button></form></section><section id="cardsSection"><div id="emptyState" class="empty">Enter text above and click Generate to create your first QR code.</div><div id="cards"></div></section></main><footer>© 2026 Qrious</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='qrgen.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[];}catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let data=load();function render(){const cards=document.getElementById('cards');cards.innerHTML='';if(data.length===0){document.getElementById('emptyState').style.display='block';}else{document.getElementById('emptyState').style.display='none';data.forEach((item,i)=>{const div=document.createElement('div');div.className='card';div.innerHTML=`<img src="${item.src}" alt="QR code"><p>${item.text}</p>`;if(LIM.bulk){const del=document.createElement('button');del.textContent='Delete';del.addEventListener('click',()=>{deleteItem(i)});div.appendChild(del);}cards.appendChild(div);});}}function deleteItem(idx){data.splice(idx,1);save(data);render();}function addItem(text,size){if(data.length>=LIM.max){alert('Item limit reached. Upgrade for more.');return;}const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);const img=new Image();img.onload=()=>{ctx.drawImage(img,0,0,size,size);const src=canvas.toDataURL();data.push({text,src});save(data);render();};img.src='data:image/svg+xml;base64,'+btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"><rect width="${size}" height="${size}" fill="#fff"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="12" fill="#000">QR</text></svg>`);}document.getElementById('qrForm').addEventListener('submit',e=>{e.preventDefault();const txt=document.getElementById('textInput').value.trim();const sz=parseInt(document.getElementById('sizeSelect').value);if(txt){addItem(txt,sz);document.getElementById('textInput').value='';}});function toggleTheme(){const cur=document.documentElement.dataset.theme;const next=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next);}document.getElementById('themeToggle').addEventListener('click',toggleTheme);function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved;}else{const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.dataset.theme=prefersDark?'dark':'light';}}initTheme();if(LIM.export){const exportBtn=document.createElement('button');exportBtn.textContent='Export Data';exportBtn.id='exportBtn';exportBtn.addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='qr-data.json';a.click();URL.revokeObjectURL(url);});document.getElementById('inputSection').appendChild(exportBtn);const importInput=document.createElement('input');importInput.type='file';importInput.accept='application/json';importInput.id='importInput';importInput.style.display='none';importInput.addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{const arr=JSON.parse(ev.target.result);if(Array.isArray(arr)){data=arr;save(data);render();}}catch(err){};};reader.readAsText(file);});const importBtn=document.createElement('button');importBtn.textContent='Import Data';importBtn.id='importBtn';importBtn.addEventListener('click',()=>{document.getElementById('importInput').click();});document.getElementById('inputSection').appendChild(importBtn);document.getElementById('inputSection').appendChild(importInput);}render();</script></body></html>
