<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Pomodoro Pulse</title><style>html{font-family:sans-serif;background:#F6EFEC;color:#14100F}body{margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center;font-size:1.5rem}footer{margin-top:auto;background:#C1272D;color:#F6EFEC;padding:0.5rem;text-align:center;font-size:0.9rem}main{padding:1rem;display:flex;flex-direction:column;gap:1rem}button{background:#C1272D;color:#F6EFEC;border:none;padding:0.5rem 1rem;border-radius:4px;cursor:pointer}button:disabled{opacity:0.5;cursor:not-allowed}input,select{padding:0.4rem;border:1px solid #ccc;border-radius:4px;width:100%}label{margin-bottom:0.2rem;display:block} .card{background:#fff;border-radius:8px;padding:1rem;box-shadow:0 2px 5px rgba(0,0,0,0.1)} .hidden{display:none} .theme-toggle{position:fixed;top:1rem;right:1rem;background:#14100F} @media (prefers-color-scheme:dark){html[data-theme="dark"]{background:#14100F;color:#F6EFEC}html[data-theme="dark"] .card{background:#1e1a1a}html[data-theme="dark"] button{background:#C1272D}html[data-theme="dark"] .theme-toggle{background:#C1272D}}</style></head><body><header>Pomodoro Pulse</header><button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">🌙</button><main><section class="card" id="setupSection"><h2>Start a Session</h2><form id="sessionForm"><label for="focusTime">Focus minutes</label><input type="number" id="focusTime" min="1" value="25" required><label for="breakTime">Break minutes</label><input type="number" id="breakTime" min="1" value="5" required><button type="submit" id="startBtn">Start</button></form></section><section class="card hidden" id="timerSection"><h2 id="phaseTitle">Focus</h2><div id="timeDisplay" style="font-size:2rem;margin:0.5rem 0;">25:00</div><button id="pauseBtn">Pause</button><button id="resetBtn">Reset</button></section><section class="card hidden" id="logSection"><h2>Session Log</h2><ul id="logList"></ul></section><section class="card hidden" id="exportSection"><h2>Data</h2><button id="exportBtn">Export my data</button><input type="file" id="importFile" accept="application/json" class="hidden"><button id="importBtn">Import my data</button></section></main><footer>Focus better, track smarter.</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const LIM=TIER==='full'?{max:Infinity,export:true,themeAll:true,bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themeAll:false,bulk:false,history:false};const K='pomodoroPulse.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{sessions:[]}}catch{return{sessions:[]}}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let timer;let remaining;let phase='focus';function init(){const savedTheme=localStorage.getItem('theme')||'light';document.documentElement.dataset.theme=savedTheme;applyTheme();document.getElementById('themeToggle').addEventListener('click',toggleTheme);document.getElementById('sessionForm').addEventListener('submit',e=>{e.preventDefault();startSession();});document.getElementById('pauseBtn').addEventListener('click',pauseTimer);document.getElementById('resetBtn').addEventListener('click',resetTimer);document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());document.getElementById('importFile').addEventListener('change',importData);renderLog();if(TIER==='basic'){if(!LIM.export){document.getElementById('exportSection').classList.add('hidden');}}}function applyTheme(){const d=document.documentElement;d.dataset.theme=localStorage.getItem('theme')||'light';}function toggleTheme(){const newTheme=document.documentElement.dataset.theme==='light'?'dark':'light';localStorage.setItem('theme',newTheme);applyTheme();}function startSession(){const focus=document.getElementById('focusTime').valueAsNumber;const br=document.getElementById('breakTime').valueAsNumber;remaining=focus*60;updateDisplay();document.getElementById('setupSection').classList.add('hidden');document.getElementById('timerSection').classList.remove('hidden');if(LIM.bulk){document.getElementById('exportSection').classList.remove('hidden');}timer=setInterval(tick,1000);}function tick(){if(remaining<=0){clearInterval(timer);logSession();if(phase==='focus'){phase='break';remaining=document.getElementById('breakTime').valueAsNumber*60;document.getElementById('phaseTitle').textContent='Break';}else{phase='focus';remaining=document.getElementById('focusTime').valueAsNumber*60;document.getElementById('phaseTitle').textContent='Focus';}updateDisplay();timer=setInterval(tick,1000);}else{remaining--;updateDisplay();}}function updateDisplay(){const m=Math.floor(remaining/60).toString().padStart(2,'0');const s=(remaining%60).toString().padStart(2,'0');document.getElementById('timeDisplay').textContent=`${m}:${s}`;}function pauseTimer(){if(timer){clearInterval(timer);timer=null;}else{timer=setInterval(tick,1000);}}function resetTimer(){clearInterval(timer);timer=null;phase='focus';document.getElementById('phaseTitle').textContent='Focus';document.getElementById('setupSection').classList.remove('hidden');document.getElementById('timerSection').classList.add('hidden');}function logSession(){const data=load();if(data.sessions.length>=LIM.max){return;}data.sessions.push({date:new Date().toISOString(),focus:document.getElementById('focusTime').valueAsNumber,break:document.getElementById('breakTime').valueAsNumber});save(data);renderLog();if(LIM.history===false){document.getElementById('logSection').classList.add('hidden');}else{document.getElementById('logSection').classList.remove('hidden');}}function renderLog(){const list=document.getElementById('logList');list.innerHTML='';const data=load();data.sessions.forEach(s=>{const li=document.createElement('li');li.textContent=`${new Date(s.date).toLocaleString()}: ${s.focus}min focus / ${s.break}min break`;list.appendChild(li);});}function exportData(){if(!LIM.export){alert('Export not available in basic edition');return;}const data=load();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pomodoro-pulse-data.json';a.click();URL.revokeObjectURL(url);}function importData(e){const file=e.target.files[0];if(!file){return;}const reader=new FileReader();reader.onload=ev=>{try{const obj=JSON.parse(ev.target.result);save(obj);renderLog();}catch{alert('Invalid file');}};reader.readAsText(file);}init();</script></body></html>
