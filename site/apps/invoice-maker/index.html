<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bill Pay — Make a professional invoice</title>
<style>
:root{--bg:#14100F;--surface:#1E1817;--surface-2:#261E1C;--surface-3:#312725;--text:#F6EFEC;--muted:#B3A6A1;--line:rgba(246,239,236,.10);--line-strong:rgba(246,239,236,.18);--accent:#C1272D;--accent-2:#E23A40;--accent-soft:rgba(193,39,45,.14);--accent-contrast:#fff;--green:#57C785;--amber:#E7B24C;--red:#E26A6A;--shadow:0 14px 34px -16px rgba(0,0,0,.7);--shadow-sm:0 4px 14px -8px rgba(0,0,0,.6);--radius:16px;--radius-sm:11px;--font-body:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--font-display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;--font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
[data-theme="light"]{--bg:#F6EFEC;--surface:#FFFFFF;--surface-2:#FBF6F4;--surface-3:#F1E8E4;--text:#241C1A;--muted:#7C6F6A;--line:rgba(36,28,26,.10);--line-strong:rgba(36,28,26,.20);--accent:#C1272D;--accent-2:#A81E23;--accent-soft:rgba(193,39,45,.10);--accent-contrast:#fff;--green:#1F8A54;--amber:#A9760F;--red:#B23A3A;--shadow:0 14px 34px -18px rgba(60,30,30,.28);--shadow-sm:0 4px 14px -10px rgba(60,30,30,.22)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(1100px 520px at 88% -12%,var(--accent-soft),transparent 60%),radial-gradient(760px 460px at -12% 112%,rgba(193,39,45,.07),transparent 60%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.55;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000,transparent 78%);mask-image:radial-gradient(ellipse at 50% 0%,#000,transparent 78%)}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent-2);outline-offset:2px;border-radius:6px}
button{font-family:inherit}
input,select,textarea{font-family:inherit}

/* header */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px clamp(14px,4vw,34px);background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brand__mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(150deg,var(--accent-2),var(--accent));display:grid;place-items:center;box-shadow:var(--shadow-sm);flex:none}
.brand__mark svg{width:23px;height:23px}
.brand__name{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1}
.brand__sub{font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.topbar__spacer{flex:1}
.topbar__actions{display:flex;align-items:center;gap:9px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;padding:9px 15px;border-radius:11px;border:1px solid transparent;cursor:pointer;transition:transform .12s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}
.btn:active{transform:translateY(1px)}
.btn--primary{background:var(--accent);color:var(--accent-contrast);box-shadow:0 8px 20px -10px var(--accent)}
.btn--primary:hover{background:var(--accent-2);box-shadow:0 12px 26px -10px var(--accent)}
.btn--ghost{background:var(--surface);border-color:var(--line-strong);color:var(--text)}
.btn--ghost:hover{background:var(--surface-2);border-color:var(--muted)}
.btn--subtle{background:transparent;border-color:var(--line);color:var(--muted)}
.btn--subtle:hover{color:var(--text);border-color:var(--line-strong);background:var(--surface-2)}
.btn--icon{padding:9px}
.btn--sm{padding:7px 12px;font-size:13px;border-radius:9px}
.btn--block{width:100%;justify-content:center}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn[disabled]:hover{background:var(--surface);border-color:var(--line-strong)}

/* layout */
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:26px clamp(14px,4vw,34px) 40px;flex:1}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel__head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel__head h2{margin:0;font-family:var(--font-display);font-size:18px;font-weight:700}
.panel__head .hint{font-size:12px;color:var(--muted)}
.panel__body{padding:18px}

/* form */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;letter-spacing:.01em}
.field .row{display:flex;gap:10px}
.field .row>*{flex:1}
.inp{width:100%;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;color:var(--text);font-size:14.5px;transition:border-color .15s,box-shadow .15s,background .15s}
.inp::placeholder{color:var(--muted);opacity:.75}
.inp:hover{border-color:var(--muted)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:var(--surface)}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 19px,calc(100% - 11px) 19px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px;cursor:pointer}
.inp--mono{font-family:var(--font-mono);font-size:13.5px}
.inp--small{padding:8px 10px;font-size:13.5px}
.fieldset{border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px 14px 10px;margin-bottom:16px;background:var(--surface-2)}
.fieldset>legend{padding:0 8px;font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}

/* line items */
.items-head,.item{display:grid;grid-template-columns:1.7fr 62px 1fr 96px 34px;gap:8px;align-items:center}
.items-head{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 2px 8px}
.items-head span:nth-child(2),.items-head span:nth-child(4){text-align:right}
.item{margin-bottom:8px}
.item .del{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.15s}
.item .del:hover{color:var(--red);border-color:var(--red);background:var(--accent-soft)}
.item .del svg{width:15px;height:15px}
.add-item{margin-top:6px}

/* totals */
.totals{margin-top:16px;border-top:1px dashed var(--line-strong);padding-top:14px;display:flex;flex-direction:column;gap:9px}
.totals .line{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.totals .line span:last-child{font-family:var(--font-mono)}
.totals .grand{align-items:baseline;font-size:15px;color:var(--text);font-weight:700;padding-top:6px;border-top:1px solid var(--line)}
.totals .grand span:last-child{font-family:var(--font-mono);font-size:22px;color:var(--accent)}

/* invoice preview */
.preview-wrap{position:sticky;top:82px}
@media(max-width:980px){.preview-wrap{position:static}}
.paper{background:#fff;color:#1c1c1c;border-radius:12px;padding:30px 32px;box-shadow:var(--shadow);max-height:calc(100vh - 118px);overflow:auto;position:relative;font-family:var(--font-body);border:1px solid rgba(0,0,0,.06)}
@media(max-width:980px){.paper{max-height:none}}
.paper__top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:18px;border-bottom:2px solid #1c1c1c}
.paper__brand{font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.01em}
.paper__meta{font-size:12.5px;color:#6b6b6b;line-height:1.55;max-width:230px}
.paper__meta b{color:#1c1c1c;font-weight:600}
.paper__title{font-family:var(--font-display);font-size:34px;font-weight:700;letter-spacing:.02em;color:#1c1c1c;margin:22px 0 4px}
.paper__no{font-size:13px;color:#6b6b6b;font-family:var(--font-mono)}
.paper__parties{display:flex;justify-content:space-between;gap:24px;margin:22px 0;flex-wrap:wrap}
.paper__parties .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#9a9a9a;font-weight:700;margin-bottom:5px}
.paper__parties .val{font-size:13.5px;color:#1c1c1c;line-height:1.55;white-space:pre-line}
.paper table{width:100%;border-collapse:collapse;margin:6px 0 18px}
.paper th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#9a9a9a;text-align:left;font-weight:700;padding:8px 8px;border-bottom:1.5px solid #1c1c1c}
.paper th.r,.paper td.r{text-align:right}
.paper td{font-size:13px;color:#1c1c1c;padding:10px 8px;border-bottom:1px solid #ececec;vertical-align:top}
.paper td.desc{font-weight:600}
.paper td.mono,.paper th.mono{font-family:var(--font-mono);font-size:12.5px}
.paper__sum{display:flex;justify-content:flex-end;margin-top:4px}
.paper__sumbox{min-width:230px}
.paper__sumrow{display:flex;justify-content:space-between;padding:5px 8px;font-size:13px;color:#4a4a4a}
.paper__sumrow span:last-child{font-family:var(--font-mono)}
.paper__sumrow.grand{border-top:2px solid #1c1c1c;margin-top:5px;padding-top:10px;font-size:15px;font-weight:700;color:#1c1c1c}
.paper__sumrow.grand span:last-child{font-size:17px}
.paper__notes{margin-top:22px;padding-top:16px;border-top:1px solid #ececec;font-size:12.5px;color:#4a4a4a;line-height:1.6;white-space:pre-line}
.paper__notes .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:#9a9a9a;font-weight:700;display:block;margin-bottom:5px}
.paper__stamp{position:absolute;top:26px;right:30px;font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);border:2px solid var(--green);border-radius:8px;padding:6px 12px;transform:rotate(-8deg);opacity:.92}
.paper__empty{color:#9a9a9a;font-style:italic}

/* history */
.history{margin-top:22px}
.history__head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.history__head h2{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700}
.history__count{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface-2);border:1px solid var(--line);padding:3px 10px;border-radius:20px}
.history__head .spacer{flex:1}
.search{position:relative;flex:1;min-width:170px;max-width:320px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.search input{padding-left:34px}
.bulkbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 14px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius-sm);font-size:13.5px;font-weight:600}
.bulkbar .spacer{flex:1}
.history__list{display:flex;flex-direction:column;gap:10px}
.hrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;transition:border-color .15s,transform .12s,box-shadow .15s}
.hrow:hover{border-color:var(--line-strong);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.hrow__main{min-width:0}
.hrow__client{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow__sub{font-size:12px;color:var(--muted);margin-top:2px}
.hrow__amt{font-family:var(--font-mono);font-weight:700;font-size:15px;white-space:nowrap}
.hrow__actions{display:flex;gap:6px}
.hrow__actions .btn{padding:7px 11px}
.chk{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.02em;white-space:nowrap}
.badge--draft{background:var(--surface-3);color:var(--muted)}
.badge--sent{background:rgba(231,178,76,.16);color:var(--amber)}
.badge--paid{background:rgba(87,199,133,.16);color:var(--green)}
.badge svg{width:12px;height:12px}

/* empty states */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 24px;gap:12px}
.empty__icon{width:64px;height:64px;border-radius:18px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);margin-bottom:4px}
.empty__icon svg{width:30px;height:30px}
.empty h3{margin:0;font-family:var(--font-display);font-size:19px;font-weight:700}
.empty p{margin:0;color:var(--muted);max-width:380px;font-size:14px}

/* upgrade line */
.upgradeline{margin-top:16px;padding:12px 16px;border:1px dashed var(--line-strong);border-radius:var(--radius-sm);font-size:13px;color:var(--muted);display:flex;align-items:center;gap:10px}
.upgradeline svg{width:16px;height:16px;flex:none;color:var(--accent)}

/* footer */
.foot{border-top:1px solid var(--line);padding:18px clamp(14px,4vw,34px);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px}

/* toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--surface-3);color:var(--text);border:1px solid var(--line-strong);border-radius:12px;padding:12px 18px;font-size:14px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* reveal */
.reveal{opacity:0;transform:translateY(14px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}body::after{opacity:.35}}

/* print */
@media print{
  body{background:#fff}
  body::before,body::after{display:none}
  .topbar,.foot,.editor,.history,.preview-actions,.toast{display:none!important}
  .wrap{padding:0;max-width:none}
  .layout{display:block}
  .preview-wrap{position:static}
  .paper{box-shadow:none;border:none;border-radius:0;max-height:none;overflow:visible;padding:0}
  @page{margin:16mm}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>
    </span>
    <span>
      <span class="brand__name">Bill Pay</span>
      <span class="brand__sub">Make a professional invoice in seconds</span>
    </span>
  </div>
  <div class="topbar__spacer"></div>
  <div class="topbar__actions">
    <button class="btn btn--ghost" id="newBtn" title="Start a new invoice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>New</button>
    <button class="btn btn--icon btn--subtle" id="themeBtn" title="Toggle light / dark mode" aria-label="Toggle color theme"></button>
  </div>
</header>

<main class="wrap">
  <div class="layout">
    <!-- EDITOR -->
    <section class="panel editor reveal" aria-label="Invoice editor">
      <div class="panel__head">
        <h2>Invoice details</h2>
        <span class="hint" id="saveState">Saved</span>
      </div>
      <div class="panel__body">
        <form id="invoiceForm" autocomplete="off">
          <div class="fieldset">
            <legend>Your business</legend>
            <div class="field"><label for="bizName">Business name</label><input class="inp" id="bizName" name="bizName" placeholder="Acme Studio"></div>
            <div class="field"><div class="row">
              <div><label for="bizEmail">Email</label><input class="inp" id="bizEmail" name="bizEmail" type="email" placeholder="you@acme.com"></div>
              <div><label for="bizPhone">Phone</label><input class="inp" id="bizPhone" name="bizPhone" placeholder="+1 555 0100"></div>
            </div></div>
            <div class="field"><label for="bizAddress">Address</label><textarea class="inp" id="bizAddress" name="bizAddress" rows="2" placeholder="12 Market St&#10;Portland, OR"></textarea></div>
          </div>

          <div class="fieldset">
            <legend>Bill to</legend>
            <div class="field"><label for="clientName">Client name</label><input class="inp" id="clientName" name="clientName" placeholder="Jane Doe, Client Co."></div>
            <div class="field"><div class="row">
              <div><label for="clientEmail">Email</label><input class="inp" id="clientEmail" name="clientEmail" type="email" placeholder="jane@client.com"></div>
              <div><label for="clientPhone">Phone</label><input class="inp" id="clientPhone" name="clientPhone" placeholder="+1 555 0199"></div>
            </div></div>
            <div class="field"><label for="clientAddress">Address</label><textarea class="inp" id="clientAddress" name="clientAddress" rows="2" placeholder="450 Oak Ave&#10;Austin, TX"></textarea></div>
          </div>

          <div class="fieldset">
            <legend>Invoice</legend>
            <div class="field"><div class="row">
              <div><label for="invNo">Invoice #</label><input class="inp inp--mono" id="invNo" name="invNo" placeholder="INV-0001"></div>
              <div><label for="invDate">Issue date</label><input class="inp" id="invDate" name="invDate" type="date"></div>
            </div></div>
            <div class="field"><div class="row">
              <div><label for="dueDate">Due date</label><input class="inp" id="dueDate" name="dueDate" type="date"></div>
              <div><label for="status">Status</label><select class="inp" id="status" name="status"><option value="draft">Draft</option><option value="sent">Sent</option><option value="paid">Paid</option></select></div>
            </div></div>
          </div>

          <div class="fieldset">
            <legend>Line items</legend>
            <div class="items-head" aria-hidden="true"><span>Description</span><span>Qty</span><span>Rate</span><span class="r">Amount</span><span></span></div>
            <div id="items"></div>
            <button type="button" class="btn btn--subtle btn--sm add-item" id="addItem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add line item</button>
          </div>

          <div class="fieldset">
            <legend>Taxes &amp; notes</legend>
            <div class="field"><div class="row">
              <div><label for="taxRate">Tax rate (%)</label><input class="inp inp--mono" id="taxRate" name="taxRate" type="number" min="0" step="0.01" value="0"></div>
              <div><label for="currency">Currency</label><select class="inp" id="currency" name="currency"><option value="USD">USD $</option><option value="EUR">EUR €</option><option value="GBP">GBP £</option><option value="CAD">CAD $</option><option value="AUD">AUD $</option><option value="INR">INR ₹</option><option value="JPY">JPY ¥</option></select></div>
            </div></div>
            <div class="field"><label for="notes">Notes &amp; payment instructions</label><textarea class="inp" id="notes" name="notes" rows="3" placeholder="Payment due within 14 days. Bank transfer or invoice email. Thanks!"></textarea></div>
          </div>

          <div class="totals">
            <div class="line"><span>Subtotal</span><span id="sub">—</span></div>
            <div class="line"><span>Tax</span><span id="tax">—</span></div>
            <div class="line grand"><span>Total due</span><span id="grand">—</span></div>
          </div>

          <div class="panel__body" style="padding:0">
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
              <button type="button" class="btn btn--primary" id="saveBtn" style="flex:1;min-width:140px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Save invoice</button>
              <button type="button" class="btn btn--ghost" id="printBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6z"/></svg>Print / PDF</button>
            </div>
            <div class="preview-actions" id="exportRow" style="display:none;margin-top:10px">
              <button type="button" class="btn btn--subtle btn--sm btn--block"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Export all data (JSON)</button>
            </div>
          </div>
        </form>
      </div>
    </section>

    <!-- PREVIEW -->
    <section class="preview-wrap reveal" aria-label="Invoice preview">
      <div class="panel" style="padding:14px">
        <div class="paper" id="paper"></div>
      </div>
    </section>
  </div>

  <!-- HISTORY -->
  <section class="history reveal" id="historySection" aria-label="Invoice history">
    <div class="history__head">
      <h2>Invoice history</h2>
      <span class="history__count" id="histCount">0</span>
      <div class="spacer"></div>
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="inp" id="searchInput" type="search" placeholder="Search by client or #" aria-label="Search invoices">
      </div>
    </div>
    <div class="bulkbar" id="bulkBar" style="display:none">
      <span id="bulkCount">0 selected</span>
      <div class="spacer"></div>
      <button class="btn btn--sm btn--ghost" id="bulkPaid">Mark paid</button>
      <button class="btn btn--sm btn--ghost" id="bulkDup">Duplicate</button>
      <button class="btn btn--sm btn--subtle" id="bulkClear">Clear</button>
    </div>
    <div class="history__list" id="histList"></div>
  </section>
</main>

<footer class="foot">
  <span><span class="dot"></span>Works offline · Your data stays in this browser</span>
  <span id="footTier">Bill Pay</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script>
/* ===== TIER SYSTEM ===== */
const TIER = "full";                 // "basic" or "full"
const LIMITS = { maxItems: 0, export: true, themes: "all", bulk: true, history: true };
const BASIC_LIMITS = { maxItems: 3, export: false, themes: "one", bulk: false, history: false };
const L = TIER === "basic" ? BASIC_LIMITS : LIMITS;
const isFull = TIER === "full";
const MAX_INVOICES = isFull ? Infinity : L.maxItems;
const MAX_LINE_ITEMS = isFull ? Infinity : 6;
const THEMES_ALL = isFull || L.themes === "all";
const CAN_BULK = isFull || L.bulk;
const CAN_HISTORY = isFull || L.history;
const CAN_EXPORT = isFull || L.export;

/* ===== STATE ===== */
const KEY = "billpay.v1";
let state = load();
let editingId = null;
let selected = new Set();
let searchQ = "";
let saveTimer = null;

function todayISO(){const d=new Date();return d.toISOString().slice(0,10);}
function addDaysISO(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function nextNumber(){
  let n=1;const nums=state.invoices.map(i=>{const m=(i.invNo||"").match(/(\d+)$/);return m?parseInt(m[1],10):0;});
  if(nums.length)n=Math.max(...nums)+1;
  return "INV-"+String(n).padStart(4,"0");
}
function blankInvoice(){
  const d=todayISO();
  return {id:uid(),invNo:nextNumber(),date:d,dueDate:addDaysISO(14),status:"draft",
    biz:{name:state.biz.name,email:state.biz.email,phone:state.biz.phone,address:state.biz.address},
    client:{name:"",email:"",phone:"",address:""},
    items:[{desc:"",qty:1,rate:0}],taxRate:0,currency:state.currency,notes:state.notes,
    createdAt:Date.now(),updatedAt:Date.now()};
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);return Object.assign({biz:{name:"",email:"",phone:"",address:""},currency:"USD",notes:"",invoices:[]},p);}}catch(e){}
  return {biz:{name:"",email:"",phone:"",address:""},currency:"USD",notes:"Payment due within 14 days.",invoices:[]};
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  const s=document.getElementById("saveState");if(s){s.textContent="Saved";}
}
function persistSoon(){const s=document.getElementById("saveState");if(s)s.textContent="Saving…";clearTimeout(saveTimer);saveTimer=setTimeout(save,400);}

/* ===== CURRENCY ===== */
const CURR={USD:"$",EUR:"€",GBP:"£",CAD:"$",AUD:"$",INR:"₹",JPY:"¥"};
function money(n,c){c=c||state.currency;const sym=CURR[c]||"";const v=Math.round((+n||0)*100)/100;const s=Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});return (v<0?"-":"")+sym+s;}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ===== THEME ===== */
const sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const moon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function applyTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("billpay.theme",t);}catch(e){}const b=document.getElementById("themeBtn");if(b)b.innerHTML=t==="light"?moon:sun;}
function currentTheme(){try{return localStorage.getItem("billpay.theme");}catch(e){return "dark";}}

/* ===== EDITOR ===== */
const $=id=>document.getElementById(id);
function readForm(){
  const f=$("invoiceForm");
  const inv={
    invNo:f.invNo.value.trim()||"INV-0000",
    date:f.invDate.value||todayISO(),dueDate:f.dueDate.value||addDaysISO(14),status:f.status.value,
    biz:{name:f.bizName.value.trim(),email:f.bizEmail.value.trim(),phone:f.bizPhone.value.trim(),address:f.bizAddress.value.trim()},
    client:{name:f.clientName.value.trim(),email:f.clientEmail.value.trim(),phone:f.clientPhone.value.trim(),address:f.clientAddress.value.trim()},
    taxRate:parseFloat(f.taxRate.value)||0,currency:f.currency.value,notes:f.notes.value
  };
  inv.items=Array.from(f.querySelectorAll(".item")).map(r=>({desc:r.querySelector(".i-desc").value,qty:parseFloat(r.querySelector(".i-qty").value)||0,rate:parseFloat(r.querySelector(".i-rate").value)||0}));
  return inv;
}
function writeForm(inv){
  const f=$("invoiceForm");
  f.bizName.value=inv.biz.name;f.bizEmail.value=inv.biz.email;f.bizPhone.value=inv.biz.phone;f.bizAddress.value=inv.biz.address;
  f.clientName.value=inv.client.name;f.clientEmail.value=inv.client.email;f.clientPhone.value=inv.client.phone;f.clientAddress.value=inv.client.address;
  f.invNo.value=inv.invNo;f.invDate.value=inv.date;f.dueDate.value=inv.dueDate;f.status.value=inv.status;
  f.taxRate.value=inv.taxRate;f.currency.value=inv.currency;f.notes.value=inv.notes;
  renderItems(inv.items);
  updateTotals();
}
function itemRow(it){
  const r=document.createElement("div");r.className="item";
  r.innerHTML='<input class="inp inp--small i-desc" type="text" placeholder="Design work" aria-label="Description" value="'+esc(it.desc)+'">'+
    '<input class="inp inp--small inp--mono i-qty" type="number" min="0" step="1" aria-label="Quantity" value="'+esc(it.qty)+'">'+
    '<input class="inp inp--small inp--mono i-rate" type="number" min="0" step="0.01" aria-label="Rate" value="'+esc(it.rate)+'">'+
    '<span class="i-amt inp--mono" style="text-align:right;font-size:13.5px;color:var(--muted)">—</span>'+
    '<button type="button" class="del" aria-label="Remove line item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>';
  return r;
}
function renderItems(items){
  const box=$("items");box.innerHTML="";
  (items&&items.length?items:[{desc:"",qty:1,rate:0}]).forEach(it=>box.appendChild(itemRow(it)));
  box.querySelectorAll(".item").forEach(r=>{
    r.querySelector(".i-desc").addEventListener("input",onItemChange);
    r.querySelector(".i-qty").addEventListener("input",onItemChange);
    r.querySelector(".i-rate").addEventListener("input",onItemChange);
    r.querySelector(".del").addEventListener("click",()=>{if(box.children.length>1){r.remove();onItemChange();}});
  });
  updateItemAmounts();
}
function onItemChange(){updateItemAmounts();updateTotals();renderPreview();persistSoon();}
function updateItemAmounts(){
  document.querySelectorAll(".item").forEach(r=>{
    const q=parseFloat(r.querySelector(".i-qty").value)||0,rt=parseFloat(r.querySelector(".i-rate").value)||0;
    r.querySelector(".i-amt").textContent=money(q*rt);
  });
}
function updateTotals(){
  let sub=0;document.querySelectorAll(".item").forEach(r=>{sub+=(parseFloat(r.querySelector(".i-qty").value)||0)*(parseFloat(r.querySelector(".i-rate").value)||0);});
  const tax=sub*((parseFloat($("taxRate").value)||0)/100);
  $("sub").textContent=money(sub);$("tax").textContent=money(tax);$("grand").textContent=money(sub+tax);
}

/* ===== PREVIEW ===== */
function renderPreview(){
  const inv=readForm();
  const sub=inv.items.reduce((a,i)=>a+(i.qty*i.rate),0);
  const tax=sub*(inv.taxRate/100);
  const grand=sub+tax;
  const hasItems=inv.items.some(i=>i.desc||i.rate||i.qty);
  const stamp=inv.status==="paid"?'<div class="paper__stamp">Paid</div>':(inv.status==="sent"?'<div class="paper__stamp" style="color:var(--amber);border-color:var(--amber)">Sent</div>":"");
  const rows=hasItems?inv.items.map(i=>'<tr><td class="desc">'+esc(i.desc||"—")+'</td><td class="r mono">'+esc(i.qty)+'</td><td class="r mono">'+money(i.rate,inv.currency)+'</td><td class="r mono">'+money(i.qty*i.rate,inv.currency)+'</td></tr>').join(""):'<tr><td colspan="4" class="paper__empty">Add line items to see them here.</td></tr>';
  const addr=a=>a?esc(a):'<span style="color:#bbb">—</span>';
  $("paper").innerHTML=stamp+
    '<div class="paper__top"><div class="paper__brand">'+esc(inv.biz.name||"Your Business")+'</div><div class="paper__meta"><b>From</b><br>'+esc(inv.biz.address||"")+"<br>"+esc(inv.biz.email||"")+" "+esc(inv.biz.phone||"")+'</div></div>'+
    '<div class="paper__title">Invoice</div><div class="paper__no">'+esc(inv.invNo)+' &nbsp;·&nbsp; Issued '+esc(inv.date)+'</div>'+
    '<div class="paper__parties"><div><div class="lbl">Bill to</div><div class="val">'+esc(inv.client.name||"Client")+'\n'+addr(inv.client.address)+'\n'+esc(inv.client.email||"")+'</div></div><div style="text-align:right"><div class="lbl">Due</div><div class="val">'+esc(inv.dueDate)+'</div></div></div>'+
    '<table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '<div class="paper__sum"><div class="paper__sumbox"><div class="paper__sumrow"><span>Subtotal</span><span>'+money(sub,inv.currency)+'</span></div>'+(inv.taxRate?'<div class="paper__sumrow"><span>Tax ('+esc(inv.taxRate)+'%)</span><span>'+money(tax,inv.currency)+'</span></div>':'')+'<div class="paper__sumrow grand"><span>Total</span><span>'+money(grand,inv.currency)+'</span></div></div></div>'+
    (inv.notes?'<div class="paper__notes"><span class="lbl">Notes</span>'+esc(inv.notes)+'</div>":"");
}

/* ===== HISTORY ===== */
function statusBadge(s){
  const map={draft:['Draft','draft',''],sent:['Sent','sent','<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>'],paid:['Paid','paid','<path d="M20 6L9 17l-5-5"/>']};
  const m=map[s]||map.draft;return '<span class="badge badge--'+m[1]+'">'+(m[2]?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">'+m[2]+'</svg>':'')+m[0]+'</span>';
}
function renderHistory(){
  const list=$("histList");
  if(!CAN_HISTORY){list.innerHTML='<div class="empty" style="padding:34px 20px"><div class="empty__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg></div><h3>Invoice history</h3><p>Full edition keeps a searchable history of every invoice so you can reopen, duplicate, or reprint old bills.</p></div>';$("histCount").textContent="";return;}
  const q=searchQ.toLowerCase();
  const invs=state.invoices.slice().sort((a,b)=>b.updatedAt-a.updatedAt).filter(i=>!q||(i.client.name||"").toLowerCase().includes(q)||(i.invNo||"").toLowerCase().includes(q));
  $("histCount").textContent=state.invoices.length+(state.invoices.length===1?" invoice":" invoices");
  if(!invs.length){list.innerHTML='<div class="empty" style="padding:34px 20px"><div class="empty__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M14 2v6h6"/></svg></div><h3>No invoices yet</h3><p>Fill in the details above and hit <b>Save invoice</b>. It will appear here for quick access.</p></div>';return;}
  list.innerHTML=invs.map(i=>{
    const sub=i.items.reduce((a,x)=>a+(x.qty*x.rate),0),tax=sub*(i.taxRate/100);
    const chk=CAN_BULK?'<input type="checkbox" class="chk" data-id="'+i.id+'" '+(selected.has(i.id)?"checked":"")+' aria-label="Select '+esc(i.invNo)+'">':"";
    return '<div class="hrow" data-id="'+i.id+'">'+chk+
      '<div class="hrow__main"><div class="hrow__client">'+esc(i.client.name||"Untitled client")+'</div><div class="hrow__sub">'+esc(i.invNo)+' · '+esc(i.date)+' · '+i.items.length+' item'+(i.items.length===1?"":
</body>
</html>
