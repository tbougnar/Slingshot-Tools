<!DOCTYPE html><html lang="en" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>QuickNote – Quick note taker</title><style>body{font-family:sans-serif;background:#F6EFEC;color:#14100F;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}header,footer{background:#C1272D;color:#F6EFEC;padding:1rem;text-align:center}header h1{margin:0}main{flex:1;padding:1rem;max-width:800px;margin:auto}button{background:#C1272D;color:#F6EFEC;border:none;padding:.5rem 1rem;border-radius:.3rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}input,select,textarea{padding:.5rem;border:1px solid #ccc;border-radius:.3rem;width:100%;box-sizing:border-box}section{background:#fff;padding:1rem;margin-bottom:1rem;border-radius:.5rem;box-shadow:0 2px 5px rgba(0,0,0,.1)}.note{border-bottom:1px solid #eee;padding:.5rem 0} .note:last-child{border:none} .tags{font-size:.8rem;color:#555} .empty{color:#777;text-align:center;margin-top:2rem}#themeToggle{position:absolute;top:1rem;right:1rem;background:#14100F}</style></head><body><header><h1>QuickNote</h1><button id="themeToggle">Toggle Theme</button></header><main><section id="addSection"><h2>Add Note</h2><form id="noteForm"><input type="text" id="title" placeholder="Title" required><br><br><textarea id="content" placeholder="Content" rows="3" required></textarea><br><br><input type="text" id="tags" placeholder="Tags (comma separated)"><br><br><button type="submit" id="addBtn">Add</button></form></section><section id="listSection"><h2>Your Notes</h2><input type="text" id="search" placeholder="Search..."><div id="notesContainer"></div></section><section id="exportSection" style="display:none"><h2>Data</h2><button id="exportBtn">Export My Data</button><input type="file" id="importFile" accept="application/json"><button id="importBtn">Import My Data</button></section></main><footer>© 2026 QuickNote</footer><script>const TIER="basic";const LIMITS={maxItems:0,export:true,themes:"all",bulk:true,history:true};const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};const PAID=new URLSearchParams(location.search).has('paid');const LIM=PAID?{max:Infinity,export:true,themes:"all",bulk:true,history:true}:{max:BASIC_LIMITS.maxItems,export:BASIC_LIMITS.export,themes:BASIC_LIMITS.themes,bulk:BASIC_LIMITS.bulk,history:BASIC_LIMITS.history};const K='quicknote.v1';const load=()=>{try{return JSON.parse(localStorage.getItem(K))||[] }catch(e){return []}};const save=v=>localStorage.setItem(K,JSON.stringify(v));let notes=load();function render(){const container=document.getElementById('notesContainer');container.innerHTML='';if(notes.length===0){container.innerHTML='<div class="empty">No notes yet – add one above!</div>';return}const frag=document.createDocumentFragment();notes.forEach((n,i)=>{const div=document.createElement('div');div.className='note';div.innerHTML=`<strong>${n.title}</strong><p>${n.content}</p><div class="tags">${n.tags.map(t=>'#'+t).join(' ')}</div><button data-idx="${i}" class="delBtn">Delete</button>`;frag.appendChild(div)});container.appendChild(frag)}function addNote(e){e.preventDefault();if(notes.length>=LIM.max){alert('Upgrade to add more notes');return}const title=document.getElementById('title').value.trim();const content=document.getElementById('content').value.trim();const tags=document.getElementById('tags').value.split(',').map(t=>t.trim()).filter(t=>t);notes.unshift({title,content,tags});save(notes);render();e.target.reset()}function deleteNote(e){if(!e.target.matches('.delBtn'))return;const idx=e.target.dataset.idx;notes.splice(idx,1);save(notes);render()}function filterNotes(){const term=document.getElementById('search').value.toLowerCase();const filtered=notes.filter(n=>n.title.toLowerCase().includes(term)||n.content.toLowerCase().includes(term)||n.tags.some(t=>t.toLowerCase().includes(term)));const container=document.getElementById('notesContainer');container.innerHTML='';if(filtered.length===0){container.innerHTML='<div class="empty">No matching notes.</div>';return}const frag=document.createDocumentFragment();filtered.forEach((n,i)=>{const div=document.createElement('div');div.className='note';div.innerHTML=`<strong>${n.title}</strong><p>${n.content}</p><div class="tags">${n.tags.map(t=>'#'+t).join(' ')}</div>`;frag.appendChild(div)});container.appendChild(frag)}function exportData(){const data=JSON.stringify(notes,null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='quicknote.json';a.click();URL.revokeObjectURL(url)}function importData(){const file=document.getElementById('importFile').files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{try{const arr=JSON.parse(e.target.result);if(Array.isArray(arr)){notes=arr;save(notes);render()}else{alert('Invalid file')}}catch{alert('Failed to read file')}};reader.readAsText(file)}function initTheme(){const saved=localStorage.getItem('theme');if(saved){document.documentElement.dataset.theme=saved}}function toggleTheme(){const cur=document.documentElement.dataset.theme;const next=cur==='light'?'dark':'light';document.documentElement.dataset.theme=next;localStorage.setItem('theme',next)}document.getElementById('noteForm').addEventListener('submit',addNote);document.getElementById('notesContainer').addEventListener('click',deleteNote);document.getElementById('search').addEventListener('input',filterNotes);document.getElementById('themeToggle').addEventListener('click',toggleTheme);if(LIM.export){document.getElementById('exportSection').style.display='block';document.getElementById('exportBtn').addEventListener('click',exportData);document.getElementById('importBtn').addEventListener('click',importData)}initTheme();render();</script></body></html>
