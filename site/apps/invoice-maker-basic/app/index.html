<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InvoiceForge — Invoice Generator</title>
<style>
:root{
--bg:#14100F;--red:#C1272D;--text:#F6EFEC;--card:#1e1715;--shadow:rgba(0,0,0,.3);
}
html[data-theme="light"]{
--bg:#fdf6f4;--red:#C1272D;--text:#222;--card:#fff;--shadow:rgba(0,0,0,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
header h1{font-size:1.6rem;font-weight:700;color:var(--red)}
.toggle{background:none;border:1px solid var(--red);color:var(--red);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.9rem}
.toggle:hover{background:var(--red);color:var(--bg)}
main{max-width:900px;margin:auto}
.card{background:var(--card);border-radius:12px;box-shadow:0 4px 12px var(--shadow);padding:20px;margin-bottom:20px}
h2{color:var(--red);font-size:1.2rem;margin-bottom:12px}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:1rem;margin-bottom:12px;background:var(--bg);color:var(--text)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red)}
button.submit{background:var(--red);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:1rem;cursor:pointer}
button.submit:hover{opacity:.9}
button.danger{background:#555}
button.danger:hover{opacity:.8}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #444;padding:8px;text-align:left}
th{color:var(--red)}
.empty{text-align:center;padding:30px;color:#aaa}
.footer-links{display:flex;gap:10px;flex-wrap:wrap}
footer{margin-top:30px;text-align:center;color:#888;font-size:.85rem}
.theme-row{display:flex;align-items:center;gap:8px}
@media(max-width:600px){header h1{font-size:1.3rem}}
</style>
</head>
<body>
<header>
<h1>InvoiceForge</h1>
<button class="toggle" id="themeToggle">Toggle Theme</button>
</header>
<main>
<div class="card">
<h2>Invoice Details</h2>
<label>Client Name</label><input type="text" id="clientName" placeholder="e.g. Acme Corp">
<label>Your Name / Business</label><input type="text" id="yourName" placeholder="e.g. Jane Doe">
<label>Invoice #</label><input type="text" id="invoiceNum" placeholder="e.g. 001">
<label>Date</label><input type="date" id="invoiceDate">
<label>Due Date</label><input type="date" id="dueDate">
</div>
<div class="card">
<h2>Items</h2>
<div id="itemsList"></div>
<button class="submit" id="addItemBtn">+ Add Item</button>
</div>
<div class="card">
<h2>Preview & Export</h2>
<button class="submit" id="generateBtn">Generate Invoice</button>
<button class="danger" id="exportBtn">Export Data (Full)</button>
<button class="danger" id="importBtn">Import Data (Full)</button>
<input type="file" id="importFile" accept=".json" style="display:none">
<div id="preview"></div>
</div>
</main>
<footer>
<span id="edition"></span> · Made with ❤﻿ by Slingshot Tools
</footer>
<script>
const TIER = "basic";
const LIMITS = TIER === "full" ? {maxItems:0,export:true,themes:"all",bulk:true,history:true} : {maxItems:3,export:false,themes:"one",bulk:false,history:false};
const K='app.v1';
const load=()=>{try{return JSON.parse(localStorage.getItem(K))||null}catch{return null}};
const save=v=>localStorage.setItem(K,JSON.stringify(v));
const state=load()||{clientName:'',yourName:'',invoiceNum:'',invoiceDate:'',dueDate:'',items:[]};
function setText(id,val){const el=document.getElementById(id);if(el)el.value=val}
function getText(id){const el=document.getElementById(id);return el?el.value:''}
function init(){
const theme=localStorage.getItem('theme')||'dark';
document.documentElement.dataset.theme=theme;
const edition=document.getElementById('edition');
edition.textContent=TIER==='full'?'Full edition':'Free edition';
setText('clientName',state.clientName);setText('yourName',state.yourName);setText('invoiceNum',state.invoiceNum);
setText('invoiceDate',state.invoiceDate);setText('dueDate',state.dueDate);
renderItems();
}
function saveState(){state.clientName=getText('clientName');state.yourName=getText('yourName');state.invoiceNum=getText('invoiceNum');state.invoiceDate=getText('invoiceDate');state.dueDate=getText('dueDate');save(state)}
function renderItems(){const list=document.getElementById('itemsList');list.innerHTML='';state.items.forEach((it,i)=>{const row=document.createElement('div');row.innerHTML='<input type="text" placeholder="Description" value="'+it.desc+'"><input type="number" placeholder="Qty" value="'+it.qty+'"><input type="number" placeholder="Price" value="'+it.price+'"><button onclick="removeItem('+i+')</html>
