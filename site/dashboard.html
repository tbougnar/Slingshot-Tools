<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — Slingshot Tools</title>
  <link rel="icon" href="favicon.png">
  <style>
    :root{--bg:#0b0b0d;--card:#151517;--ink:#f5f5f7;--sub:#b9b9c3;--line:#2a2a31;--red:#ff4d4d;--green:#4ade80;--amber:#fbbf24;}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(1200px 800px at 20% -10%,#1a1a20,transparent),var(--bg);color:var(--ink)}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}
    h1{margin:0 0 6px;font-size:28px}
    h2{margin:0 0 12px;font-size:18px}
    .sub{color:var(--sub);margin:0 0 20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:16px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.03),transparent);border:1px solid var(--line);border-radius:14px;padding:16px}
    .stat{font-size:28px;font-weight:800;margin:4px 0}
    .label{color:var(--sub);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
    .muted{color:var(--sub)}
    .ok{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red)}
    pre{white-space:pre-wrap;word-break:break-word;background:#101014;border:1px solid var(--line);border-radius:10px;padding:12px;color:#e8e8ea;font-size:13px;line-height:1.45;margin:0}
    .list{display:grid;gap:10px}
    .item{border:1px solid var(--line);border-radius:10px;padding:12px;background:rgba(255,255,255,.02)}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
    .pill{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--sub)}
    .gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .gate-box{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
    input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f0f12;color:var(--ink);margin:10px 0}
    button,.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#1b1b20;color:var(--ink);cursor:pointer;font-weight:600}
    a{color:#ff8a8a}
    .hidden{display:none}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    table{width:100%;border-collapse:collapse}
    th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
    th{color:var(--sub);font-weight:600}
  </style>
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-box">
      <h1>Private Dashboard</h1>
      <p class="muted">Enter passcode to view.</p>
      <input id="pass" type="password" placeholder="Passcode" autocomplete="current-password">
      <button id="unlock">Unlock</button>
      <p id="gateMsg" class="muted"></p>
    </div>
  </div>

  <div id="app" class="wrap hidden">
    <div class="topbar">
      <div>
        <h1>Slingshot Dashboard</h1>
        <p class="sub" id="updated">Loading...</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="btn" href="./" style="text-decoration:none">Site</a>
        <a class="btn" href="events.html" style="text-decoration:none">Events</a>
        <button id="lock">Lock</button>
      </div>
    </div>

    <div class="grid" id="stats"></div>

    <div class="grid">
      <div class="card" style="grid-column:1/-1">
        <h2>Latest Learning</h2>
        <div id="latestLearn" class="muted">Loading...</div>
      </div>
      <div class="card">
        <h2>Products</h2>
        <div id="products" class="muted">Loading...</div>
      </div>
      <div class="card">
        <h2>Votes & Events</h2>
        <div id="votesEvents" class="muted">Loading...</div>
      </div>
      <div class="card" style="grid-column:1/-1">
        <h2>Recent Fixbook / Status</h2>
        <div id="fixbook" class="muted">Loading...</div>
      </div>
      <div class="card" style="grid-column:1/-1">
        <h2>Goals & Weekly State</h2>
        <div id="goalsState" class="muted">Loading...</div>
      </div>
    </div>
  </div>

<script>
  // Simple client-side gate (obscurity, not strong security for static hosting)
  const PASSCODE = 'slingshot';
  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  const msg = document.getElementById('gateMsg');

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));}

  function unlock(){
    const v = document.getElementById('pass').value;
    if(v === PASSCODE){ sessionStorage.setItem('dash_ok','1'); show(); load(); }
    else { msg.textContent = 'Wrong passcode.'; msg.className='bad'; }
  }
  function show(){ gate.classList.add('hidden'); app.classList.remove('hidden'); }
  function lock(){ sessionStorage.removeItem('dash_ok'); app.classList.add('hidden'); gate.classList.remove('hidden'); document.getElementById('pass').value=''; msg.textContent=''; }
  document.getElementById('unlock').onclick = unlock;
  document.getElementById('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') unlock(); });
  document.getElementById('lock').onclick = lock;
  if(sessionStorage.getItem('dash_ok')==='1'){ show(); load(); }

  async function load(){
    try{
      const r = await fetch('dashboard-data.json',{cache:'no-store'});
      const d = await r.json();
      render(d);
    }catch(e){
      document.getElementById('updated').textContent = 'Failed to load dashboard data.';
    }
  }

  function render(d){
    document.getElementById('updated').textContent = 'Updated: ' + (d.generated || 'unknown') + ' · Latest week: ' + (d.latest_week || 'n/a');
    const rev = d.revenue || {};
    const orders = rev.orders ?? (rev.total_orders ?? 0);
    const total = rev.total ?? (rev.revenue ?? 0);
    const productsCount = Array.isArray(d.products) ? d.products.length : 0;
    const known = d.known_problems_count ?? 0;
    const latestWeek = d.latest_week || 'n/a';
    const rep = d.reputation || {};
    const stats = [
      ['Revenue', '$' + Number(total||0).toFixed(2), orders + ' order(s)'],
      ['Products', String(productsCount), 'catalog entries on site'],
      ['Latest Week', latestWeek, (d.latest_review && d.latest_review.text ? 'review recorded' : 'no review text')],
      ['Known Problems', String(known), 'fixbook entries'],
      ['Stars', String(rep.stars ?? rep.github?.stars ?? 'n/a'), 'public signals'],
      ['Votes', String((d.votes && d.votes.poll && d.votes.poll.options ? d.votes.poll.options.reduce((s,o)=>s+(o.votes||0),0):0)), 'current ballot total'],
    ];
    document.getElementById('stats').innerHTML = stats.map(s=>`<div class="card"><div class="label">${esc(s[0])}</div><div class="stat">${esc(s[1])}</div><div class="muted">${esc(s[2])}</div></div>`).join('');

    // Latest learning
    const lr = d.latest_review;
    if(lr && lr.text){
      document.getElementById('latestLearn').innerHTML = `<div class="row" style="margin-bottom:10px"><span class="pill">${esc(lr.week||latestWeek)}</span><span class="muted">Revenue: $${Number((lr.revenue||{}).total||0).toFixed(2)} · Votes: ${esc(lr.ballot_votes||0)} · Products: ${esc((lr.products||[]).length)}</span></div><pre>${esc(lr.text)}</pre>`;
    } else if(d.latest_fixbook_entry){
      const f = d.latest_fixbook_entry;
      document.getElementById('latestLearn').innerHTML = `<div class="row" style="margin-bottom:10px"><span class="pill">${esc(f.id||'')}</span><span class="muted">${esc(f.date||'')}</span></div><div><strong>${esc(f.symptom||'')}</strong></div><div class="muted" style="margin-top:8px">${esc(f.cause||'')}</div>`;
    } else {
      document.getElementById('latestLearn').textContent = 'No learning data found.';
    }

    // Products
    const prods = Array.isArray(d.products) ? d.products : [];
    if(!prods.length){
      document.getElementById('products').innerHTML = '<div class="muted">No products in site/apps.json yet.</div>';
    } else {
      document.getElementById('products').innerHTML = '<div class="list">' + prods.map(p=>`<div class="item"><div class="row"><strong>${esc(p.title||p.slug||'Product')}</strong><span class="pill">${esc(p.tier||'')}</span></div><div class="muted">${esc(p.tag||'')} · $${Number(p.price||0).toFixed(2)} ${p.published===false?'· hidden':''}</div></div>`).join('') + '</div>';
    }

    // Votes & events
    let ve = '';
    const poll = d.votes && d.votes.poll ? d.votes.poll : null;
    if(poll){
      const totalVotes = (poll.options||[]).reduce((s,o)=>s+(o.votes||0),0);
      ve += `<div class="item"><div class="row"><strong>Current Vote</strong><span class="pill">${esc(poll.id||'')}</span></div><div class="muted" style="margin:6px 0">${esc(poll.question||'')}</div>` + (poll.options||[]).map(o=>{const pct=totalVotes?Math.round((o.votes||0)/totalVotes*100):0; return `<div style="margin:6px 0"><div class="row"><span>${esc(o.label)}</span><span class="muted">${pct}% (${o.votes||0})</span></div><div style="height:6px;background:#222;border-radius:999px;overflow:hidden"><div style="height:100%;width:${pct}%;background:#ff6b6b"></div></div></div>`;}).join('') + `</div>`;
    } else { ve += '<div class="item muted">No active vote data.</div>'; }
    const evs = (d.events && d.events.events) ? d.events.events : [];
    if(evs.length){ ve += '<div class="item"><strong>Events</strong>' + evs.map(e=>`<div style="margin-top:8px"><div>${esc(e.title||'')}</div><div class="muted">${esc(e.date||'')} — ${esc(e.description||'')}</div></div>`).join('') + '</div>'; }
    document.getElementById('votesEvents').innerHTML = ve;

    // Fixbook recent
    const recent = Array.isArray(d.recent_fixbook) ? d.recent_fixbook.slice().reverse() : [];
    if(!recent.length){ document.getElementById('fixbook').textContent = 'No fixbook entries.'; }
    else {
      document.getElementById('fixbook').innerHTML = '<div class="list">' + recent.map(f=>`<div class="item"><div class="row"><strong>${esc(f.id||'')}</strong><span class="pill">${esc(f.date||'')}</span></div><div style="margin-top:6px"><strong>${esc(f.symptom||'')}</strong></div><div class="muted" style="margin-top:6px">${esc((f.cause||'').slice(0,400))}</div><div class="muted" style="margin-top:6px">Fix: ${esc(f.fix||'')}</div><div class="muted">Status: ${esc(f.verified ? 'verified' : 'untested')}</div></div>`).join('') + '</div>';
    }

    // Goals & state
    const goals = d.goals || {};
    const ws = d.weekly_state || {};
    document.getElementById('goalsState').innerHTML = `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:0"><div class="item"><strong>Goals</strong><pre>${esc(JSON.stringify(goals, null, 2))}</pre></div><div class="item"><strong>Weekly State</strong><pre>${esc(JSON.stringify(ws, null, 2))}</pre></div><div class="item"><strong>Reputation</strong><pre>${esc(JSON.stringify(d.reputation||{}, null, 2))}</pre></div></div>`;
  }
</script>
</body>
</html>
