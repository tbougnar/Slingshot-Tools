<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout - Slingshot Tools</title>
<link rel="icon" href="favicon.png">
<style>
  :root{--bg:#0d0a0c;--panel:#171114;--line:#2a2026;--txt:#f4eef1;--dim:#a99ba3;--acc:#c8102e;--acc2:#ff5a72}
  [data-theme="light"]{--bg:#faf7f8;--panel:#fff;--line:#e6dde1;--txt:#1a1418;--dim:#6b5c63}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.5 system-ui,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:460px}
  h1{margin:0 0 6px;font-size:22px}
  .sub{color:var(--dim);margin:0 0 20px;font-size:14px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
  .amt{font-size:26px;font-weight:700;color:var(--acc2)}
  label{display:block;font-size:13px;color:var(--dim);margin:14px 0 6px}
  input{width:100%;padding:12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:15px}
  button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.6;cursor:not-allowed}
  .msg{margin-top:14px;padding:11px;border-radius:9px;font-size:14px;display:none}
  .err{background:#3a1420;color:#ffb9c4;display:block;border:1px solid #5c1c2c}
  .ok{background:#0f2a1c;color:#8fe0b0;display:block;border:1px solid #1d4733}
  .key{font-family:ui-monospace,Consolas,monospace;font-size:15px;word-break:break-all;background:var(--bg);padding:12px;border-radius:8px;margin:10px 0;border:1px solid var(--line)}
  a.back{color:var(--dim);font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <h1 id="h">Checkout</h1>
  <p class="sub">Secure payment by PayPal. Card, PayPal balance, Apple Pay or Google Pay.</p>
  <div class="row"><span id="lbl">Full edition</span><span class="amt" id="amt">$0.00</span></div>
  <label for="email">Email for your license key</label>
  <input id="email" type="email" placeholder="you@example.com" required autocomplete="email">
  <button id="go" onclick="start()">Pay with PayPal</button>
  <div class="msg" id="m"></div>
  <p style="margin-top:18px"><a class="back" href="./">&larr; Back to all apps</a></p>
</div>
<script>
const SLINGSHOT_API="https://slingshot-pay.bougnartaha2.workers.dev";
const q=new URLSearchParams(location.search);
const slug=q.get('slug')||'';
const price=parseFloat(q.get('price')||'0');
document.getElementById('h').textContent=q.get('title')||'Slingshot Tools';
document.getElementById('lbl').textContent='Full edition (lifetime)';
document.getElementById('amt').textContent='$'+price.toFixed(2);
if(!slug||!(price>0)){const m=document.getElementById('m');m.className='msg err';m.textContent='This product link is not valid yet. Please pick an app from the catalog first.';document.getElementById('go').disabled=true;}

async function start(){
  const btn=document.getElementById('go'),m=document.getElementById('m');
  const email=document.getElementById('email').value.trim();
  if(!email){m.className='msg err';m.textContent='Please enter your email.';return;}
  btn.disabled=true;btn.textContent='Connecting to PayPal...';m.className='msg';
  try{
    const r=await fetch(SLINGSHOT_API+'/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug,price,title:q.get('title')||'',email})});
    const d=await r.json();
    if(!r.ok||!d.approve){throw new Error(d.error||'Could not start the payment.');}
    try{sessionStorage.setItem('ss_order',d.order);sessionStorage.setItem('ss_title',q.get('title')||'');}catch(e){}
    location.href=d.approve;
  }catch(e){m.className='msg err';m.textContent=e.message;btn.disabled=false;btn.textContent='Pay with PayPal';}
}
</script>
</body>
</html>
