<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cue — Spaced Flashcards</title>
<style>
:root{--bg:#14100F;--bg2:#1c1513;--card:#221816;--card2:#2b1e1b;--line:#3a2a26;--text:#F6EFEC;--muted:#a89a95;--red:#C1272D;--red2:#e0464c;--ok:#5a9e6f;--warn:#d99a3c;--shadow:0 14px 34px rgba(0,0,0,.45);--ring:rgba(193,39,45,.55)}
[data-theme=light]{--bg:#f5efe9;--bg2:#efe6df;--card:#fff;--card2:#f6efe9;--line:#e5d8cf;--text:#241a17;--muted:#7a6a63;--red:#C1272D;--red2:#a01f24;--ok:#2f7d4a;--warn:#a9701a;--shadow:0 12px 28px rgba(80,40,30,.14);--ring:rgba(193,39,45,.35)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(193,39,45,.10),transparent),var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:12px;margin:6px 0 18px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--red),var(--red2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;box-shadow:var(--shadow)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-size:20px;letter-spacing:.2px}
.ttl p{margin:0;color:var(--muted);font-size:13px}
.iconbtn{background:var(--card);border:1px solid var(--line);color:var(--text);width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:18px;display:grid;place-items:center;transition:.15s}
.iconbtn:hover{border-color:var(--red);transform:translateY(-1px)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.badge.full{color:#fff;background:var(--red);border-color:transparent}
.tabs{display:flex;gap:6px;background:var(--card);padding:5px;border-radius:14px;border:1px solid var(--line);margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:10px;border-radius:10px;cursor:pointer;transition:.15s}
.tab[aria-selected=true]{background:var(--red);color:#fff;box-shadow:0 6px 16px rgba(193,39,45,.35)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
h2{margin:0 0 14px;font-size:16px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}
textarea,input[type=text],select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 12px;font:inherit;resize:vertical}
textarea:focus,input:focus,select:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px var(--ring)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:var(--red2);transform:translateY(-1px)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--red)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .txt span{font-size:12px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.pill.due{background:rgba(193,39,45,.16);color:var(--red2)}
.pill.later{background:var(--card);color:var(--muted);border:1px solid var(--line)}
[data-theme=light] .pill.due{color:var(--red)}
.x{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--red2);background:var(--card)}
.empty{border:2px dashed var(--line);border-radius:18px;padding:34px 20px;text-align:center;color:var(--muted)}
.empty .big{font-size:40px;margin-bottom:8px}
.empty b{color:var(--text)}
.empty p{max-width:360px;margin:8px auto 0;font-size:14px}
.stage{display:none}
.stage.on{display:block}
.flash{max-width:560px;margin:0 auto;text-align:center}
.flash .side{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:44px 24px;min-height:180px;display:grid;place-items:center;box-shadow:var(--shadow)}
.flash .side .k{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.flash .side .v{font-size:26px;font-weight:700;word-break:break-word}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.grade .btn{flex-direction:column;gap:2px;padding:12px 6px}
.grade .btn small{font-size:11px;font-weight:400;opacity:.85}
.bar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--red2));transition:width .4s}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:26px;line-height:1.6}
.up{background:rgba(193,39,45,.08);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--muted);margin-top:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:12px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--red)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="logo">C</div>
<div class="ttl"><h1>Cue</h1><p>Spaced Flashcards</p></div>
<span class="badge" id="tier">full</span>
<button class="iconbtn" id="theme" aria-label="Toggle light or dark mode">☀</button>
</header>
<nav class="tabs" role="tablist" aria-label="Sections">
<button class="tab" role="tab" data-tab="study" aria-selected="true">Study</button>
<button class="tab" role="tab" data-tab="deck" aria-selected="false">Deck</button>
<button class="tab" role="tab" data-tab="data" aria-selected="false">Data</button>
</nav>

<section id="tab-study" class="stage on">
<div class="stats" id="stats"></div>
<div id="studyBody"></div>
</section>

<section id="tab-deck" class="stage">
<div class="card">
<h2>Add a card</h2>
<form id="addForm">
<label for="q">Question</label>
<textarea id="q" rows="2" placeholder="e.g. What is the powerhouse of the cell?"></textarea>
<label for="a">Answer</label>
<textarea id="a" rows="2" placeholder="e.g. The mitochondrion."></textarea>
<div class="row" style="margin-top:14px">
<button class="btn primary" type="submit">Add card</button>
<span class="hint" id="leftHint"></span>
</div>
</form>
</div>
<div class="card" style="margin-top:18px">
<h2>Your deck</h2>
<div id="deckList"></div>
</div>
</section>

<section id="tab-data" class="stage">
<div class="card">
<h2>Your data</h2>
<div id="dataBody"></div>
</div>
</section>

<footer id="foot">Cue · works offline, no account, data stays on this device.</footer>
</div>
<script>
const TIER="basic";
const BASIC_LIMITS={maxItems:3,export:false,themes:"one",bulk:false,history:false};
const LIMITS=TIER==="basic"?BASIC_LIMITS:{maxItems:0,export:true,themes:"all",bulk:true,history:true};
const K="cue.v1",TK="cue.theme";
let cards=load(),theme=localStorage.getItem(TK)||"dark";
function load(){try{const d=JSON.parse(localStorage.getItem(K));return Array.isArray(d)?d:[];}catch(e){return[];}}
function save(){localStorage.setItem(K,JSON.stringify(cards));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function due(c){return c.due<=Date.now();}
function fmt(n){return new Date(n).toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function sched(c,g){const base={again:10*60000,hard:12*3600000,good:24*3600000,easy:72*3600000}[g];const f=c.interval>0?c.interval:base;const next={again:base,hard:f*1.2,good:f*2.5,easy:f*4}[g];c.interval=next;c.due=Date.now()+next;c.reps++;}
function setTheme(t){theme=t;document.documentElement.setAttribute("data-theme",t);localStorage.setItem(TK,t);document.getElementById("theme").textContent=t==="dark"?"☀":"🌙";}
function toast(m){const n=document.createElement("div");n.textContent=m;n.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--card);color:var(--text);border:1px solid var(--line);padding:10px 16px;border-radius:999px;box-shadow:var(--shadow);z-index:99;font-size:13px;font-weight:600";document.body.appendChild(n);setTimeout(()=>n.remove(),2200);}
function renderStats(){const d=cards.filter(due).length;const soon=cards.filter(c=>!due(c)&&c.due-Date.now()<24*3600000).length;document.getElementById("stats").innerHTML=`<div class="stat"><b>${cards.length}</b><span>Cards</span></div><div class="stat"><b>${d}</b><span>Due now</span></div><div class="stat"><b>${soon}</b><span>Due soon</span></div><div class="stat"><b>${cards.filter(c=>c.reps>0).length}</b><span>Reviewed</span></div>`;}
let session=[];
function startSession(){session=[...cards.filter(due)].sort((a,b)=>a.due-b.due);renderStudy();}
function renderStudy(){const body=document.getElementById("studyBody");renderStats();if(!cards.length){body.innerHTML=`<div class="empty"><div class="big">🎴</div><b>No cards yet</b><p>Create your first card in the <b>Deck</b> tab, then come back here to start studying. Cue will schedule each review for the moment you're about to forget it.</p></div>`;return;}if(!session.length){body.innerHTML=`<div class="card" style="text-align:center"><div style="font-size:40px">✅</div><h2 style="margin-top:8px">All caught up</h2><p class="note">Nothing is due right now. Come back when Cue schedules your next review.</p><button class="btn primary" style="margin-top:14px" onclick="startSession()">Study anyway</button></div>`;return;}const c=session[0];const prog=Math.round((session.length-1)/session.length*100);body.innerHTML=`<div class="flash"><div class="side"><div class="k">Question</div><div class="v">${esc(c.q)}</div></div><div class="bar"><i style="width:${prog}%"></i></div><div class="grade"><button class="btn ghost" onclick="grade('again')">Again<small>10s</small></button><button class="btn ghost" onclick="grade('hard')">Hard<small>12h</small></button><button class="btn primary" onclick="grade('good')">Good<small>1d</small></button><button class="btn primary" onclick="grade('easy')">Easy<small>3d</small></button></div><p class="note">Card ${session.length?session.length:0} of ${session.length} · press 1–4 to grade</p></div>`;}
function grade(g){if(!session.length)return;const c=session[0];sched(c,g);if(g!=="again")session.shift();else{session.splice(1,0,c);}save();renderStudy();}
document.addEventListener("keydown",e=>{if(document.querySelector("#tab-study.stage.on")&&session.length){const m={"1":"again","2":"hard","3":"good","4":"easy"};if(m[e.key])grade(m[e.key]);}});
function renderDeck(){const list=document.getElementById("deckList");const left=LIMITS.maxItems>0?LIMITS.maxItems-cards.length:0;document.getElementById("leftHint").textContent=LIMITS.maxItems>0?`Free: ${left} more card${left===1?"":"s"} left`:"";if(!cards.length){list.innerHTML=`<div class="empty"><div class="big">🗂</div><b>Your deck is empty</b><p>Add a question and an answer above. Keep cards small and focused — one fact each works best.</p></div>`;return;}list.innerHTML=`<div class="list">`+cards.map(c=>`<div class="item"><div class="txt"><b>${esc(c.q)}</b><span>${due(c)?"Due now":"Next: "+fmt(c.due)} · ${c.reps} review${c.reps===1?"":"s"}</span></div><span class="pill ${due(c)?"due":"later"}">${due(c)?"due":"later"}</span><button class="x" aria-label="Delete card" onclick="del('${c.id}')">×</button></div>`).join("")+`</div>`+(!LIMITS.bulk?"":"");}
function del(id){cards=cards.filter(c=>c.id!==id);save();renderDeck();renderStats();}
document.getElementById("addForm").addEventListener("submit",e=>{e.preventDefault();const q=document.getElementById("q").value.trim(),a=document.getElementById("a").value.trim();if(!q||!a){toast("Fill in both question and answer");return;}if(LIMITS.maxItems>0&&cards.length>=LIMITS.maxItems){toast("Free edition is full — add up to "+LIMITS.maxItems+" cards");return;}cards.unshift({id:uid(),q,a,due:Date.now(),interval:0,reps:0});save();document.getElementById("q").value="";document.getElementById("a").value="";renderDeck();renderStats();toast("Card added");});
function renderData(){const b=document.getElementById("dataBody");let h="";if(LIMITS.export){h+=`<div class="row"><button class="btn primary" onclick="exp()">Export my data</button><label class="btn ghost" style="cursor:pointer">Import my data<input type="file" accept="application/json" id="imp" style="display:none"></label></div>`;document.getElementById("imp")?.addEventListener("change",imp);}else{h+=`<div class="up">Exporting and importing your data as JSON is available in the full edition.</div>`;}if(LIMITS.history){h+=`<p class="note">Cue tracks when each card is next due so reviews land right before you'd forget them.</p>`;}b.innerHTML=h;}
function exp(){const blob=new Blob([JSON.stringify(cards,null,2)],{type:"application/json"});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download="cue-flashcards.json";a.click();URL.revokeObjectURL(u);toast("Exported "+cards.length+" cards");}
function imp(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;cards=d.filter(c=>c&&c.q&&c.a).map(c=>({id:c.id||uid(),q:String(c.q),a:String(c.a),due:+c.due||Date.now(),interval:+c.interval||0,reps:+c.reps||0}));save();renderDeck();renderStats();toast("Imported "+cards.length+" cards");}catch(err){toast("That file couldn't be read");}};r.readAsText(f);e.target.value="";}
function setTab(t){document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===t));document.querySelectorAll(".stage").forEach(s=>s.classList.toggle("on",s.id==="tab-"+t));if(t==="study")startSession();if(t==="deck")renderDeck();if(t==="data")renderData();}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
document.getElementById("theme").addEventListener("click",()=>{if(LIMITS.themes==="one"&&theme!=="dark"){toast("Light mode is in the full edition");return;}setTheme(theme==="dark"?"light":"dark");});
function init(){const tb=document.getElementById("tier");tb.textContent=TIER;tb.className="badge"+(TIER==="full"?" full":"");setTheme(theme);if(!LIMITS.themes||LIMITS.themes==="one"){document.getElementById("theme").style.display="none";}renderStats();renderDeck();renderData();const f=document.getElementById("foot");f.innerHTML=TIER==="basic"?"Cue · works offline, no account, data stays on this device. <span style="color:var(--muted)">Free edition caps your deck at "+LIMITS.maxItems+" cards.</span>":"Cue · works offline, no account, data stays on this device.";}
init();
</script>
</body>
</html>
